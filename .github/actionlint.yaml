self-hosted-runner:
  # hellmini: Mac mini M5 Pro, self-hosted for release jobs only (nexus-yd9po).
  # Registered with --no-default-labels, so it carries ONLY this custom label
  # -- no 'self-hosted'/'macos'/'arm64' defaults -- hence `runs-on: hellmini`
  # (a bare custom label, not an array with 'self-hosted') in the workflows
  # that target it.
  #
  # hellmini-ci: the second runner on the same box, macOS user `ghci`, for the
  # Service CI Java job on owner pushes (nexus-f5i1m) and the isolation probe
  # (nexus-vyg07). Same bare-label registration. service-ci.yml's runs-on is an
  # expression, which actionlint does not resolve, so only the probe needs this.
  #
  # qwen-linux: the WSL runner on qwentescence, Linux user `ghci`. Unlike the two
  # above it carries the default labels too (self-hosted, Linux, X64), so ci.yml's
  # `test-qwen` job names the whole set; this entry declares the custom one.
  labels:
    - hellmini
    - hellmini-ci
    - qwen-linux
