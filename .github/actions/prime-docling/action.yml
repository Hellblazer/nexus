name: Prime docling artifacts
description: >-
  Provision the extracted docling layout + TableFormer + CodeFormula model
  artifacts into ~/.cache/nexus/docling-artifacts for CI. Restores from the
  Actions cache; on a miss, downloads and extracts OUR self-hosted GitHub
  release asset (no HuggingFace dependency) — same pattern as
  prime-bge-onnx / prime-crossencoder-onnx.

  History (nexus-cxsbs / nexus-c7gnx): docling loads layout + TableFormer +
  CodeFormula LAZILY at convert() time, so an anonymous HF fetch happened
  mid-suite; when it failed it fell back to PyMuPDF and produced ~21
  baffling extraction_method=='docling' assertion failures. The fix was one
  deterministic download of our own release asset
  (NEXUS_DOCLING_ARTIFACTS_PATH points docling at the extracted dir so it
  never resolves through the hub at all).

  Until nexus-tl7bu, that download had no actions/cache in front of it and
  re-fetched the ~1GB tarball on EVERY job — measured 2026-09-03: 20 minutes
  on a single shard, cancelling it under the job timeout. This action puts
  the extracted directory behind actions/cache keyed on the asset tag, same
  shape as the ONNX assets: download once per cache key, restore
  thereafter.

inputs:
  cache-key:
    description: >-
      actions/cache key. Use an arch-qualified key for multi-arch matrix
      jobs so each runner architecture caches independently.
    required: false
    default: ""
  asset-tag:
    description: >-
      GitHub release tag that hosts docling-artifacts-v1.tar.gz. Regenerate
      with:
        docling-tools models download -o <dir> layout tableformer code_formula
        tar -czf docling-artifacts-v1.tar.gz -C <dir> .
      then cut a -v2 tag if a docling bump changes the model set.
    required: false
    default: ci-assets-docling-v1

  persistent-home:
    description: >-
      'true' when $HOME outlives the job and is shared with jobs running at
      the same time (the lab pool runners, nexus-480wm). The Actions cache
      is then skipped: restoring a tarball over files a sibling job is
      reading would corrupt its run. The files already on disk are used
      when their digests match, and a download lands by rename.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Restore docling artifacts cache
      id: cache
      if: inputs.persistent-home != 'true'
      # Keyed on the ASSET TAG (nexus-tl7bu): the extracted models are an
      # immutable export of that tag, so they download once per tag and
      # restore thereafter; cutting a new asset tag invalidates the cache
      # by construction, with no separate key bump to forget.
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/.cache/nexus/docling-artifacts
        key: ${{ inputs.cache-key != '' && inputs.cache-key || format('docling-{0}-{1}', inputs.asset-tag, runner.os) }}

    - name: Fetch docling models from our own mirror on cache miss
      # WE HOST THESE. Nothing here may reach HuggingFace.
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ASSET_TAG: ${{ inputs.asset-tag }}
        PERSISTENT_HOME: ${{ inputs.persistent-home }}
      run: |
        set -euo pipefail
        PERSISTENT_HOME="${PERSISTENT_HOME:-false}"
        target="$HOME/.cache/nexus/docling-artifacts"
        marker=".complete-${ASSET_TAG}"
        if [ "$PERSISTENT_HOME" = "true" ] && [ -f "$target/$marker" ]; then
          echo "docling artifacts for ${ASSET_TAG} already on disk; nothing to fetch."
          exit 0
        fi
        mkdir -p "$(dirname "$target")"
        if [ "$PERSISTENT_HOME" != "true" ]; then
          mkdir -p "$target"
        fi
        echo "docling artifacts cache miss; fetching from self-hosted release ${ASSET_TAG}."
        # The tarball goes in the runner's per-job temp dir, never a fixed name
        # in /tmp: on a self-hosted box that several users share (qwen-linux),
        # a file another user left at that path makes the download fail, and a
        # fixed name in a shared directory is a symlink-replacement target.
        tarball="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/docling-artifacts.XXXXXX")"
        trap 'rm -f "$tarball"' EXIT
        curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
          -o "$tarball" \
          "https://github.com/${GITHUB_REPOSITORY}/releases/download/${ASSET_TAG}/docling-artifacts-v1.tar.gz"
        if [ "$PERSISTENT_HOME" != "true" ]; then
          tar -xzf "$tarball" -C "$target"
          exit 0
        fi
        # Shared $HOME (nexus-480wm): extract beside the target and rename the
        # whole directory in, so a job running at the same time sees either no
        # directory or a complete one. rename(2) through python3, because
        # `mv` onto an existing directory moves INTO it and `mv -T` is GNU only.
        staging="$(mktemp -d "$(dirname "$target")/docling-artifacts.staging.XXXXXX")"
        trap 'rm -f "$tarball"; rm -rf "$staging"' EXIT
        tar -xzf "$tarball" -C "$staging"
        touch "$staging/$marker"
        if [ -e "$target" ] && [ ! -f "$target/$marker" ]; then
          # No marker: another asset tag's files, or an extract that died.
          rm -rf "$target"
        fi
        if ! python3 -c 'import os, sys; os.rename(sys.argv[1], sys.argv[2])' "$staging" "$target" 2>/dev/null; then
          # A sibling job renamed its copy in first.
          test -f "$target/$marker" || { echo "::error::docling artifacts at $target are incomplete and could not be replaced"; exit 1; }
          echo "a sibling job provisioned the docling artifacts first; using them."
        fi

    - name: Export NEXUS_DOCLING_ARTIFACTS_PATH
      shell: bash
      run: echo "NEXUS_DOCLING_ARTIFACTS_PATH=$HOME/.cache/nexus/docling-artifacts" >> "$GITHUB_ENV"
