name: Resolve Python (Windows release runner)
description: >-
  Find a Python 3.12+ on the self-hosted win-release runner and export it as
  PYTHON for the steps that follow (RDR-224, nexus-f9bgu.14). The Windows PG
  bundle scripts are stdlib-only, so any 3.12+ interpreter will do. Prefers
  the one uv manages (uv python find 3.13, installing it for the service
  account when absent), then a python on PATH that is not
  the Microsoft Store stub. Fails loud, naming what to install, rather than
  letting a later step die on a missing or too-old interpreter.

runs:
  using: composite
  steps:
    - name: Resolve Python 3.12+
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Native commands run through Process with both streams redirected.
        # Under the runner SERVICE (no console), pwsh 7.6 refuses `& uv ... 2>$null`
        # with "StandardOutputEncoding is only supported when standard output is
        # redirected" (seed run 37408239980), so nothing here uses pwsh's own
        # native-command redirection.
        function Invoke-Captured([string]$exe, [string[]]$argv) {
          $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
          foreach ($a in $argv) { $psi.ArgumentList.Add($a) }
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.RedirectStandardInput = $true
          $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.Close()
          $errTask = $p.StandardError.ReadToEndAsync()
          $out = $p.StandardOutput.ReadToEnd()
          $p.WaitForExit()
          [void]$errTask.Result
          [pscustomobject]@{ Code = $p.ExitCode; Out = $out.Trim() }
        }
        $py = $null
        $uv = Get-Command uv -ErrorAction SilentlyContinue
        if ($uv) {
          $r = Invoke-Captured $uv.Source @('python', 'find', '3.13')
          if ($r.Code -ne 0 -or -not $r.Out) {
            # uv keeps its Pythons per user, so a fresh service account has none.
            $i = Invoke-Captured $uv.Source @('python', 'install', '3.13')
            if ($i.Code -eq 0) { $r = Invoke-Captured $uv.Source @('python', 'find', '3.13') }
          }
          if ($r.Code -eq 0 -and $r.Out) { $py = $r.Out }
        }
        if (-not $py) {
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.Source -notmatch 'WindowsApps') { $py = $cmd.Source }
        }
        if (-not $py) {
          throw 'no Python found: install uv or Python 3.13 for the runner service account'
        }
        $r = Invoke-Captured $py @('-c', 'import sys; print("%d.%d" % sys.version_info[:2])')
        $ver = $r.Out
        if ($r.Code -ne 0 -or -not $ver -or [version]$ver -lt [version]'3.12') {
          throw "Python '$ver' at $py is unusable or older than 3.12"
        }
        "PYTHON=$py" >> $env:GITHUB_ENV
        Write-Host "python: $py ($ver)"
