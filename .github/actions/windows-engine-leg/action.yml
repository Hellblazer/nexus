name: Build, check, package and smoke the windows-x64 engine
description: >-
  The windows-x64 engine leg's build recipe (RDR-224 P1.2, nexus-f9bgu.9), shared
  by the release leg (engine-service-release.yml, build-publish-engine-windows) and
  the rehearsal (windows-pg-bundle-rehearsal.yml, engine) so the rehearsal runs the
  SAME steps the tag does and the first real run of a change here is not the tag.
  Runs on the self-hosted win-release runner only. Steps: pre-generated jOOQ
  sources, release_version stamp, MSVC environment, native build with the
  embedded-resources report, the embedded-resources check, the Windows dependency
  check (dumpbin on the exe and every embedded native library), the .txz in the
  P0.4 layout with the four VC++ DLLs, and the smoke against the Windows PG
  bundle. Signing and upload stay in the calling job (tag runs only).

  jOOQ sources come from the jooq-codegen job's artifact (-Pprebuilt-jooq), as
  on the other three legs: codegen boots a pgvector container through
  testcontainers, and a Windows runner has no Docker. The generated sources are
  plain Java, identical on every OS, so one linux codegen run gives all four
  legs the same schema identity.

  Runner prerequisites (on top of the PG bundle leg's): Visual Studio 2022 Build
  Tools with the x64 C++ tools (cl, link, dumpbin) and its VC redist folder;
  network access to download GraalVM (setup-graalvm) and, on a first run, the
  bge model from this repository's ci-assets-bge-768-v1 release.

inputs:
  version:
    description: release_version to stamp into the binary (tag runs); empty leaves it blank, as a dev build.
    required: false
    default: ''
  pg-archive:
    description: Path to nexus-pg-windows-x64.txz, the Windows PG bundle the smoke boots the engine against.
    required: true
  out-dir:
    description: Directory that receives nexus-service-windows-x64.txz and its .sha256.
    required: false
    default: dist

runs:
  using: composite
  steps:
    - name: Resolve Python
      uses: ./.github/actions/resolve-windows-python

    - name: Set up GraalVM 25.0.3
      # SHA-pinned: this is a publish path. No maven cache (unlike the hosted legs):
      # the runner is persistent, so ~/.m2 is already warm, and the cache action's
      # zstd dependency is one more thing to install on it.
      uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2  # v1
      with:
        java-version: '25.0.3'
        distribution: 'graalvm'

    - name: Download pre-generated jOOQ sources
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: jooq-sources
        path: service/target/generated-sources/jooq

    - name: Stamp release_version into the binary (tag runs)
      if: inputs.version != ''
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        # Via env, not interpolated into the script: a tag can contain shell metacharacters.
        & $env:PYTHON scripts\windows_engine_release.py stamp --file service\src\main\resources\META-INF\nexus\release.properties --version $env:RELEASE_VERSION
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Load the MSVC build environment
      shell: pwsh
      run: |
        # native-image drives cl and link, which exist only after vcvars64.bat.
        & $env:PYTHON scripts\windows_engine_release.py vcvars
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build native image (-Pnative -Pprebuilt-jooq)
      shell: cmd
      working-directory: service
      env:
        # nexus-zz2w7: native-image writes target/embedded-resources.json (every embedded
        # resource and the jar it came from) for the two checks below. No extra build.
        NATIVE_IMAGE_OPTIONS: "-H:+UnlockExperimentalVMOptions -H:+GenerateEmbeddedResourcesFile"
      run: |
        rem No -q (the checker reads the Maven execution lines) and no clean (it would wipe
        rem the downloaded jOOQ sources). 12g: measured on this box (nexus-f9bgu.8).
        call mvnw.cmd -B -ntp -Pnative -Pprebuilt-jooq -DskipTests -Dnative.image.maxheap=12g package > "%RUNNER_TEMP%\native-build.log" 2>&1
        set BUILD_RC=%ERRORLEVEL%
        type "%RUNNER_TEMP%\native-build.log"
        exit /b %BUILD_RC%

    - name: Check the embedded native resources (nexus-zz2w7)
      shell: pwsh
      run: |
        & $env:PYTHON scripts\check_native_embedded_resources.py --report service\target\embedded-resources.json --build-log "$env:RUNNER_TEMP\native-build.log" --platform windows-x64
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Check the Windows binary dependencies (dumpbin)
      shell: pwsh
      run: |
        # The Windows counterpart of the other legs' ABI-floor step: the exe AND every
        # native library it embeds may import only the four shipped VC++ DLLs, Windows
        # system DLLs, or (for an embedded library) a sibling extracted beside it.
        & $env:PYTHON scripts\windows_engine_release.py check-deps --exe service\target\nexus-service.exe --report service\target\embedded-resources.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Package nexus-service-windows-x64.txz (exe + four VC++ DLLs + notice)
      shell: pwsh
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        & $env:PYTHON scripts\windows_engine_release.py package --exe service\target\nexus-service.exe --out-dir $env:OUT_DIR
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Smoke the packaged engine against the Windows PG bundle
      shell: pwsh
      env:
        OUT_DIR: ${{ inputs.out-dir }}
        PG_ARCHIVE: ${{ inputs.pg-archive }}
      run: |
        # Boots the EXTRACTED archive (not service\target) beside only its own DLLs: health,
        # every changeset applied (count read from the changelog), a 768-dim bge embedding.
        & $env:PYTHON scripts\engine_windows_smoke.py --engine-archive "$env:OUT_DIR\nexus-service-windows-x64.txz" --pg-archive $env:PG_ARCHIVE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
