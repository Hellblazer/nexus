name: CI commit coverage audit (nexus-of2x8)

# DETECT, not prevent (remedy (c) from the bead, Sam-authorized -- see the
# bead body and scripts/check_ci_commit_coverage.py's module docstring for
# the full account). ci.yml's doc-only fast lane and its cancel-in-progress
# concurrency group are each individually correct, and their composition has
# a gap: a code commit's own run can be CANCELLED by a later push, and if
# that later push (or a run of pushes after it) is itself docs-only, the
# doc-only predicate's before..HEAD range never contains the cancelled
# commit. The result is silent: a SKIPPED pytest job reports SUCCESS to
# branch protection, so develop goes green while carrying a commit whose
# code no test has ever touched. Measured 2026-09-21/22 (nexus-00 + nexus-0d):
# dbf255efe's own run (35683993461) was cancelled, and the replacement run's
# range (dbf255efe..df3a688fd) correctly read docs-only over the three docs
# commits pushed after it -- but dbf255efe itself, the EXCLUSIVE lower bound,
# was in neither range.
#
# THE OTHER THREE REMEDIES WERE REJECTED (Sam, see the bead): (a) needs a
# durable "last exercised sha" record that does not exist; (b) exempting a
# run from cancellation when it touches code inverts the cost logic the
# concurrency group exists for; (d) is the status quo, whose only catch so
# far was a human noticing a suspiciously fast run. This workflow is the
# ONLY remedy that adds an observer without weakening either mechanism CI
# Cost Discipline (AGENTS.md) sanctions by name.
#
# WHY A SEPARATE WORKFLOW rather than a new job in ci.yml: this audit's
# input is the *history* of past ci.yml runs, not the tree at this push --
# folding it into ci.yml's own `needs:` graph would make ci.yml's fan-in
# (`pytest-gate`) depend on ci.yml's own prior runs, which is circular by
# construction (a run cannot depend on the completed state of the run that
# supersedes it). A standalone workflow reads ci.yml's history via the
# read-only Actions API, which is exactly the "evidence, not re-execution"
# shape scripts/check_release_ci_evidence.py already uses for a different
# gate.
#
# TRIGGER: `workflow_run` on ci.yml's own `completed` event, NOT `push`
# (nexus-of2x8 round 2, 2026-09-22 -- this audit's own first live run went
# red on a false positive it created for itself). `on: push` fires this
# audit at the SAME instant as ci.yml's own run for that push, which is
# ALWAYS still queued/in_progress at that moment -- the audit's search for
# "the most recent COMPLETED code-exercised run" fell back to the PREVIOUS
# push and reported four just-pushed, currently-being-tested commits
# BLOCKED. `workflow_run.completed` fires only once ci.yml's run for a given
# push has CONCLUDED -- success, failure, OR cancelled, all three (verified:
# GitHub fires `workflow_run.completed` for every conclusion, including a
# concurrency-cancelled run) -- so the covering run for the push under audit
# is, by construction, no longer in flight when this script looks for it.
# This does not remove the in-flight code path in check_ci_commit_coverage.py
# (a superseding push's run can still be genuinely in progress when a
# CANCELLED run's own completion fires this audit -- see that script's
# module docstring), it removes the race for the common case: a push whose
# own run runs to completion without being superseded.
#
# `types: [completed]` + the job-level `if:` below scope this to ci.yml runs
# that were themselves triggered by a PUSH to `develop` -- ci.yml also runs
# on `pull_request`, and `workflow_run` fires for ANY completed run of the
# named workflow regardless of what triggered it, so both fields on
# `github.event.workflow_run` must be checked, not just one.
#
# CHECKOUT REF: `github.event.workflow_run.head_sha`, explicit. A
# `workflow_run`-triggered workflow's default checkout ref is NOT
# necessarily the commit that triggered the source workflow (it can be the
# default branch's tip AT THE TIME this event fires, which may already be
# newer) -- explicit `ref:` makes "the commit this audit is about" and "the
# commit actually checked out" the same fact rather than something usually
# true. `--head` is passed the same sha explicitly for the identical reason;
# `$GITHUB_SHA` under `workflow_run` does NOT reliably name it.
#
# CI-COST SHAPE: a few GitHub API calls (bounded by --max-runs-scanned,
# typically 1-3 calls in practice since a code-touching push is common) plus
# a full-history checkout and a handful of `git` subprocess calls -- no
# test execution, no build, no matrix. This is the whole point of "detect":
# the cost is API reads, not re-running pytest.
#
# THIS NEVER BLOCKS A MERGE. develop has no branch protection / required
# checks on push (only PRs do), so a red run here is purely visible: a red
# check on develop's commit history, nothing more. That is deliberate --
# "detect rather than prevent" means exactly this: it never competes with
# cancel-in-progress or the doc-only fast lane for control of what runs, it
# only reports on what already happened.
#
# EXPECTED RESIDUAL NOISE (stated plainly, not discovered the hard way a
# second time): a routine back-to-back push still produces one transient
# CANNOT VERIFY audit run -- the CANCELLED push's own `workflow_run.completed`
# event fires this audit while the SUPERSEDING push's ci.yml run is still
# alive (that in-flight run is what caused the cancellation in the first
# place, so it reliably exists in the runs list at that moment). That audit
# correctly reports CANNOT VERIFY (an in-flight run covers the cancelled
# commit) rather than a false BLOCKED, and is superseded moments later by a
# green audit once the newer push's own run concludes. This is a true
# statement of a real, momentary "not yet known" state, not a bug -- accept
# it as expected, self-resolving noise on rapid-fire pushes rather than
# something to silence.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Static group, NOT keyed on the triggering run's sha: this audit's own
  # runs recompute coverage from scratch against a FIXED head each time
  # (github.event.workflow_run.head_sha), so a back-to-back sequence of
  # ci.yml completions on develop is safe to serialize/cancel the same way
  # ci.yml itself does -- a newer push's audit checks a strict superset of
  # what an older push's audit would have found (this repo's own convention
  # is linear history on develop, no force pushes -- AGENTS.md Worktrees
  # rule 8), so cancelling a stale audit here costs no information the next
  # one will not already re-derive.
  group: ci-commit-coverage-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Every develop commit since the last code-exercised run is covered
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scope to ci.yml runs that were themselves triggered by a push to
    # develop -- workflow_run fires for ANY completed run of "CI" regardless
    # of what triggered it (pull_request included), and this audit's
    # coverage model is specifically about develop's push history.
    if: >-
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # Explicit ref: see the TRIGGER/CHECKOUT REF comment above -- a
          # workflow_run-triggered checkout's default ref is not reliably
          # the commit under audit.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history required: the audit walks `git rev-list H..HEAD`
          # and `git merge-base --is-ancestor` against commits that can be
          # arbitrarily far back (bounded only by --max-runs-scanned's
          # lookback into ci.yml's own run history, not by any fixed commit
          # count).
          fetch-depth: 0

      - name: Audit commit coverage since the last code-exercised ci.yml run
        # Stdlib-only script (urllib, subprocess, argparse, json) -- no `uv
        # sync`, no interpreter setup beyond the runner's bundled python3,
        # matching check_release_ci_evidence.py's own "runs under bare
        # python3" design for exactly the same reason (cheapest possible
        # leg for a read-only evidence check).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/check_ci_commit_coverage.py
          --head ${{ github.event.workflow_run.head_sha }}
