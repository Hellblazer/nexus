name: CI

on:
  push:
    # develop ONLY (2026-07-06 CI-cost pass): a push to main is always a
    # release-PR merge whose identical tree just passed this workflow as the
    # PR's required checks minutes earlier — the post-merge run was pure
    # duplication (including a live CA-3 hit, since release commits always
    # touch pyproject/uv.lock). main stays protected by its PR-required
    # checks; nothing lands on main outside a PR.
    # Doc-only skipping is handled by the job-level `changes` predicate +
    # pytest-gate fan-in (nexus-n0ful) — a workflow-level paths filter would
    # leave required checks permanently "Expected — waiting" on doc-only
    # PRs, and two overlapping skip mechanisms with different path sets was
    # the incoherence flagged in review.
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs AND develop pushes (2026-07-06 CI-cost
  # pass): back-to-back develop pushes were stacking full ~20-min runs for
  # commits already made stale by the next push. The old "never cancel
  # main" concern (tag pushes cancelling version-bump CI) is moot now that
  # main is not a push trigger at all and tags run a different workflow
  # with its own concurrency group.
  cancel-in-progress: true

jobs:
  lint:
    # nexus-ls88v (epic nexus-whh61 F7): the structlog-only / no-print-in-library
    # / audited-broad-except discipline was previously convention-only — 73
    # BLE001 + 284 PLC0415 noqa were version-controlled but unenforced because no
    # CI lint job existed. This job runs the committed [tool.ruff] ruleset so a
    # NEW print()/blind-except/lazy-import that lacks a justified per-line noqa
    # fails the PR. Ruff is pinned to the version the F7 audit was performed with
    # so local `uv run ruff` (>=0.15.18) and CI agree on rule behaviour.
    name: ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Lint src/ with ruff
        # uvx fetches the standalone ruff (no project build / heavy-dep sync).
        # Pinned exact for determinism; the [tool.ruff] config in pyproject.toml
        # is read automatically.
        run: uvx ruff@0.15.18 check src/

  release-ledger-gate:
    # nexus-55r6o: pre-tag wire-contract-ledger check.
    #
    # release.yml's "Verify cloud engine meets required floor" step runs
    # check_client_lag_ledger via --paired-deploy-auto with no
    # --ack-client-lag -- there is no human present at tag-push time to name
    # a bead. An unacknowledged docs/wire-contract-pending.md ## Unshipped
    # entry fails that step CLOSED on the tagged commit's FROZEN tree, and
    # the workflow_dispatch retry path cannot fix it: it checks out the SAME
    # immutable tag (actions/checkout `ref: inputs.tag`), so a ledger fix
    # landed after the tag exists is invisible to a retry -- it re-reads the
    # identical unacknowledged entry and fails identically (see release.yml's
    # "REMEDY, CORRECTED (nexus-55r6o...)" comment on that step). The two
    # real remedies are (a) cut a fresh tag whose tree carries the ledger
    # fix, or (b) THIS job: run the identical ledger-only check earlier, on
    # the release PR, while the tree is still mutable.
    #
    # `--ledger-only` (scripts/check_engine_release_floor.py, added for this
    # bead) runs the SAME check_client_lag_ledger the publish step runs,
    # isolated from the network probe (check_floor) and the git-only
    # ancestry check (check_source_ancestry) that surround it there -- it is
    # purely a read of docs/wire-contract-pending.md against the checked-out
    # tree. No network calls, no cloud state, so PR-time and tag-push-time
    # agree on what "clean" means for the one part of the gate that is
    # tree-static (cloud state at PR time is not publish-time state, which is
    # exactly why the floor/cloud probe stays at publish time, untouched).
    #
    # JOB-LEVEL SKIP (CI Cost Discipline: "skipped == success for branch
    # protection"): fires on ANY pull_request targeting main, matching the
    # existing release-boundary precedent at the `test` matrix's
    # python-version expression below (`github.event_name == 'pull_request'
    # && github.base_ref == 'main'`) -- deliberately NOT narrowed to
    # `release/*`-named head branches. A hand-named branch releasing to main
    # (the normal case is `release/*` per AGENTS.md release Step 7, but
    # nothing enforces that naming) already gets the full pytest matrix via
    # that same precedent; narrowing THIS gate to `release/*` would silently
    # skip exactly the check it exists to run pre-tag on such a branch, while
    # costing nothing to keep broad -- every main-targeting PR already pays
    # for the wider pytest matrix, so there is no cost argument for scoping
    # this cheap job any tighter. Every other PR (develop-bound feature work)
    # skips at the JOB level with zero checkout cost -- a native `if:`
    # boolean expression over GitHub's own event context, not a paths-filter
    # action output, so there is no "malformed output" failure mode requiring
    # a separate non-vacuity assert step (contrast the `changes` /
    # `write-seam-gate` jobs below, which DO need one because dorny/paths-filter
    # can itself emit an empty or malformed string).
    #
    # MERGE-BLOCKING, MECHANICALLY, NOT ADVISORY (substantive-critic Critical
    # finding, same review round): this job is wired into `pytest-gate`'s
    # `needs:` below, so its result is evaluated by the ALREADY-REQUIRED
    # `pytest-gate` check -- a release PR CANNOT merge with this job red. No
    # separate branch-protection required-context entry for THIS job's own
    # name, and no GitHub repo-settings click, is needed to make that true.
    # `REQUIRED_CHECK_CONTEXTS` in scripts/check_release_ci_evidence.py
    # (currently `("pytest-gate",)`, mirroring main's live required
    # contexts) deliberately does NOT gain a second entry for this job's
    # name either -- pytest-gate's own green check-run at the tagged commit
    # already proves release-ledger-gate succeeded (pytest-gate's fan-in
    # step below fails closed if it did not), so a second required-context
    # entry would be redundant evidence of the same fact, not new coverage.
    #
    # DELIBERATE FRICTION, STATED EXPLICITLY: the ledger this job reads
    # (docs/wire-contract-pending.md) is repo-GLOBAL, not per-PR, and this
    # job's own CI invocation carries no `--ack-client-lag` (no interactive
    # human at CI time to name a bead). So a single unacknowledged
    # `## Unshipped` entry blocks EVERY PR targeting main -- not just the
    # release PR that will eventually tag -- until someone acknowledges it
    # (lands the client half, moving the entry to `## Shipped`) or a human
    # deliberately edits the ledger. This is intended, not a bug: it mirrors
    # the ledger's own philosophy (see docs/wire-contract-pending.md's
    # header) that an unshipped both-halves commit is a standing release
    # risk the whole team should feel, not a fact only the release operator
    # discovers at tag time.
    name: PR-to-main wire-contract ledger gate (nexus-55r6o)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Install project
        run: uv sync

      - name: Wire-contract ledger check (pre-tag, tree-static, no network)
        run: uv run python scripts/check_engine_release_floor.py --ledger-only

  changes:
    # nexus-h18n5: computes docs_only DIRECTLY from git diff in this job's own
    # shell -- no dorny/paths-filter, no GitHub PR-files API. Incident (PR
    # #1464, 2026-08-18): dorny's PR-files API returned an EMPTY changed-file
    # list seconds after PR creation ("Matching files: none"), and predicate-
    # quantifier 'every' silently folded that emptiness to docs_only=false ->
    # code=true, running the full matrix on a 3-file docs/rdr diff. The API
    # call was the failure surface; git diff against a checkout we already
    # have (fetch-depth:0 below) has no equivalent "API answered nothing"
    # failure mode -- it either finds the base commit and diffs it, or it
    # doesn't, and REPORTS WHICH (see the "gate" step below).
    #
    # nexus-n0ful (superseded by nexus-h18n5's git-direct computation; kept
    # for the design record): this predicate directly controls whether the
    # expensive service-jar + pytest-shard matrix runs at all, so it must be
    # ACCURATE, not conservative-toward-always-true. Getting it wrong the
    # "safe" way (always true) would just make the fast lane a no-op for the
    # 92%-of-runs push case (project_ci_cost_structure) — the whole point of
    # this job.
    #
    # predicate-quantifier semantics preserved: docs_only is true only when
    # EVERY changed file matches the path set below (a subset check, not an
    # any-match). That is the doc-only PREDICATE: "this diff touches nothing
    # but docs/changelog/license."
    #
    # Strict path set (design doc, T1 scratch 34d6700b), unchanged: docs/**,
    # README.md, CHANGELOG*, conexus/CHANGELOG.md, LICENSE*. Root `*.md` was
    # too broad — AGENTS.md (and the CLAUDE.md symlink to it) are TEST
    # INPUTS (tests/test_engine_release_skill_parity.py and
    # tests/daemon/test_lifecycle_gate.py read them at assert time), so an
    # AGENTS.md-only push must still run pytest; only README.md qualifies as
    # root-level prose. LICENSE* covers LICENSE and LICENSING.md, neither is
    # a test input. conexus/** is DELIBERATELY excluded —
    # tests/test_plugin_structure*.py and tests/hooks/** pin files under
    # conexus/, so a conexus/** change is code as far as this predicate is
    # concerned. CHANGELOG* is ROOT-LEVEL ONLY: a bare `case` arm with no
    # leading `*/` requires the WHOLE path to start with "CHANGELOG", so
    # docs/CHANGELOG.md or conexus/CHANGELOG.md do NOT match it — the latter
    # gets its own exact-match arm for exactly that reason. docs/** is
    # recursive without needing `**`: shell `case` pattern matching is plain
    # string matching, not filesystem pathname expansion, so `*` in `docs/*`
    # DOES cross `/` (unlike glob() filename generation, which stops at `/`).
    #
    # This predicate is the SINGLE doc-skip mechanism — there is no
    # workflow-level `paths-ignore` under `on.push` / `on.pull_request` (that
    # form hangs required checks on doc-only PRs).
    #
    # OTHER dorny/paths-filter USAGES IN THIS REPO ARE UNCHANGED BY DESIGN.
    # CA-3/write-seam-gate below, and engine-service-build's `svc` predicate,
    # KEEP dorny: their own comments document a DIFFERENT risk profile —
    # "always true on a develop push" as a deliberate safety net, where an
    # empty/malformed file list resolving toward true just spends extra CI
    # cost and never skips something that needed to run. THIS job is the one
    # place an emptiness bug bought a false NEGATIVE (a skip that shouldn't
    # have happened), which is why it alone gets the git-direct treatment —
    # do not "unify" the CA-3 / write-seam-gate / svc jobs onto this pattern;
    # they were never the ones that broke.
    name: doc-only fast lane predicate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0  # full history needed to resolve the base/before commit below

      - name: Compute the doc-only predicate directly from git (no dorny, no PR-files API)
        id: gate
        # NON-VACUITY (the actual PR #1464 bug): an EMPTY changed-file list
        # against two RESOLVED, REACHABLE commits is a malformed predicate
        # input — FAIL THIS JOB (exit 1), never resolve it to docs_only true
        # or false. A genuinely empty diff can't reach CI (pushes and PRs
        # always carry at least one commit), so hitting this arm means the
        # diff computation itself is broken, not that nothing changed.
        #
        # Separately: the BASE/BEFORE commit can be legitimately unusable
        # (a brand-new branch's first push, a force-push that rewrote the
        # previous tip out of this checkout's history) — that is NOT the
        # same failure as an empty diff against good SHAs. Per the fail-
        # loud-but-conservative-toward-true philosophy this job has always
        # used, an unusable base/before SHA resolves to code=true (run the
        # full matrix) through an explicit, loudly-logged named branch below
        # — never a silent fallthrough, and never the emptiness bug's exit 1.
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Three-dot diff: merge-base(BASE, HEAD)..HEAD, matching PR
            # review semantics (what this PR actually adds relative to
            # where it branched from), not a raw two-commit comparison.
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ]; then
              echo "::warning::pull_request event but base.sha is empty or all-zeros ('$BASE_SHA') -- cannot compute a merge-base diff, falling back to code=true (conservative, named branch, not a silent default)"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::PR base sha $BASE_SHA is not reachable in this checkout despite fetch-depth:0 -- falling back to code=true (conservative, named branch, not a silent default)"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA}...HEAD")"
          else
            # PUSH events: diff against the previous position of THIS SAME
            # branch (github.event.before), preserving the same-branch
            # semantics dorny's `base: github.ref` "long-lived branches"
            # pattern deliberately chose over an unset base — an unset base
            # resolves push diffs against main (verified 2026-07-27,
            # nexus-4k91k), which would make docs_only permanently false on
            # develop (main and develop differ in ci.yml itself), i.e. this
            # predicate would never fire for its primary target.
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
              echo "::warning::push event but before-sha is empty or all-zeros ('$BEFORE_SHA') -- first push of a new branch (or an otherwise unusable before-SHA), cannot compute a same-branch diff, falling back to code=true (conservative, named branch, not a silent default)"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::warning::push before-sha $BEFORE_SHA is not reachable in this checkout -- likely a force-push that rewrote the previous tip out of history, falling back to code=true (conservative, named branch, not a silent default)"
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANGED_FILES="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "::error::computed changed-file list is EMPTY against two resolved, reachable commits -- a non-vacuous CI run always has at least one changed file, so this is a malformed predicate input (the PR #1464 failure class); never resolving to docs_only true or false. (One benign shape can trip this: a fully-rebased PR with a zero-net diff against its own base -- if you believe that is what happened here, re-run after rebasing off a base that actually differs.)"
            exit 1
          fi

          echo "changed files:"
          echo "$CHANGED_FILES"

          # predicate-quantifier 'every': docs_only is true only when EVERY
          # changed file matches the doc-path set below.
          #
          # ANCHORING (code-review-expert Critical, nexus-h18n5): `case`
          # pattern matching is plain string matching, not filesystem
          # pathname expansion -- `CHANGELOG*` and `LICENSE*` are UNANCHORED
          # against '/', so without the `*/*` guard below a pushed file like
          # `CHANGELOG.d/malicious_code.py` or `LICENSE-vendor/code.py`
          # would match the root-level arm and silently read as docs-only,
          # skipping the pytest matrix on an actual code change -- the
          # inverse-and-worse direction of the PR #1464 bug this job exists
          # to fix. The `*/*` arm below fires for ANY remaining path with a
          # directory component (once the two legitimately-nested arms,
          # `docs/*` and the exact `conexus/CHANGELOG.md`, have already had
          # first crack) and marks it code -- so `CHANGELOG*`/`LICENSE*`
          # below it only ever see slash-free, true root-level filenames.
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              docs/*) ;;
              conexus/CHANGELOG.md) ;;
              */*) docs_only=false ;;
              README.md) ;;
              CHANGELOG*) ;;
              LICENSE*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$docs_only" = "true" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  service-jar:
    # nexus-eqxxh: provision the shaded service JAR for the pytest matrix.
    #
    # WHY THIS EXISTS. The engine-substrate tests (t2_engine_substrate,
    # memory_consolidation, taxonomy_review_auto, the b6enc engine smoke) SKIP
    # on CI today, because tests/conftest.py::t2_service_env gates on
    # GITHUB_ACTIONS + an absent jar. That skip is the last thing standing
    # between the RDR-155 P4b autouse flip and a CI board that means something:
    # flip the default with no jar and EVERY engine-substrate test skips, so a
    # green board proves nothing.
    #
    # CI-COST SHAPE, per the standing directives:
    #  - ONE build for the whole matrix. The jar is a DETERMINISTIC ARTIFACT of
    #    service/pom.xml + service/src/main/**, so it is CACHED on exactly that
    #    input and rebuilt only on a key miss — which is precisely when a fresh
    #    build proves something.
    #  - The build step is skipped outright on a cache hit; the job then costs
    #    a checkout plus a cache restore.
    #  - JVM package, NOT the native image. `engine-service-build` above already
    #    owns the ~40min GraalVM trip-wire and is path-gated to service/**
    #    changes; this job needs only a runnable jar, which is minutes.
    #  - ubuntu-latest only. No premium runner: the artifact is
    #    platform-neutral bytecode.
    #
    # A clean checkout runs the testcontainers jOOQ codegen (Docker) because
    # the generated sources are NOT committed — which is exactly why the cache
    # is load-bearing rather than a nicety.
    name: service jar (pytest substrate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # nexus-n0ful: doc-only pushes/PRs need no engine substrate at all. Job-
    # level skip (never a workflow-level paths: filter — that hangs required
    # checks, see the pytest-gate job below for the fan-in that makes this
    # skip branch-protection-safe).
    #
    # success() is explicit and load-bearing: a custom `if:` REPLACES the
    # implicit "skip if any needed job didn't succeed" default rather than
    # extending it, so without success() a `changes` job FAILURE (not just a
    # doc-only skip) would leave this job's condition to fall through to
    # false only by the coincidence of an empty outputs.code — success()
    # makes the fail-loud-on-broken-predicate behavior explicit instead of
    # accidental.
    needs: changes
    if: success() && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Cache service jar
        id: jar-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: service/target/nexus-service-1.0-SNAPSHOT.jar
          # Keyed on the EXACT inputs the jar is a function of. No restore-keys:
          # a partial-match jar would be built from different sources, which is
          # the stale-jar class tests/db/_service_fixture.py::
          # jar_freshness_skip_reason exists to catch.
          key: service-jar-${{ runner.os }}-${{ hashFiles('service/pom.xml', 'service/src/main/**') }}

      - name: Set up GraalVM 25.0.3
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Build shaded jar (no tests, no native)
        if: steps.jar-cache.outputs.cache-hit != 'true'
        working-directory: service
        run: ./mvnw -q -DskipTests package

      - name: Upload jar for the pytest matrix
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: service-jar
          path: service/target/nexus-service-1.0-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

  test:
    name: pytest (Python ${{ matrix.python-version }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # nexus-eqxxh: the engine-substrate tests need the shaded jar. One build,
    # shared by every matrix leg (see the service-jar job's cost note).
    # nexus-n0ful: also needs `changes` directly (not just transitively via
    # service-jar) so this job's own `if:` below can read the predicate —
    # a job's `if:` can only see outputs of jobs listed in ITS OWN `needs:`.
    #
    # success() is explicit and load-bearing here too (see service-jar's
    # comment above for why): without it, a custom `if:` REPLACES rather than
    # extends the implicit "skip if a needed job failed" default, so a
    # service-jar BUILD FAILURE would no longer auto-skip this job — it would
    # instead run and fail later at the "Fetch the service jar" download
    # step, which still fails the leg (and therefore the pytest-gate fan-in)
    # but wastes a full job slot getting there.
    needs: [changes, service-jar]
    if: success() && needs.changes.outputs.code == 'true'
    env:
      # NON-VACUITY BACKSTOP, armed in the SAME change that provisions — which
      # is the whole point. tests/conftest.py::t2_service_env skips
      # engine-substrate tests on CI only while this is unset; with it set, an
      # ABSENT OR STALE JAR FAILS LOUDLY instead of silently reverting to the
      # skip. Provisioning without arming would leave the skip able to become
      # permanent the first time provisioning quietly broke.
      NX_T2_SUBSTRATE_EXPECTED: "1"
      # ENGINE EVERYWHERE since nexus-i711w (2026-07-28). No pin: the SQLite
      # substrate is deleted, so there is only one arm left to run.
      #
      # WHAT THIS REPLACED, because it was a deliberate cost decision and its
      # reversal should not read as drift. nexus-aqbrk ran ENGINE AT MERGE
      # BOUNDARIES, SQLite on interior PRs: `pull_request` took the SQLite arm
      # (~13m) and the develop PUSH after the merge took the engine default,
      # because the flip moved both PR pytest jobs from ~20m to 25-30m and 3.12
      # was CANCELLED at 30m18s against the cap below (PR #1428 run 1; 3.13
      # scraped through at 24m43s). Hal took that trade on 2026-07-27 —
      # an engine-only regression surfacing one merge later, absorbed by
      # develop as the integration branch.
      #
      # i711w removes the cheaper arm, so the trade is no longer available:
      # PR pytest now costs the engine arm's 25-30m on BOTH matrix versions.
      # That is a real, roughly 2x increase in routine PR minutes, and it is a
      # consequence of the substrate deletion rather than a fresh decision. The
      # levers if it needs clawing back are the matrix breadth on PRs (3.12
      # only, at the cost of the 3.13 required check) or path-gating the pytest
      # job — both are CI-cost calls for Hal, not something to fold in here.
      #
      # Left UNSET rather than set to a value: `none` would mean "provision no
      # T2 substrate", which is true of the CA-3 jobs below but emphatically
      # not of the unit suite.
    # nexus-n0ful: 45m -> 25m. The 45m ceiling was sized for one process
    # running the WHOLE unit suite (17:05 measured locally, 25-30m on
    # runners, cache-save overhead on top — see the history below, kept for
    # provenance). A 4-way duration-balanced shard puts each leg at roughly
    # a quarter of that wall time; 25m is a ceiling with real headroom over
    # the balanced-shard estimate, not a tight bound — a timeout is a
    # CEILING, not a reservation, GitHub bills actual runtime either way.
    #
    # Review-earned arithmetic (why not 20m): the shard divides only
    # RECORDED TEST time (~206s/leg, balanced via .test_durations.json). The
    # fixed per-leg setup pipeline — JDK/GraalVM, PG bundle, uv sync, HF +
    # docling cache restore (or a COLD FETCH on a cache miss), ci_warm_docling.py,
    # service-jar download — is paid by EVERY shard independently, not
    # divided by 4, and is exactly what drove both prior emergency bumps
    # (nexus-cxsbs: cold model fetch; nexus-aqbrk: the engine arm). On top of
    # that, ~200s of session-fixture/engine-boot overhead is visible in the
    # 1025s local wall vs the 825s recorded-test sum. 25m covers a cold-cache
    # leg with headroom; right-size down once real per-shard wall times exist
    # from CI (not local) runs.
    #
    # History (pre-sharding, single-process full-suite budget): at 20m a
    # v5.4.2 release run timed out DURING the cache upload (tests had already
    # passed). Raised 25->30 (nexus-cxsbs) to absorb the HF/docling model cache
    # save (~hundreds of MB) and a cold-cache model fetch on the first run
    # after a uv.lock bump. Raised 30->45 (nexus-aqbrk) for the ENGINE arm,
    # which measured 17:05 locally versus 13:33 for the since-deleted SQLite
    # arm and 25-30m on the runners — 3.12 was cancelled at 30m18s under the
    # old cap.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        # 3.13 RUNS ONLY AT THE MERGE BOUNDARY (Hal, 2026-07-28). i711w deleted
        # the SQLite arm, so every pytest leg now costs the engine arm's ~33.5
        # min; paying that twice on interior PRs bought little. `pytest (Python
        # 3.13)` was removed from DEVELOP's required contexts to match — main
        # still requires it, and release PRs target main, so the promotion that
        # actually ships still runs the full matrix.
        #
        # Measured before choosing (see T2 nexus/ci-cost-structure): pytest is
        # 92% of CI time, and the run mix is 31 push / 9 pull_request — so this
        # reaches only ~22% of runs. It is the smaller half of the clawback;
        # the larger half is push CADENCE (18 push-triggered runs in one day,
        # seven inside 40 minutes), which is a habit, not a workflow knob.
        #
        # 3.12 remains the representative leg everywhere. 3.13-only regressions
        # surface at the main boundary — accepted: 3.13 breakage has
        # historically been GHA-flake (nexus-9eaz family), not real drift.
        python-version: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && fromJSON('["3.12", "3.13"]') || fromJSON('["3.12"]') }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        # NO fetch-tags/fetch-depth here, deliberately (nexus-dhs30). The
        # engine-tag reader is exercised HERMETICALLY by
        # test_newest_published_engine_parses_the_tag_namespace, which builds its
        # own repo with known tags — so the parse bug it guards is caught without
        # this job paying for a tag or history fetch on every single push.
        # `fetch-tags: true` was tried here first and does NOT work: the
        # engine-service-v* tags point at commits outside a depth-1 history, so
        # the refs never materialise and the test still saw an empty list.
        # Tag visibility is needed only where the GATE runs — release.yml.

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: ${{ matrix.python-version }}
          # nexus-2ivn: setup-uv's bundled enable-cache only restored
          # ~1 MB of metadata in practice; the actual wheel cache was
          # missing and torch (~847 MB) re-downloaded on every run.
          # Disable the bundled cache and target the directory setup-uv
          # actually uses (UV_CACHE_DIR = ${{ runner.temp }}/setup-uv-
          # cache, not ~/.cache/uv) with an explicit actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
          # step below.
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          # Key on uv.lock so a dep change rebuilds; restore-keys
          # falls back to the last cache for the same python so a
          # uv.lock bump still seeds most of the wheels and only
          # the changed packages re-download.
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Cache MiniLM ONNX model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/chroma
          # RDR-155 P4b P3: the ~/.cache/chroma PATH survives chromadb's removal
          # by design — nexus.db.minilm_direct (the P0b tier-0 EF) keeps its
          # artifact there and fetches it straight from chroma's S3, with no
          # chromadb code involved. The cache KEY still says "chromadb-onnx" on
          # purpose: renaming it would force a cold re-download on every runner
          # for zero behaviour change (CI-cost discipline). The uv.lock hash no
          # longer tracks a chromadb bump (it is not in the lock) but still
          # invalidates on onnxruntime/tokenizers moves, which is the live
          # coupling.
          key: chromadb-onnx-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          # nexus-c7gnx: fall back to the last ONNX cache for this OS so a
          # routine uv.lock bump (which rarely changes the bundled ONNX model)
          # re-seeds it instead of re-downloading from scratch every time.
          restore-keys: |
            chromadb-onnx-${{ runner.os }}-

      - name: Cache HuggingFace models (cross-encoder, MinerU)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          # DOCLING NO LONGER USES THIS. Its layout/TableFormer/CodeFormula
          # models come from our OWN hosted mirror (release asset
          # ci-assets-docling-v1) via NEXUS_DOCLING_ARTIFACTS_PATH — see the
          # "Fetch docling models" step below. Anonymous HuggingFace fetches
          # were the recurring "docling flake" (nexus-cxsbs): runners keep no
          # layer cache, so a cache MISS re-fetched ~1.1GB from HF and failed on
          # CAS data-processing errors / resets / 429s. Same reason the bge-768
          # ONNX is self-hosted as ci-assets-bge-768-v1.
          # This cache remains for the OTHER HF-backed models that still resolve
          # through the hub: the cross-encoder reranker and (under -m slow)
          # MinerU's weights.
          path: ~/.cache/huggingface
          # Key on uv.lock so a docling/transformers bump (new model) busts it;
          # restore-keys seeds from the last cache so unchanged models persist.
          key: huggingface-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-models-${{ runner.os }}-

      - name: Fetch the service jar
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: service-jar
          path: service/target

      - name: Re-stamp the jar mtime
        # tests/db/_service_fixture.py::jar_freshness_skip_reason compares the
        # jar's mtime against the newest file under service/src — a good check
        # locally, where a forgotten rebuild is the real risk.
        #
        # On CI it is MEANINGLESS: git stamps every checked-out file at
        # checkout time, so a downloaded jar is always "older" than sources it
        # was in fact built from, and the gate would skip the whole
        # engine-substrate family for a reason that does not exist here.
        #
        # Touching is not a bypass. The service-jar cache key is
        # hashFiles('service/pom.xml', 'service/src/main/**') with NO
        # restore-keys, so a hit already proves the jar was built from exactly
        # these sources — a strictly stronger guarantee than the mtime proxy it
        # replaces.
        run: touch service/target/nexus-service-1.0-SNAPSHOT.jar

      - name: Set up Java (to launch the service jar)
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'

      - name: Cache the pinned PG bundle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          # tests/db/_service_fixture.py::_self_provision_pg_bundle downloads
          # OUR pinned, sigstore-verified PG bundle into this per-tag dir. Cache
          # it so the engine substrate does not re-download it on every run;
          # keyed on the file that PINS the tag, so a floor bump re-fetches.
          path: ~/.cache/nexus-test-substrate
          key: pg-bundle-${{ runner.os }}-${{ hashFiles('src/nexus/engine_version.py') }}

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        # nexus-eqxxh: the engine substrate boots the SAME jar the write-seam
        # gate does, so it has the SAME startup dependency — Main constructs
        # Bge768Embedder before binding the port (RDR-160 local-mode embedder),
        # and without the model it throws IllegalStateException and the service
        # never listens. write-seam-gate already primes it for exactly this
        # reason (nexus-h29w1); the pytest matrix did not, so once the pgvector
        # fix let migration complete, all 206 changesets applied and the engine
        # then died here instead:
        #
        #   event=schema_migration_complete applied_changesets=206
        #   Exception in thread "main" java.lang.IllegalStateException:
        #     Bge768Embedder: bge ONNX model not found at
        #     ~/.cache/nexus/onnx_models/bge-base-en-v1.5/onnx/model.onnx
        #
        # Same composite action, same self-hosted release asset (no HuggingFace
        # 429 dependency), same target path the jar reads. Unconditional: this
        # job's engine-substrate tests need it on every run, not behind a
        # paths-filter, since NX_T2_SUBSTRATE_EXPECTED=1 makes the substrate
        # REQUIRED and a missing model is 73 hard errors rather than a skip.
        uses: ./.github/actions/prime-bge-onnx

      - name: Install project + dev deps
        run: uv sync --group dev

      - name: Fetch docling models from our own mirror
        # WE HOST THESE. Nothing here may reach HuggingFace.
        #
        # History (nexus-cxsbs / nexus-c7gnx): docling loads layout +
        # TableFormer + CodeFormula LAZILY at convert() time, so an anonymous HF
        # fetch happened mid-suite. When it failed it fell back to PyMuPDF and
        # produced ~21 baffling extraction_method=='docling' assertion failures.
        # The mitigation was an up-front warm with 3 retries — but each attempt
        # costs ~25 minutes, so a genuine HF outage could not recover inside the
        # job timeout: it burned 30 minutes and got CANCELLED (observed
        # 2026-07-31 on PR #1433, pytest 3.12, "CAS data processing error"). A
        # retry budget larger than the job budget is decoration.
        #
        # Now: one deterministic download of OUR release asset, and
        # NEXUS_DOCLING_ARTIFACTS_PATH points docling at the extracted dir so it
        # never resolves through the hub at all. Same pattern as the self-hosted
        # bge-768 ONNX (ci-assets-bge-768-v1).
        #
        # Regenerate with:
        #   docling-tools models download -o <dir> layout tableformer code_formula
        #   tar -czf docling-artifacts-v1.tar.gz -C <dir> .
        # then cut a -v2 tag if a docling bump changes the model set.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/nexus/docling-artifacts"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            -o /tmp/docling-artifacts.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/ci-assets-docling-v1/docling-artifacts-v1.tar.gz"
          tar -xzf /tmp/docling-artifacts.tar.gz -C "$HOME/.cache/nexus/docling-artifacts"
          rm -f /tmp/docling-artifacts.tar.gz
          echo "NEXUS_DOCLING_ARTIFACTS_PATH=$HOME/.cache/nexus/docling-artifacts" >> "$GITHUB_ENV"

      - name: Verify docling extracts from the mirrored models
        # NON-VACUITY: proves docling actually performed the extraction
        # (extraction_method == 'docling'), so a silently-empty or wrong-shaped
        # artifacts dir fails HERE instead of degrading to PyMuPDF mid-suite.
        # No retry loop: there is no network fetch left to be flaky, so a
        # failure now means the artifacts are wrong and retrying cannot help.
        run: uv run python scripts/ci_warm_docling.py

      - name: Run tests (shard ${{ matrix.shard }}/4)
        # nexus-n0ful: pytest-split partitions the SAME collection every leg
        # sees (addopts' `-m 'not integration and not slow'` applies
        # uniformly) into 4 duration-balanced groups, keyed off the committed
        # .test_durations.json. Refresh cadence (JSON has no comment syntax,
        # so it lives here + pyproject.toml's pytest-split dev-dep comment):
        # regenerate on demand with
        #   uv run pytest tests/ -q --store-durations --durations-path=.test_durations.json
        # when shard balance visibly drifts (one shard consistently the
        # tail) — stale entries only degrade balance, never correctness:
        # pytest-split falls back to the suite average for any test id
        # missing from the file (new tests since the last refresh), and
        # extra ids for tests since removed are simply ignored. No CI
        # enforcement of freshness by design — this is a scheduling hint,
        # not a correctness input. Serial execution WITHIN the shard is
        # unchanged — this is matrix parallelism across runners, not
        # -n/xdist in-process parallelism, so the no-parallel-tests
        # invariant still holds.
        run: |
          set -euo pipefail
          uv run pytest tests/ -q --durations=25 \
            --splits 4 --group ${{ matrix.shard }} \
            --durations-path=.test_durations.json | tee shard-output.txt

      # nexus-lemv5: per-shard executed-count floor — the same backstop the
      # lint leg carries (check_lint_leg_non_vacuity.py, nexus-wixar), aimed
      # at the shard matrix pytest-gate trusts blindly via needs.test. The
      # marker-scoped conftest guards (scenario / mandatory-pin) cannot see
      # a mass-skip of the GENERAL corpus; pytest exits 0 on all-skipped.
      # Floor 1500/shard against ~3290/shard actual (13150 default-selected
      # / 4, measured 2026-08-18): generous headroom for corpus shrinkage
      # and split imbalance, structurally impossible for a near-zero shard
      # to pass.
      - name: Executed-count floor (nexus-lemv5 — a shard that skipped its corpus must not report green)
        run: uv run python scripts/check_lint_leg_non_vacuity.py shard-output.txt --floor 1500 --label "test shard ${{ matrix.shard }}"

  test-lint:
    # test-suite-compression P0 (nexus-test-cleanup, 2026-08-05): the `lint`
    # marker (pyproject.toml) carves ~760 O(repo) meta-tests — AST/regex
    # scans of src/nexus, conexus/ agent-skill-command markdown, RDR
    # frontmatter, marker-selection coverage itself — out of the default
    # `-m 'not integration and not slow and not lint'` hot loop the `test`
    # matrix above runs. They only change when repo STRUCTURE changes, not
    # application behavior, so they run once here instead of once per shard
    # x python-version leg. Deliberately a single small ubuntu job with NO
    # matrix (CI cost discipline, CLAUDE.md): these tests are pure-Python
    # AST/regex scans with no engine substrate, no PG, no JDK — the cheapest
    # possible leg, unlike the `test` matrix's engine-backed T2 substrate.
    #
    # test_marker_selection_coverage.py's own non-vacuity check
    # (test_marker_is_wired_to_a_real_invocation) requires a REAL
    # `pytest ... -m lint` invocation to exist under .github/ — this job's
    # `run:` step below IS that invocation, closing the loop the marker
    # itself enforces (nexus-s6dei).
    name: pytest (lint markers)
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    env:
      # nexus-wixar (2026-08-18): this job provisions NO service jar (by
      # design — see the comment block above), which made every lint-marked
      # test hit the autouse `_pin_t2_substrate` fixture's engine-substrate
      # pin -> `t2_service_env`'s own CI-only graceful skip ("engine
      # substrate: service JAR not provisioned on CI", fires whenever
      # GITHUB_ACTIONS=='true' and NX_T2_SUBSTRATE_EXPECTED is unset and no
      # jar exists -- exactly this job's shape). Real CI run, PR #1459: the
      # entire ~830-test lint corpus skipped and the job reported SUCCESS
      # (`938 skipped, 13459 deselected`, 0 executed). Same shape, same fix
      # as the `test-mode-census` job below (nexus-vdti6, 2026-08-06): lint
      # tests are pure-Python AST/regex/manifest scanners with no T2
      # dependency whatsoever, so `NX_TEST_T2_SUBSTRATE=none` is correct,
      # not a workaround -- see `_pin_t2_substrate`'s own `=none` branch in
      # tests/conftest.py, which returns before ever calling
      # `t2_service_env`, bypassing the jar check entirely.
      NX_TEST_T2_SUBSTRATE: "none"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # The wire-contract pairing lint (tests/test_wire_contract_pairing_lint.py)
          # walks real release tags and historical commits (git log vX.Y.Z..HEAD,
          # git show <old sha>). Authored during the leg's vacuous window, it had
          # never run on CI until nexus-wixar de-vacuated the leg — first real run
          # failed 5 tests on a tagless depth-1 checkout. `fetch-tags: true` alone
          # does NOT work at depth 1 (nexus-dhs30, comment at the service-change
          # job's checkout: tags pointing outside shallow history never
          # materialise) — full history is required.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          # See the `test` matrix's identical comment: the bundled cache
          # restores only ~1 MB of metadata, not the wheel cache itself.
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Install project + dev deps
        run: uv sync --group dev

      - name: Run lint-marked tests
        # `set -euo pipefail` is load-bearing, not decoration. GitHub's
        # default shell here is `bash -e {0}`, which does NOT set pipefail
        # (only an explicit `shell: bash` does). Without it this step exits
        # with `tee`'s status, so a lint-test FAILURE reported success --
        # and since pyproject's addopts deselect `lint` from every other
        # leg, this job is the sole enforcement point for the whole bucket,
        # feeding the required `pytest-gate` check. The shard-matrix step
        # above already does this correctly; this one did not.
        # The non-vacuity floor below does not cover it: that gate counts
        # failures TOWARD its executed floor, by design -- it asks whether
        # enough tests ran, not whether they passed.
        run: |
          set -euo pipefail
          uv run pytest -m lint -q | tee lint-output.txt

      - name: Enforce lint-leg non-vacuity floor
        # nexus-wixar: a 938-skipped/0-executed run exits 0 (skip is not a
        # pytest failure) and reported SUCCESS on real CI -- the exact
        # vacuous-gate class this step exists to make structurally
        # impossible, not just less likely. scripts/check_lint_leg_non_
        # vacuity.py has its own unit tests (tests/test_check_lint_leg_non_
        # vacuity.py) covering both the floor-trip and floor-clear paths.
        run: uv run python scripts/check_lint_leg_non_vacuity.py lint-output.txt

  test-mode-census:
    # nexus-vdti6 (candidate 1, chosen over: candidate 2 — an out-of-band
    # merge across the 4 shard processes, more plumbing for no benefit over
    # this precedent; candidate 3 — reverting to a filesystem/AST-only
    # census, explicitly scoped OUT by this census's own design because it
    # needs pytest's fixture-resolution machinery (item.fixturenames) to
    # catch class/module-scoped `pytestmark = pytest.mark.usefixtures
    # ("cloud_mode")`, which an AST re-implementation would have to
    # reimplement with real edge-case risk — see
    # test_mode_declarations_are_explicit.py's module docstring).
    #
    # WHY THIS JOB EXISTS: test_mode_declarations_are_explicit.py's census
    # reads request.session.items — the collected-and-selected test list —
    # to scan the WHOLE default-loop corpus for undeclared voyage-mode
    # references. CI's real PR-gating `test` job above runs
    # `pytest tests/ --splits 4 --group N` (pytest-split);
    # pytest_split/plugin.py:168 does `items[:] = group.selected` inside
    # its own pytest_collection_modifyitems — the IDENTICAL session.items-
    # mutation mechanism `-m`/`-k` deselection uses (the same mechanism
    # nexus-8x4le's `-m lint` blind spot exploited). Under that real
    # invocation the census only ever saw its own shard (~20-25% of the
    # corpus): enforcement was shard-placement luck, not real coverage.
    # tests/conftest.py's partial_session_view_reason guard now makes the
    # census SKIP (never silently scan a partial view) whenever
    # --splits/--group is active — which is unconditionally true in the
    # sharded `test` matrix above. THIS job is where the census actually
    # runs for real: no --splits/--group, so its own guard sees a
    # trustworthy view.
    #
    # HOW IT STAYS CHEAP WITHOUT THE ENGINE SUBSTRATE: this job still needs
    # request.session.items to be the REAL full corpus (~13.1k raw / ~11.7k
    # default-loop items, measured live 2026-08-06), which means COLLECTING
    # the whole tests/ tree — but collecting is not the same as EXECUTING.
    # NX_CENSUS_ONLY_JOB=1 (tests/conftest.py's pytest_collection_
    # modifyitems) SKIP-MARKS every item outside
    # _CENSUS_ONLY_ALLOWED_MODULES instead of deselecting it — deselection
    # would shrink session.items through the exact mechanism this whole
    # guard exists to catch. A skip decision fires in `_pytest/skipping.py`'s
    # `pytest_runtest_setup` (`@hookimpl(tryfirst=True)`), which raises
    # BEFORE `_pytest/runner.py`'s own `pytest_runtest_setup` — the one that
    # calls `item.setup()` and instantiates fixtures — ever runs, so the
    # ~11.7k skip-marked tests never touch the engine substrate, PG, or the
    # service jar. Measured locally: collection alone is ~8s (11733/13101
    # items); this job pays that plus per-item skip overhead for the
    # rest, not fixture/engine cost — no service-jar / PG-bundle / docling
    # provisioning steps below, unlike the `test` matrix.
    name: pytest (mode-declarations census)
    runs-on: ubuntu-latest
    needs: [changes]
    if: success() && needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    env:
      # NX_CENSUS_ONLY_JOB skip-marks (not deselects) every `scenario`-marked
      # test along with everything else outside
      # _CENSUS_ONLY_ALLOWED_MODULES, which trips tests/conftest.py's OWN
      # scenario non-vacuity guard (`_check_scenario_non_vacuity`) — it reads
      # a mass scenario-skip as a silently degraded engine substrate, which
      # is exactly right for the `test` matrix but a false positive here:
      # this job deliberately runs no scenario journeys by design (reproduced
      # locally 2026-08-06 — the guard's own documented override exists for
      # precisely this "deliberately substrate-less" shape).
      NX_SCENARIO_SKIP_BUDGET: "999"
      # NX_TEST_T2_SUBSTRATE=none (nexus-vdti6, caught in review 2026-08-06,
      # BEFORE ever going red — this job has never actually run on CI yet):
      # this job provisions NO service jar (unlike the `test` matrix, on
      # purpose — the whole point is avoiding that cost) and sets no
      # NX_T2_SUBSTRATE_EXPECTED. Without this var, the autouse
      # `_pin_t2_substrate` fixture would still run for the ONE test that
      # actually executes here (the census itself is NOT skip-marked —
      # it's the allowed module) and hit `t2_service_env`'s own PRE-EXISTING
      # graceful skip ("engine substrate: service JAR not provisioned on
      # CI"), which fires whenever GITHUB_ACTIONS=='true' (always true on a
      # runner) AND NX_T2_SUBSTRATE_EXPECTED is unset AND no jar exists —
      # exactly this job's shape. That would make the census SILENTLY SKIP
      # on every real CI run of this job, reporting green while never
      # executing its scan at all: the identical vacuous-pass class
      # nexus-vdti6 exists to eliminate, just relocated from "shard-blind"
      # to "substrate-skipped". The census reads request.session.items and
      # inspect.getsource() only — it needs no T2 store whatsoever, so
      # `=none` is the correct fix, not a workaround (see
      # `_pin_t2_substrate`'s own `NX_TEST_T2_SUBSTRATE=none` branch in
      # tests/conftest.py, which returns before ever calling
      # `t2_service_env`, bypassing the jar check entirely rather than
      # requiring a jar to exist). Verified locally: NX_TEST_T2_SUBSTRATE=
      # none makes the substrate-skip path unreachable regardless of
      # GITHUB_ACTIONS or jar state (see
      # test_mode_declarations_census_executes_for_real_under_ci_env_shape
      # in tests/test_mode_declarations_are_explicit.py).
      NX_TEST_T2_SUBSTRATE: "none"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          # See the `test` matrix's identical comment: the bundled cache
          # restores only ~1 MB of metadata, not the wheel cache itself.
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Install project + dev deps
        run: uv sync --group dev

      - name: Run the mode-declarations census against the FULL unsharded corpus
        # No --splits/--group, no -m/-k: partial_session_view_reason's
        # Signal 1 (pytest-split active) does not fire here, and Signal 2's
        # ratio stays at the normal ~90% default-loop reduction — so the
        # census actually scans request.session.items instead of skipping.
        run: NX_CENSUS_ONLY_JOB=1 uv run pytest tests/ -q

  pytest-gate:
    # nexus-n0ful: required-check fan-in over the sharded `test` matrix.
    #
    # NAMING DECISION (documented prominently per the design doc's
    # instruction — see the write-back for the full rationale): this job is
    # named `pytest-gate`, NOT `pytest (Python 3.12)`. The old name cannot be
    # preserved on a single non-matrix job once BOTH python-version and shard
    # vary independently — develop's required check ("pytest (Python 3.12)")
    # and main's two required checks ("pytest (Python 3.12)" AND "pytest
    # (Python 3.13)") need per-version aggregation that a shard+version
    # matrix's implicit `needs.test.result` cannot give without a second
    # matrix dimension on THIS job too, which reintroduces the exact
    # single-check-name problem it's meant to solve. A single clean name +
    # a one-time required-contexts swap is simpler and more honest than a
    # legacy name that would silently cover a different, broader set of
    # matrix legs than the branch-protection UI's label implies.
    # ACTION NEEDED (Hal, one-time, GitHub repo settings click): this change
    # lands via a DIRECT PUSH to develop (nexus-n0ful), not a PR, so there is
    # no "land it in the same PR" moment — the swap is a one-time
    # repo-settings click Hal performs IMMEDIATELY AFTER this push lands:
    #   develop: required context "pytest (Python 3.12)"          -> "pytest-gate"
    #   main:    required contexts "pytest (Python 3.12)" AND
    #            "pytest (Python 3.13)"                            -> "pytest-gate" (single)
    # Note this changes main's gate SHAPE from two required checks to one,
    # because the fan-in already aggregates the 3.13 legs at the merge
    # boundary. Until the swap, any PR into develop or main shows the old
    # context stuck "Expected — waiting" and cannot merge (admin direct
    # pushes are unaffected). Verified live 2026-08-03 via
    # `gh api repos/Hellblazer/nexus/branches/{develop,main}/protection`.
    #
    # NON-VACUITY: every branch below either explicitly PASSes on a proven
    # condition or explicitly FAILs — there is no fallthrough default-pass.
    # Empty/cancelled/skipped-without-proof shard results FAIL; an all-
    # skipped shard matrix PASSes only when `changes` affirmatively proved
    # the doc-only predicate (job-level skip, never a workflow-level
    # `paths:` filter — those hang required checks on PRs that legitimately
    # skip).
    #
    # release-ledger-gate WIRING (nexus-55r6o, substantive-critic Critical
    # finding): release-ledger-gate is orthogonal to the doc-only `code`
    # predicate above -- it gates on "is this PR targeting main", not on
    # whether the diff touches docs. Its own condition
    # (`github.event_name == 'pull_request' && github.base_ref == 'main'`)
    # is RE-DERIVED below rather than trusted from `needs.release-ledger-
    # gate.result` alone, because `skipped` is ambiguous between "correctly
    # skipped, wrong PR shape" and "silently never ran" -- a sibling job's
    # result alone cannot distinguish those. Deliberately duplicating the
    # condition string here matches the EXISTING precedent at the `test`
    # matrix's python-version expression above, which duplicates this exact
    # condition for the exact same reason.
    name: pytest-gate
    if: always()
    needs: [changes, test, test-lint, test-mode-census, release-ledger-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the sharded pytest matrix (or its legitimate skip)
        run: |
          set -euo pipefail
          changes_result="${{ needs.changes.result }}"
          code="${{ needs.changes.outputs.code }}"
          test_result="${{ needs.test.result }}"
          test_lint_result="${{ needs.test-lint.result }}"
          test_mode_census_result="${{ needs.test-mode-census.result }}"
          release_ledger_result="${{ needs.release-ledger-gate.result }}"
          event_name="${{ github.event_name }}"
          base_ref="${{ github.base_ref }}"

          echo "changes job result: $changes_result (code=$code)"
          echo "test matrix result: $test_result"
          echo "test-lint result: $test_lint_result"
          echo "test-mode-census result: $test_mode_census_result"
          echo "release-ledger-gate result: $release_ledger_result (event=$event_name base_ref=$base_ref)"

          if [ "$changes_result" != "success" ]; then
            echo "::error::the doc-only predicate job (changes) did not succeed ($changes_result) — cannot prove whether the pytest matrix was needed, failing loud instead of guessing"
            exit 1
          fi

          case "$code" in
            true)
              if [ "$test_result" != "success" ]; then
                echo "::error::code changed but the pytest shard matrix reported '$test_result' instead of success"
                exit 1
              fi
              if [ "$test_lint_result" != "success" ]; then
                echo "::error::code changed but the lint-marker leg (test-lint) reported '$test_lint_result' instead of success"
                exit 1
              fi
              if [ "$test_mode_census_result" != "success" ]; then
                echo "::error::code changed but the mode-declarations census leg (test-mode-census) reported '$test_mode_census_result' instead of success — nexus-vdti6: this is the ONLY leg that gives the RDR-109 census a real, unsharded view of the corpus"
                exit 1
              fi
              ;;
            false)
              case "$test_result" in
                success|skipped) ;;
                *)
                  echo "::error::doc-only diff but the pytest shard matrix reported '$test_result' instead of skipped/success"
                  exit 1
                  ;;
              esac
              case "$test_lint_result" in
                success|skipped) ;;
                *)
                  echo "::error::doc-only diff but the lint-marker leg (test-lint) reported '$test_lint_result' instead of skipped/success"
                  exit 1
                  ;;
              esac
              case "$test_mode_census_result" in
                success|skipped) ;;
                *)
                  echo "::error::doc-only diff but the mode-declarations census leg (test-mode-census) reported '$test_mode_census_result' instead of skipped/success"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::unrecognised code predicate '$code' from the changes job — failing loud instead of guessing"
              exit 1
              ;;
          esac

          # release-ledger-gate (nexus-55r6o): on a PR targeting main it
          # MUST have succeeded -- skipped/failed/cancelled all block. On
          # every other trigger shape (develop-bound PR, push) its own
          # job-level `if:` legitimately skips it, so skipped/success are
          # both clean here, same "skipped == success for branch
          # protection" idiom as the code==false branch above.
          if [ "$event_name" = "pull_request" ] && [ "$base_ref" = "main" ]; then
            if [ "$release_ledger_result" != "success" ]; then
              echo "::error::PR targets main but release-ledger-gate reported '$release_ledger_result' instead of success — the pre-tag wire-contract-ledger check (nexus-55r6o) must pass before a PR to main can merge"
              exit 1
            fi
          else
            case "$release_ledger_result" in
              success|skipped) ;;
              *)
                echo "::error::release-ledger-gate reported '$release_ledger_result' instead of skipped/success"
                exit 1
                ;;
            esac
          fi

          echo "pytest-gate: PASS"

  ca3-pgvector-bundle:
    # RDR-157 P1 CA-3 gate (bead nexus-vwvv5.2): prove the assemble path — a
    # COMPLETE PG tree + pgvector — can be driven by nx's own provisioner to a
    # cluster that LOADS pgvector, with the binary's glibc floor pinned. This is
    # the go/no-go before the P2/P3 build-out.
    #
    # Strategy B (build from source), NOT zonky. CA-3 empirically falsified the
    # original "zonky reduced bundle + inject pgvector" plan: zonky's
    # embedded-postgres-binaries reduced bundle ships ONLY initdb/pg_ctl/postgres
    # — no pg_config/psql/createdb/headers — so pgvector cannot be built against
    # it AND nx's provisioner (which needs psql+createdb) cannot use it. The RDR
    # pre-authorized Strategy B as the CA-3-failure fallback. See RF-157-9 /
    # T2 nexus_rdr/157-CA3-FINDING-zonky-reduced-insufficient.
    #
    # Both linux targets run live (nexus-xqk5r closed aarch64). mac-arm64 runs
    # live in the separate ca3-pgvector-bundle-macos job below (nexus-0ixqc) — it
    # needs a darwin variant (vector.dylib / dyld / otool minos floor, not GLIBC).
    name: CA-3 live (PG from source + pgvector, ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          # arch values are the check-context suffixes; keep stable (branch
          # protection requires "...(linux-amd64)" and "...(linux-arm64)").
          - { arch: linux-amd64, runner: ubuntu-latest,    image: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { arch: linux-arm64, runner: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64" }
    env:
      # nexus-aqbrk: this job has NO service JAR and does not need one — its
      # tests (tests/db/test_pg_provision_ca3_bundle.py) verify PG BINARY
      # PROVISIONING: discovery, sharedir resolution, control files, pg_trgm.
      # Zero T2 references in the entire file.
      #
      # The flip made the engine the DEFAULT substrate, so the autouse pin
      # started trying to boot an engine here, found no JAR, and skipped all
      # 14 tests. scripts/assert_ca3_ran.py then failed the job — correctly,
      # that is its entire purpose: "core CREATE EXTENSION vector test did
      # not pass — assemble path unproven". A non-vacuity gate catching a
      # silent mass-skip the moment one appeared.
      #
      # `none` means PROVISION NOTHING, which is the accurate statement of
      # what this job needs — verified, not assumed: the file has zero T2,
      # T2Database, storage_backend or NX_STORAGE references. It said
      # `sqlite` only because that was the way to spell "do not boot an
      # engine" before nexus-i711w gave that intent its own value; =sqlite
      # is now a hard error, so the rename is forced and also more truthful.
      NX_TEST_T2_SUBSTRATE: none
      # Pinned for determinism. pgvector >= 0.8 is the RDR-155 iterative_scan floor
      # (a pgvector version, not a PG major). nexus is aligned on PG17 to match the
      # deployed conexus stack (nexus-41bso); PG16 was incidental.
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      # manylinux_2_28 == glibc 2.28 (AlmaLinux 8 baseline: RHEL8 / Debian 10 /
      # Ubuntu 18.10+), per-arch image from the matrix. Building the tree +
      # vector.so here pins their glibc floor to a broadly compatible baseline
      # instead of the runner's glibc (~2.39), so the binaries dlopen-load on older
      # distros. We deliberately do NOT use manylinux2014 (glibc 2.17 / CentOS 7):
      # CentOS 7 is EOL and its in-container yum mirrors are dead. glibc 2.28 is a
      # defensible 2026 floor. GLIBC_FLOOR=(2,28) in the test holds for both arches.
      MANYLINUX_IMAGE: ${{ matrix.target.image }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # Full history so dorny/paths-filter resolves the main...develop
          # merge-base without --deepen, whose shallow-fetch loop races
          # ("fatal: shallow file has changed since we read it") and flaked
          # the linux CA-3 gate twice on a docs-only push (2026-06-28).
          fetch-depth: 0

      # Path-gate the expensive PG-from-source build. The job ALWAYS runs (so the
      # required status check always reports), but the build/test/smoke steps run
      # only when the assemble surface changed — avoiding a ~10min PG build on
      # every unrelated PR. nexus-vwvv5.6 follow-up.
      # SHA-pinned (not @v3): this filter's `ca3` output gates whether EVERY
      # build/test step in a REQUIRED check runs. A floating tag that was
      # compromised to always emit ca3='false' would skip the PG build + tests
      # while the job still reports green — the exact vacuous gate the
      # always-run-job pattern exists to prevent. de90cc6 == v3.0.2.
      #
      # THE BASE, AND WHY IT IS LOAD-BEARING (nexus-4k91k, 2026-07-27).
      # `base:` is deliberately unset. dorny/paths-filter then resolves PUSH
      # events against the repository DEFAULT branch (main), NOT against the
      # previous develop commit. develop diverges from main in
      # .github/workflows/ci.yml and service/.../changelog/** — both ca3_core
      # paths — so ca3_core is effectively ALWAYS true on a develop push, and
      # CA-3 runs at EVERY merge boundary.
      #
      # That is not an accident to be tidied away; it is the safety net for the
      # PR side. A PULL REQUEST touching no ca3_core path gets a CA-3 that
      # reports success having proven nothing — by design, that is what
      # path-gating an expensive build MEANS — and the develop push is what
      # re-proves it, one merge later. Verified 2026-07-27: PR run 30213539574
      # executed ZERO CA-3 tests and reported success, while develop runs
      # 30187251639 / 30256819508 / 30272066728 each logged
      # "CA-3 PASS: 12 passed, 0 bundle-skips".
      #
      # So do NOT pin `base:` to the previous commit as a cost saving without
      # first replacing that net (a scheduled unconditional run). It would buy
      # ~3 min of runner time per develop push, ~74s of it macOS, and sell the
      # only thing that re-proves a gated-off PR.
      #
      # READING THIS GATE: do NOT infer whether it fired from the presence of
      # build lines (initdb / "Build complete PG" / assemble). Those are
      # FROM-SOURCE REBUILD lines, absent on a cache hit by design (see the
      # build step's cache-hit condition below), so a run that executed every
      # test scores zero on them. nexus-4k91k was filed on exactly that
      # misreading. The direct signal is scripts/assert_ca3_ran.py's
      # "CA-3 PASS: N passed" line, which exists so nobody has to infer it.
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            ca3_core:
              - 'src/nexus/db/pg_provision.py'
              - 'tests/db/test_pg_provision_ca3_bundle.py'
              - 'tests/db/test_pg_bundle_relocation.py'
              - 'scripts/assert_ca3_ran.py'
              - 'scripts/build_pg_bundle.sh'
              - 'scripts/liquibase_bundle_smoke.sh'
              - '.github/workflows/ci.yml'
              - 'service/src/main/resources/db/changelog/**'
            # A dep bump can change test collection / the Python env the CA-3
            # tests depend on without touching any path above; gate on the
            # lockfile + manifest so such a change re-runs the gate instead of
            # passing vacuously green (substantive-critic S1). 2026-07-06
            # CI-cost pass: the dep trigger now fires on PULL REQUESTS ONLY
            # (see the gate step below) — the non-vacuous-gate intent is about
            # what MERGES, and every merge crosses a PR whose required checks
            # include CA-3. Direct develop pushes that only bump deps no
            # longer pay the ~10min PG-from-source build x3 arches per push;
            # the release/dep PR still pays it exactly once.
            ca3_deps:
              - 'uv.lock'
              - 'pyproject.toml'

      - name: Decide whether the CA-3 build runs
        id: gate
        # nexus-cqquo: an empty/absent/malformed paths-filter output must FAIL
        # this step, never fall through to `run=false` -- that would silently
        # skip the CA-3 build (a REQUIRED check per the comment above) on an
        # UNPROVEN predicate, indistinguishable from a legitimately-false one.
        run: |
          set -euo pipefail
          for v in "${{ steps.changes.outputs.ca3_core }}" "${{ steps.changes.outputs.ca3_deps }}"; do
            case "$v" in
              true|false) ;;
              *)
                echo "::error::paths-filter produced no usable ca3_core/ca3_deps output ('$v') — cannot prove whether the CA-3 gate should run"
                exit 1
                ;;
            esac
          done
          if [ "${{ steps.changes.outputs.ca3_core }}" = "true" ] || \
             { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changes.outputs.ca3_deps }}" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Cache uv wheel cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ matrix.target.arch }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.target.arch }}-3.12-

      - name: Install project + dev deps
        if: steps.gate.outputs.run == 'true'
        run: uv sync --group dev

      - name: Restore compiled PG bundle cache
        # 2026-07-06 CI-cost pass: PG + pgvector are pinned and the compiled
        # bundle is deterministic in (versions, image, build script) — all of
        # which live in this cache key, byte-identical to the one
        # pg-bundle-cache-seed.yml seeds on main (default-branch caches are
        # restorable from every branch/PR) and engine-service-release.yml
        # consumes at tag time. CA-3 was the one consumer still compiling from
        # source on every gated run (~10 min per arch); now it compiles only on
        # a genuine key miss (version bump / build-script change) — exactly
        # when a fresh from-source proof is meaningful. The bundle restores to
        # the same $GITHUB_WORKSPACE/bundle prefix it was built at, so
        # pg_config's compiled-in paths agree with the host, and the
        # relocation step below still proves extract-to-a-different-dir works.
        if: steps.gate.outputs.run == 'true'
        id: pg-bundle-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: bundle
          key: pg-bundle-${{ matrix.target.arch }}-${{ matrix.target.runner }}-pg${{ env.PG_VERSION }}-pgvector${{ env.PGVECTOR_VERSION }}-img-${{ matrix.target.image || 'native' }}-${{ hashFiles('scripts/build_pg_bundle.sh') }}

      - name: Build complete PG + pgvector from source (Strategy B, glibc 2.28)
        if: steps.gate.outputs.run == 'true' && steps.pg-bundle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Single source of truth for the build is scripts/build_pg_bundle.sh
          # (RDR-157 P3.1, bead nexus-vwvv5.10) — the CA-3 gate and the P3 bundle
          # artifact build the SAME tree. The bundle is installed at its build
          # prefix and mounted at the SAME path inside the container, so
          # pg_config's compiled-in paths agree with the host for the CA-3 gate.
          # The relocation step below additionally proves an extract to a
          # DIFFERENT dir works (the P3 shippable-bundle contract).
          bundle="$GITHUB_WORKSPACE/bundle"
          mkdir -p "$bundle"
          docker run --rm \
            -e PG_VERSION -e PGVECTOR_VERSION -e BUNDLE_PREFIX="$bundle" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$MANYLINUX_IMAGE" /bin/bash -c '
              set -eux
              echo "=== ENTER container ==="; head -2 /etc/os-release; ldd --version | head -1
              bash "'"$GITHUB_WORKSPACE"'/scripts/build_pg_bundle.sh"
            '

      - name: Point CA-3 at the bundle (restored or freshly built)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # Guard against a hollow restore/build before the gate trusts it
          # (mirrors pg-bundle-cache-seed.yml's pre-save sanity check).
          if [ ! -x "$GITHUB_WORKSPACE/bundle/bin/initdb" ]; then
            echo "::error::bundle/bin/initdb missing after cache-restore/build — CA-3 cannot run"
            exit 1
          fi
          echo "NEXUS_CA3_BUNDLE=$GITHUB_WORKSPACE/bundle" >> "$GITHUB_ENV"

      - name: Run CA-3 live test (asserts it actually ran, not skipped)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # -o addopts="" clears the repo default `-m 'not integration'` so the
          # integration-marked CA-3 module is collected.
          uv run pytest tests/db/test_pg_provision_ca3_bundle.py \
            -o addopts="" -m integration -q -rs --junit-xml=ca3.xml
          # Non-vacuity gate: platform-conditional tests (GLIBC on mac / minos on
          # linux) skip legitimately; only a bundle-absence skip is a vacuous gate.
          uv run python scripts/assert_ca3_ran.py ca3.xml

      - name: Package bundle + relocation smoke (P3.1, nexus-vwvv5.10)
        # Tar the built tree to a shippable .txz, then EXTRACT it to a dir other
        # than the build prefix and prove the relocated tree still provisions +
        # loads pgvector (closes the relocation concern CA-3 deferred). The
        # glibc-2.28-built binaries run on the ubuntu-latest host (glibc ~2.39,
        # forward-compatible) — that the relocated tree runs OUTSIDE its build
        # container is itself part of the portability proof.
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          txz="$RUNNER_TEMP/nexus-pg-${{ matrix.target.arch }}.txz"
          # -C parent + basename preserves the relative bin/ lib/ share/ layout
          # that relocation depends on.
          tar -cJf "$txz" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          # CA-2 ship-alongside regression tripwire (nexus-vwvv5.11): the verdict
          # rests on a small bundle (~5.74 MB compressed). A configure-flag change
          # or new contrib module that doubled it would invalidate the rationale
          # silently. Ceiling is generous head-room, not a tight bound.
          sz=$(wc -c < "$txz")
          echo "bundle .txz size: $sz bytes"
          if [ "$sz" -gt $((10 * 1024 * 1024)) ]; then
            echo "::error::nexus-pg bundle .txz is $sz bytes (> 10 MiB) — CA-2 ship-alongside size assumption breached"
            exit 1
          fi
          reloc="$RUNNER_TEMP/relocated"
          mkdir -p "$reloc"
          tar -xJf "$txz" -C "$reloc"
          export NEXUS_PG_BUNDLE_ROOT="$reloc/$(basename "$bundle")"
          uv run pytest tests/db/test_pg_bundle_relocation.py \
            -o addopts="" -m integration -q -rs --junit-xml=reloc.xml
          # Reuse the CA-3 non-vacuity asserter (keys on the shared
          # "no CA-3 bundle" skip phrase + the CREATE EXTENSION core test).
          uv run python scripts/assert_ca3_ran.py reloc.xml

      - name: Upload bundle artifact (P3.1, consumed by P3.2/P3.4)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: nexus-pg-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/nexus-pg-${{ matrix.target.arch }}.txz
          retention-days: 7
          if-no-files-found: error

      - name: Liquibase-against-bundle smoke (nexus-ywts8, linux-amd64 only)
        # Applies the service's full SQL changelog to the lean bundle PG, proving
        # the ICU-less / --no-locale build handles the real schema. linux-only:
        # uses `docker --network host` to reach the provisioned PG. One arch is
        # enough — the schema is arch-independent; this validates the lean
        # configure flags, not the platform.
        if: matrix.target.arch == 'linux-amd64' && steps.gate.outputs.run == 'true'
        run: bash scripts/liquibase_bundle_smoke.sh

  ca3-pgvector-bundle-macos:
    # RDR-157 CA-3 for mac-arm64 (bead nexus-0ixqc). Same assemble gate as the
    # linux job, but macOS has no manylinux container: build PG + pgvector
    # NATIVELY on a macos-14 (arm64) runner. pgvector produces vector.dylib; the
    # loader is dyld, so the floor is the Mach-O LC_BUILD_VERSION minos
    # (MACOSX_DEPLOYMENT_TARGET), not GLIBC — asserted by TestMacosFloor.
    name: CA-3 live (PG from source + pgvector, mac-arm64)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # nexus-aqbrk: this job has NO service JAR and does not need one — its
      # tests (tests/db/test_pg_provision_ca3_bundle.py) verify PG BINARY
      # PROVISIONING: discovery, sharedir resolution, control files, pg_trgm.
      # Zero T2 references in the entire file.
      #
      # The flip made the engine the DEFAULT substrate, so the autouse pin
      # started trying to boot an engine here, found no JAR, and skipped all
      # 14 tests. scripts/assert_ca3_ran.py then failed the job — correctly,
      # that is its entire purpose: "core CREATE EXTENSION vector test did
      # not pass — assemble path unproven". A non-vacuity gate catching a
      # silent mass-skip the moment one appeared.
      #
      # `none` means PROVISION NOTHING, which is the accurate statement of
      # what this job needs — verified, not assumed: the file has zero T2,
      # T2Database, storage_backend or NX_STORAGE references. It said
      # `sqlite` only because that was the way to spell "do not boot an
      # engine" before nexus-i711w gave that intent its own value; =sqlite
      # is now a hard error, so the rename is forced and also more truthful.
      NX_TEST_T2_SUBSTRATE: none
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      # The dyld analog of the glibc floor: build back-deployable to macOS 13
      # (Ventura). Must match MACOS_MIN_FLOOR in the test.
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0  # merge-base without --deepen (see linux CA-3 above)

      # Path-gate the expensive native PG build (same rationale as the linux CA-3
      # job): the job always runs so the required check reports, but the build/test
      # run only when the assemble surface changed.
      # SHA-pinned (not @v3): this filter's `ca3` output gates whether EVERY
      # build/test step in a REQUIRED check runs. A floating tag that was
      # compromised to always emit ca3='false' would skip the PG build + tests
      # while the job still reports green — the exact vacuous gate the
      # always-run-job pattern exists to prevent. de90cc6 == v3.0.2.
      # `base:` is unset here for the same load-bearing reason as the linux
      # CA-3 job — read that comment before changing it. Short version: push
      # events resolve against main, not the previous develop commit, so this
      # gate is effectively always true on a develop push, and that is what
      # re-proves a PR whose CA-3 was gated off. This job is the macOS arch,
      # so it is also the ~74s of premium runner that pinning `base:` would
      # save and the reason the trade looks tempting (nexus-4k91k).
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            ca3_core:
              - 'src/nexus/db/pg_provision.py'
              - 'tests/db/test_pg_provision_ca3_bundle.py'
              - 'tests/db/test_pg_bundle_relocation.py'
              - 'scripts/assert_ca3_ran.py'
              - 'scripts/build_pg_bundle.sh'
              - 'scripts/liquibase_bundle_smoke.sh'
              - '.github/workflows/ci.yml'
              - 'service/src/main/resources/db/changelog/**'
            # A dep bump can change test collection / the Python env the CA-3
            # tests depend on without touching any path above; gate on the
            # lockfile + manifest so such a change re-runs the gate instead of
            # passing vacuously green (substantive-critic S1). 2026-07-06
            # CI-cost pass: the dep trigger now fires on PULL REQUESTS ONLY
            # (see the gate step below) — the non-vacuous-gate intent is about
            # what MERGES, and every merge crosses a PR whose required checks
            # include CA-3. Direct develop pushes that only bump deps no
            # longer pay the ~10min PG-from-source build x3 arches per push;
            # the release/dep PR still pays it exactly once.
            ca3_deps:
              - 'uv.lock'
              - 'pyproject.toml'

      - name: Decide whether the CA-3 build runs
        id: gate
        # nexus-cqquo: an empty/absent/malformed paths-filter output must FAIL
        # this step, never fall through to `run=false` -- that would silently
        # skip the CA-3 build (a REQUIRED check per the comment above) on an
        # UNPROVEN predicate, indistinguishable from a legitimately-false one.
        run: |
          set -euo pipefail
          for v in "${{ steps.changes.outputs.ca3_core }}" "${{ steps.changes.outputs.ca3_deps }}"; do
            case "$v" in
              true|false) ;;
              *)
                echo "::error::paths-filter produced no usable ca3_core/ca3_deps output ('$v') — cannot prove whether the CA-3 gate should run"
                exit 1
                ;;
            esac
          done
          if [ "${{ steps.changes.outputs.ca3_core }}" = "true" ] || \
             { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changes.outputs.ca3_deps }}" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Cache uv wheel cache
        # Mirror the linux CA-3 jobs so a gated mac run reuses wheels instead of
        # re-downloading from scratch (code-review L1).
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-mac-arm64-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-mac-arm64-3.12-

      - name: Install project + dev deps
        if: steps.gate.outputs.run == 'true'
        run: uv sync --group dev

      - name: Restore compiled PG bundle cache
        # 2026-07-06 CI-cost pass: same restore-first wiring as the linux CA-3
        # job above — key is byte-identical to pg-bundle-cache-seed.yml's
        # mac-arm64 row (arch/runner/image parts hardcoded since this job has
        # no matrix). macOS minutes bill at ~10x linux, so skipping the
        # from-source PG build here is the single biggest per-hit saving.
        if: steps.gate.outputs.run == 'true'
        id: pg-bundle-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: bundle
          key: pg-bundle-mac-arm64-macos-14-pg${{ env.PG_VERSION }}-pgvector${{ env.PGVECTOR_VERSION }}-img-native-${{ hashFiles('scripts/build_pg_bundle.sh') }}

      - name: Build complete PG + pgvector from source (native, deployment-target 13.0)
        if: steps.gate.outputs.run == 'true' && steps.pg-bundle-cache.outputs.cache-hit != 'true'
        env:
          BUNDLE_PREFIX: ${{ github.workspace }}/bundle
        run: |
          set -euo pipefail
          # Single source of truth: scripts/build_pg_bundle.sh (same script the
          # linux CA-3 job runs inside its container). It installs flex/bison via
          # brew, applies MACOSX_DEPLOYMENT_TARGET / -mmacosx-version-min, builds
          # PG + pg_trgm + pgvector, and records the build prefix marker.
          bash scripts/build_pg_bundle.sh

      - name: Point CA-3 at the bundle (restored or freshly built)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ ! -x "$GITHUB_WORKSPACE/bundle/bin/initdb" ]; then
            echo "::error::bundle/bin/initdb missing after cache-restore/build — CA-3 cannot run"
            exit 1
          fi
          echo "NEXUS_CA3_BUNDLE=$GITHUB_WORKSPACE/bundle" >> "$GITHUB_ENV"

      - name: Run CA-3 live test (asserts it actually ran, not skipped)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          uv run pytest tests/db/test_pg_provision_ca3_bundle.py \
            -o addopts="" -m integration -q -rs --junit-xml=ca3.xml
          uv run python scripts/assert_ca3_ran.py ca3.xml

      - name: Package bundle + relocation smoke (P3.1, nexus-vwvv5.10)
        # Same relocation proof as the linux job: tar the tree, extract to a dir
        # other than the build prefix, prove the relocated tree provisions +
        # loads pgvector (vector.dylib via dyld) from the new location.
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          txz="$RUNNER_TEMP/nexus-pg-mac-arm64.txz"
          tar -cJf "$txz" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          # CA-2 ship-alongside regression tripwire (nexus-vwvv5.11): see the
          # linux job for rationale. Generous 10 MiB ceiling over the ~5.74 MB
          # current bundle.
          sz=$(wc -c < "$txz")
          echo "bundle .txz size: $sz bytes"
          if [ "$sz" -gt $((10 * 1024 * 1024)) ]; then
            echo "::error::nexus-pg bundle .txz is $sz bytes (> 10 MiB) — CA-2 ship-alongside size assumption breached"
            exit 1
          fi
          reloc="$RUNNER_TEMP/relocated"
          mkdir -p "$reloc"
          tar -xJf "$txz" -C "$reloc"
          export NEXUS_PG_BUNDLE_ROOT="$reloc/$(basename "$bundle")"
          uv run pytest tests/db/test_pg_bundle_relocation.py \
            -o addopts="" -m integration -q -rs --junit-xml=reloc.xml
          uv run python scripts/assert_ca3_ran.py reloc.xml

      - name: Upload bundle artifact (P3.1, consumed by P3.2/P3.4)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: nexus-pg-mac-arm64
          path: ${{ runner.temp }}/nexus-pg-mac-arm64.txz
          retention-days: 7
          if-no-files-found: error

  engine-service-build:
    # S2 (substantive-critic): engine-service-release.yml runs ONLY on
    # workflow_dispatch + engine-service-v* tags, so PR CI never compiles the
    # service. A jOOQ-apply, Liquibase, or GraalVM-reachability regression in
    # service/** can merge to develop unseen until a human cuts a release tag.
    # This is a PR trip-wire: on service/** changes, regenerate jOOQ sources
    # (testcontainers codegen, Docker) and run the SAME native build the release
    # does (-Pnative -Pprebuilt-jooq -DskipTests), minus smoke + publish.
    #
    # REQUIRED CHECK since 2026-07-13 (nexus-a5rj8, decided by Hal): a RED
    # result here blocks merge. The job always runs; its expensive steps are
    # path-gated via step `if:`, so unrelated PRs still see a fast no-op that
    # reports green (skipped-steps == success — the branch-protection-safe
    # skip pattern). service/** PRs pay the ~40min native build, which is
    # exactly the visibility the trip-wire lacked as an advisory job.
    # NOTE: the check name below is registered verbatim in the develop branch
    # protection required contexts — renaming the job breaks the gate.
    name: engine-service native build (PR trip-wire)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0  # merge-base without --deepen (see linux CA-3 above)

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            svc:
              - 'service/**'
              - '.github/workflows/ci.yml'

      - name: Verify the svc predicate is usable (fail loud, never default-skip)
        # nexus-cqquo: every step below is path-gated `if: ... == 'true'`, and
        # this job has no job-level `if:` — so an empty, absent, or malformed
        # `svc` output makes EVERY step below evaluate false, the job
        # completes having built nothing, and reports GREEN on a REQUIRED
        # CHECK. Same non-vacuity shape as the `changes` job's doc-only
        # predicate above (ci.yml:127-145): an UNPROVEN predicate must be
        # distinguishable from a proven-false one. This does NOT change the
        # skip pattern itself (skipped-steps-equals-success stays correct for
        # an affirmatively-false predicate) -- it only refuses to treat
        # "paths-filter said nothing usable" as that same false.
        run: |
          set -euo pipefail
          svc="${{ steps.changes.outputs.svc }}"
          case "$svc" in
            true|false) ;;
            *)
              echo "::error::paths-filter produced no usable svc output ('$svc') — cannot prove whether service/** changed, refusing to silently skip the native build"
              exit 1
              ;;
          esac

      - name: Set up GraalVM 25.0.3
        if: steps.changes.outputs.svc == 'true'
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Generate jOOQ sources (testcontainers codegen, Docker)
        if: steps.changes.outputs.svc == 'true'
        working-directory: service
        run: ./mvnw -q generate-sources

      - name: Build native image (-Pnative -Pprebuilt-jooq, no smoke/publish)
        if: steps.changes.outputs.svc == 'true'
        working-directory: service
        # The same build the release performs, minus smoke + publish — catches
        # jOOQ-apply and GraalVM-reachability regressions on the PR instead of at
        # tag-cut. Do NOT `clean`: generate-sources just populated
        # target/generated-sources/jooq, and -Pprebuilt-jooq compiles it in place.
        #
        # nexus-9yrus: -Dnative.image.opt=-Ob (quick-build) on the PR path. Quick-build
        # still runs FULL reachability analysis (the regression class this trip-wire
        # guards) — it only skips the optimization passes — so it cuts the build ~half
        # and lowers peak memory while preserving the gate's purpose. The RELEASE build
        # (engine-service-release.yml) keeps the default -O2 full optimization.
        # maxheap 11g: ubuntu-latest is a 16GB box by the release-run logs
        # (run 29258747763: 5632m reported as 31.3% of system memory, 1208
        # heap-pressure GCs) — the pom's 5632m default is sized for a 7GB
        # runner this job no longer uses.
        run: ./mvnw -q -Pnative -Pprebuilt-jooq -DskipTests -Dnative.image.opt=-Ob -Dnative.image.maxheap=11g package

  write-seam-gate:
    # nexus-h29w1 — Behavioural cross-boundary write-seam CI gate (F1 closure).
    #
    # Audit finding F1: no single CI gate exercises BOTH halves of a write-seam
    # diff. The Python suite (ci.yml) deselects integration tests; service-ci.yml
    # fires only on service/** paths — so a Python-only change to
    # http_vector_client.py:upsert_chunks cannot trigger the Java
    # VectorHandler/PgVectorRepository tenant/dedup/quota suite.
    #
    # This job boots the real service JAR (pre-built shaded jar) against a
    # throwaway pgvector/pgvector:pg17 Docker container and feeds >300-record,
    # duplicate-chash, and NUL-bearing inputs through the REAL HttpVectorClient,
    # asserting server-side enforcement: dedup collapse, ON CONFLICT idempotency,
    # and NUL sanitization.  The new value is the Python-client -> real-server
    # WIRE CROSSING — this does NOT duplicate existing in-JVM Java coverage
    # (VectorHandlerEmbeddingModeTest, VectorIntegrationTest,
    # PgVectorRepositoryContractTest).
    #
    # PATH GATE: the job ALWAYS runs (so the required status check always
    # reports), but the expensive build/test steps run only when the write-seam
    # surface changes (Python client OR Java handler).  A diff touching either
    # half triggers this job, closing the gap where neither existing workflow
    # fires.
    #
    # FAIL-NOT-SKIP ON MISSING JAR: NX_REQUIRE_SERVICE_JAR=1 is set so that
    # a missing/stale JAR causes the conftest.py autouse fixture to FAIL (not
    # skip) — the gate cannot pass vacuously on a missing JAR in CI.
    # scripts/assert_write_seam_ran.py then enforces that the load-bearing
    # dedup-collapse test actually ran and passed (no all-skip vacuous green).
    #
    # Part of epic nexus-whh61. Related: nexus-57dh4.
    name: write-seam behavioural gate (nexus-h29w1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # merge-base without --deepen (see linux CA-3 above)

      # SHA-pinned (not @v4): this filter's `seam` output gates whether EVERY
      # expensive step in a REQUIRED check runs. A floating tag compromised to
      # always emit seam='false' would skip the JAR build + test while the job
      # still reports green — the exact vacuous gate this gate exists to prevent.
      # fbd0ab8 == v4.0.1 (same SHA used by the CA-3 jobs above).
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: changes
        with:
          filters: |
            seam:
              - 'src/nexus/db/http_vector_client.py'
              # C1 (nexus-h29w1 critic): VectorHandler lives in http/, not
              # vectors/ — the old vectors/VectorHandler.java entry was a dead
              # reference, so a diff to the real HTTP dispatch layer never fired
              # the gate. AuthFilter does tenant extraction upstream of the
              # write path, so it belongs in the seam too.
              - 'service/src/main/java/dev/nexus/service/http/VectorHandler.java'
              - 'service/src/main/java/dev/nexus/service/http/AuthFilter.java'
              - 'service/src/main/java/dev/nexus/service/vectors/PgVectorRepository.java'
              # nexus-4nflf: combined-query end-to-end tripwire (x6kdz). The
              # bug shipped through the catalog write path (no manifest writer
              # stamped document_chunks.collection, the combined-query join
              # key), not the vector write path above — so the catalog Java
              # handler/repo AND the Liquibase changelog (the combined-query
              # SQL functions themselves) must gate this job too, not just
              # PgVectorRepository.
              - 'service/src/main/java/dev/nexus/service/db/CatalogRepository.java'
              - 'service/src/main/java/dev/nexus/service/http/CatalogHandler.java'
              - 'service/src/main/resources/db/changelog/**'
              - 'src/nexus/catalog/http_catalog_client.py'
              - 'tests/db/test_write_seam_gate_integration.py'
              - 'tests/db/test_http_combined_query_integration.py'
              - 'scripts/assert_write_seam_ran.py'
              # nexus-ao29z: both modules are now gated by the needs_stamped_jar
              # guard that lives in these two files, so a change there can skip
              # or fail this job without touching a test.
              - 'tests/db/conftest.py'
              - 'tests/db/_service_fixture.py'
              - '.github/workflows/ci.yml'
              # Dep bump can change the Python env or service contract without
              # touching the above paths; gate on lockfile + manifest so such a
              # change re-runs the gate (same rationale as CA-3 jobs above).
              - 'uv.lock'
              - 'pyproject.toml'
              - 'service/pom.xml'

      - name: Verify the seam predicate is usable (fail loud, never default-skip)
        # nexus-cqquo: same non-vacuity gap as engine-service-build above --
        # this job has no job-level `if:` and every expensive step below is
        # gated `if: ... == 'true'`, so an empty/absent/malformed `seam`
        # output would skip the entire write-seam gate while the REQUIRED
        # check still reports green. The comment two steps up already states
        # exactly why this job must not fail open ("a floating tag compromised
        # to always emit seam='false' would skip... while the job still
        # reports green"); this closes the same hole for a malformed output,
        # not just an affirmatively-false one.
        run: |
          set -euo pipefail
          seam="${{ steps.changes.outputs.seam }}"
          case "$seam" in
            true|false) ;;
            *)
              echo "::error::paths-filter produced no usable seam output ('$seam') — cannot prove whether the write-seam surface changed, refusing to silently skip the gate"
              exit 1
              ;;
          esac

      - name: Set up Java 25 (GraalVM)
        if: steps.changes.outputs.seam == 'true'
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'

      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.seam == 'true'
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Cache uv wheel cache
        if: steps.changes.outputs.seam == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-write-seam-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-write-seam-3.12-

      - name: Cache MiniLM ONNX model
        if: steps.changes.outputs.seam == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/chroma
          key: chromadb-onnx-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            chromadb-onnx-${{ runner.os }}-

      - name: Install project + dev deps
        if: steps.changes.outputs.seam == 'true'
        run: uv sync --group dev

      - name: Stamp release_version into the gate JAR
        # nexus-h29w1: this gate builds a SOURCE shaded JAR, whose
        # release.properties release_version is BLANK by design (stamped only at
        # native-release time from the engine-service tag). Since the fail-loud
        # cloud version probe landed (3cb14f96), the http_vector_client connection
        # path fail-closes on an unstamped engine (release_version=None < floor),
        # which is exactly what the gate's local service reported. Stamp the
        # PINNED_SERVICE_TAG version (develop-tip is >= the pinned release) so the
        # gate exercises a CONFORMANT engine and the probe is satisfied
        # legitimately — no probe bypass, the hardening stays intact. Extracted
        # from engine_version.py's REQUIRED_ENGINE_VERSION — the ONE floor
        # constant — so it never drifts when the pin bumps. (Was extracted from
        # binary_install.py's PINNED_SERVICE_TAG literal until 2026-07-12, when
        # the nexus-b6qlf-class unification made that constant DERIVED from
        # REQUIRED_ENGINE_VERSION and the literal this regex matched ceased to
        # exist — m.group(1) on None broke every seam-gated CI run. Same
        # extraction run.sh --guided uses; fail-loud, no fallback.)
        if: steps.changes.outputs.seam == 'true'
        run: |
          set -euo pipefail
          ver=$(python -c "import re,pathlib; s=pathlib.Path('src/nexus/engine_version.py').read_text(); m=re.search(r'REQUIRED_ENGINE_VERSION[^=]*=\s*\((\d+),\s*(\d+),\s*(\d+)\)', s); assert m, 'REQUIRED_ENGINE_VERSION not parseable — fix the regex before stamping'; print('.'.join(m.groups()))")
          props="service/src/main/resources/META-INF/nexus/release.properties"
          test -f "$props" || { echo "release.properties missing at $props"; exit 1; }
          tmp="$(mktemp)"
          grep -v '^release_version=' "$props" > "$tmp"
          printf 'release_version=%s\n' "$ver" >> "$tmp"
          mv "$tmp" "$props"
          echo "stamped release_version=$ver"
          grep '^release_version=' "$props"

      - name: Build service JAR (shaded, -DskipTests)
        # Build the JAR that upsert_chunks posts to. Uses the standard Maven
        # shaded package (NOT native) — we need the JVM jar, not a native binary,
        # so the build is ~30s vs ~5m for native.
        if: steps.changes.outputs.seam == 'true'
        working-directory: service
        run: ./mvnw -q package -DskipTests

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        # nexus-h29w1: the JAR boots its local ONNX embedder at startup
        # (RDR-160 = bge-768). Without the model the service never finishes
        # booting and never binds its port → the gate timed out ("port not
        # reachable after 90s"). Centralised in .github/actions/prime-bge-onnx
        # (self-hosted release asset, no HuggingFace 429 dependency).
        if: steps.changes.outputs.seam == 'true'
        uses: ./.github/actions/prime-bge-onnx

      - name: Run write-seam gate (>300-record, dup-chash, ON CONFLICT, NUL-sanitize, combined-query tripwire)
        if: steps.changes.outputs.seam == 'true'
        env:
          # FAIL (not skip) on missing/stale JAR in CI — the conftest.py autouse
          # _service_jar_freshness fixture checks CI=true (already set by GitHub
          # Actions) and calls pytest.fail() instead of pytest.skip(). Setting
          # NX_REQUIRE_SERVICE_JAR=1 is belt-and-suspenders for local scripted runs
          # that set neither CI nor GITHUB_ACTIONS.
          NX_REQUIRE_SERVICE_JAR: "1"
          CI: "true"
        run: |
          set -euo pipefail
          # -o addopts="" clears the repo default -m 'not integration' so the
          # integration-marked test module is collected (same pattern as CA-3 jobs).
          # nexus-4nflf: the combined-query tripwire module shares this job's
          # JAR+Docker-PG+ONNX boot (same cost profile) — one pytest invocation,
          # one junit-xml, one assert_write_seam_ran.py call for both modules.
          uv run pytest tests/db/test_write_seam_gate_integration.py \
            tests/db/test_http_combined_query_integration.py \
            -o addopts="" -m integration -q -rs --junit-xml=write-seam.xml
          # Non-vacuity gate: asserts the dedup-collapse AND the combined-query
          # manifest-rewrite-visibility core tests actually ran+passed, and no
          # prereq-skip vacuously cleared the run.
          uv run python scripts/assert_write_seam_ran.py write-seam.xml
