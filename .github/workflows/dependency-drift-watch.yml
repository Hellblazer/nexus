name: Dependency drift watch (weekly)

# nexus-jd8fi drift (2026-09-03). scripts/check_dependency_drift.py existed
# since the 2026-08-14 gap audit and was scheduled nowhere, so the question
# it asks ("what would a fresh PyPI resolution change?") was never asked:
# mineru drifted 3.1.11 -> 3.4.5 (and the layout extractor RDR-237 later removed,
# 2.76.0 -> 2.125.0) under every
# fresh install while uv.lock and every gate stayed put. This is the
# schedule. It runs `uv lock --upgrade --dry-run` (never writes the lock)
# with --fail-on shape: the run is red only for an UNACKNOWLEDGED change in
# the shape-sensitive set. Leading-component drift in the transitive graph
# is routine (20 packages on 2026-09-03) and is rendered in the log and the
# step summary, never as a failure, so this weekly cannot sit permanently
# red and bury other workflows' signal. A refused version is acknowledged in
# the script's SHAPE_SENSITIVE_ACKNOWLEDGED map, which is what clears a red.
#
# The second job (nexus-2k66t.4.5) audits the SHIPPED install lock,
# src/nexus/_install/constraints.txt, with pip-audit: since nexus-2k66t.4.1
# every install is pinned to it, so a transitive security fix reaches users
# only through a nexus release, and this is what prompts that release. Red
# only for an advisory that has a fixed version and is not acknowledged in
# scripts/audit_install_lock.py ACKNOWLEDGED (with its reason); an advisory
# with no fix is shown and never fails.
#
# CI-cost discipline (CLAUDE.md DIRECTIVES): two ubuntu jobs, no build, no
# tests, seconds of runtime. Weekly + manual dispatch only.

on:
  schedule:
    - cron: "23 11 * * 1"   # 11:23 UTC Mondays, staggered off the 10:17 / 10:47 Monday slots
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift-watch
  cancel-in-progress: true

jobs:
  drift:
    name: fresh-resolution drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ask what a fresh PyPI resolution would change
        run: |
          set -uo pipefail
          # The script's exit code is the verdict; capture it without a pipe
          # (tests/test_workflow_run_pipefail_lint.py) and without -e.
          set +e
          uv run --no-sync --python 3.12 python scripts/check_dependency_drift.py --fail-on shape > drift.txt 2>&1
          rc=$?
          set -e
          cat drift.txt
          { echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  lock-audit:
    name: install-lock vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Audit the shipped install lock with pip-audit
        run: |
          set -uo pipefail
          # The script's exit code is the verdict; capture it without a pipe
          # (tests/test_workflow_run_pipefail_lint.py) and without -e.
          set +e
          uvx --quiet pip-audit -r src/nexus/_install/constraints.txt --no-deps --disable-pip \
            --progress-spinner off --format json -o audit.json > pip-audit.log 2>&1
          audit_rc=$?
          python3 scripts/audit_install_lock.py audit.json > audit.txt 2>&1
          rc=$?
          set -e
          cat pip-audit.log audit.txt
          { echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # pip-audit exits 1 when it finds anything; the verdict is the script's.
          # A pip-audit that wrote no report is caught by the script (exit 2).
          echo "pip-audit exit $audit_rc"
          exit "$rc"
