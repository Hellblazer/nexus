name: Engine Bundle Canary

# Runs develop's engine substrate on a NEW engine tag's PG bundle, before a client release pins it.
#
# WHY. develop CI exercises only the PG bundle of REQUIRED_ENGINE_VERSION, which moves at a client release,
# so a new engine tag's bundle is first tested by the release PR's CI. conexus 8.3.0's PR went red that way:
# engine-service-v0.1.194 bundles pgvector 0.8.7, whose CREATE EXTENSION runs 147 more DDL statements, and
# tests/ddl_ceiling.toml [python_unit] migration_ddl_per_worker read 2578 against 2431.
# scripts/engine_bundle_canary.py measures BOTH the pinned bundle and the tag's bundle (the scoped substrate
# tests plus the journey file, `ddl: migration=N`). It fails when the pinned count differs from the ceiling
# (develop drifted), when tests are red, or when nothing was measured. When the tag's count differs from the
# pinned one it exits 0 with a warning and a summary line: the client release that pins the tag moves the
# ceiling to the tag's count with the reason (docs/agents/engine-service-release.md, "Engine-bundle canary").
#
# TRIGGERS. Once per engine tag, never per push or PR (CI cost discipline):
#   - workflow_call from engine-service-release.yml's `bundle-canary` job, after promote-release publishes. A
#     publish made with GITHUB_TOKEN raises no `release` event, and a called workflow resolves at the calling
#     tag's commit, so this works before main has the file;
#   - release published, engine-service-v* tags only (a human publishing the draft by hand; the job-level `if`
#     skips a conexus v* release);
#   - workflow_dispatch with the tag to test.
#
# RUNNER. The pytest shards' pool class (lab-6c18g, 6 cores, 18 GB), the same runs-on shape as ci.yml's `test`
# job minus the fork-PR clause (no pull_request trigger here); repo variable NX_CI_POOL=off sends it to
# ubuntu-latest. The jar is built on ubuntu-latest the way ci.yml's service-jar job does (jOOQ codegen needs
# Docker, which the pool's pytest class is not probed for). Both jobs check out ONE develop sha, resolved by
# the first, so the jar and the tests are the same tree.

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Engine tag to test, engine-service-vX.Y.Z"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Engine tag to test, engine-service-vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # event_name is the CALLER's in a called workflow (push, for the engine release's tag run), so the call, a hand
  # dispatch and a hand-published release each get their own group per tag: a hand dispatch can never cancel the
  # in-flight call.
  group: engine-bundle-canary-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  service-jar:
    name: service jar (canary substrate)
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'engine-service-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_JOOQ_CACHE: "off"
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # develop's tests and ceiling are what the new bundle is judged against; a dispatch from another
          # branch tests that branch (tests/test_workflow_dispatch_ref_lint.py).
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
          persist-credentials: false

      - name: Resolve the one revision both jobs test
        # Named revision, not sha: CodeQL's cache-poisoning query reads a checkout ref whose output or step is
        # named like head, sha or commit as an untrusted pull-request head (code scanning alert 61). This is the
        # commit of the ref checked out above, develop or the dispatching branch, which the query trusts.
        id: revision
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up GraalVM 25.0.3
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'

      - name: Restore the Maven cache and set Central retries
        uses: ./.github/actions/maven-cache
        with:
          job-class: package

      - name: Build shaded jar (no tests, no native)
        working-directory: service
        run: ./mvnw -q -DskipTests package

      - name: Upload jar for the canary job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: canary-service-jar
          path: service/target/nexus-service-1.0-SNAPSHOT.jar
          retention-days: 1
          if-no-files-found: error

  canary:
    name: engine bundle canary
    needs: service-jar
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'engine-service-v') }}
    runs-on: ${{ vars.NX_CI_POOL == 'off' && 'ubuntu-latest' || 'lab-6c18g' }}
    timeout-minutes: 45
    env:
      ENGINE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # An absent or stale jar fails the substrate loudly instead of skipping it.
      NX_T2_SUBSTRATE_EXPECTED: "1"
    steps:
      - name: Host binaries present (labrun-owz)
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          NX_CI_HOST_BINARIES: bash git curl tar gzip xz unzip python3 ps pgrep setsid flock timeout ipcs sha256sum
        run: |
          set -u
          [ -n "${NX_CI_HOST_BINARIES// /}" ] || { echo "host probe: empty binary list"; exit 1; }
          missing=0
          for b in $NX_CI_HOST_BINARIES; do
            command -v "$b" >/dev/null 2>&1 || { echo "host missing: $b"; missing=1; }
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          ref: ${{ needs.service-jar.outputs.revision }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Fetch the service jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: canary-service-jar
          path: service/target

      - name: Re-stamp the jar mtime
        # tests/db/_service_fixture.py::jar_freshness_skip_reason compares the jar's mtime with the newest file
        # under service/src; git stamps every checked-out file at checkout time, so a downloaded jar always
        # looks older than the sources it was built from (the same note as ci.yml's step of this name).
        run: touch service/target/nexus-service-1.0-SNAPSHOT.jar

      - name: Set up Java (to launch the service jar)
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        uses: ./.github/actions/prime-bge-onnx
        with:
          persistent-home: ${{ runner.environment == 'self-hosted' }}

      - name: Install project + dev deps
        run: uv sync --group dev

      - name: Run the canary on the tag's PG bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            export TMPDIR="$RUNNER_TEMP/tmp"
            mkdir -p "$TMPDIR"
            export NX_ONNX_INTRA_OP_THREADS=2
          fi
          uv run python scripts/engine_bundle_canary.py --tag "$ENGINE_TAG"
