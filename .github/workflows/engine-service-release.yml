name: Engine Service Native Release

# RDR-157 P2 / beads nexus-vwvv5.6 + nexus-6o0bc.
#
# Publishes the native `nexus-service` binary (the engine storage server) as a
# consumable artifact so conexus `deploy/engine` can build its runtime image
# FROM the published binary instead of throwaway-cloning + JAR/jlink. This is
# the RDR-157 "cloud habitat" variant: the same native binary, run with no
# embedded PG — it connects to a managed Postgres via NX_DB_URL and skips
# pg_provision.
#
# CHANNEL — deliberately separate from the `conexus` PyPI release (`vX.Y.Z`
# tags / release.yml). The engine-service binary is a DIFFERENT artifact from
# the conexus package, so an `engine-service-v*` tag here does NOT trip the
# develop release boundary (RDR-155 P4a) and publishes nothing to PyPI.
#
#   - workflow_dispatch : build + smoke + upload an Actions artifact only
#                         (reversible dev path — download it to smoke conexus
#                         locally / in the cloud, no GitHub Release created).
#   - push tag engine-service-v*
#                       : build + smoke + create a GitHub Release and attach the
#                         linux-amd64 native binary + its sha256 (what conexus
#                         pins and pulls).
#
# Per-platform matrix (nexus-vwvv5.6): linux-amd64 + linux-arm64 + mac-arm64
# native binaries on their own runners (native-image does not cross-compile).
# The jOOQ decouple (nexus-f6j31) pre-generates sources on a Docker-capable linux
# runner and passes them as an artifact, so mac-arm64 can BUILD without Docker.
# mac-arm64 runs on hellmini, a self-hosted Mac mini M5 Pro (nexus-yd9po) — it
# has Docker via colima, so it is now SMOKED (closes the nexus-4xf5m coverage
# gap: native-smoke.sh's throwaway pgvector needs Docker, which GH-hosted
# macOS runners lack). workflow_dispatch's `mac_runner` input falls back to
# macos-14 (UNSMOKED there, same as before) when hellmini is offline; a tag
# push always targets hellmini.
# conexus pins/pulls the linux-amd64 asset; local-distro users grab their arch.
#
# windows-x64 (RDR-224 P1.2, nexus-f9bgu.9) is NOT a matrix entry: it is the
# build-publish-engine-windows job below, on the self-hosted `win-release`
# runner and only while the repo variable NX_WINDOWS_RELEASE_LEGS is 'on'. The
# matrix job carries the apple-signing environment (an approval click), bash
# steps and mac-only steps, and one matrix entry cannot be skipped on its own;
# a separate job leaves the three existing legs byte for byte as they were. Its
# asset is ONE archive, nexus-service-windows-x64.txz (exe plus the four VC++
# runtime DLLs, P0.4), with a .sha256 and a .sigstore.json (new bundle format
# only: the client verifies that, and no cloud deploy consumes this asset).

on:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: >-
          Runner label for the mac-arm64 legs. Default is the hellmini
          self-hosted Mac mini (nexus-yd9po); fall back to macos-14 when
          hellmini is offline (e.g. a FileVault reboot leaves it waiting on
          a KVM unlock).
        required: false
        default: hellmini
        type: choice
        options:
          - hellmini
          - macos-14
  push:
    tags:
      - 'engine-service-v*'

permissions:
  contents: write  # create the GitHub Release + upload assets on tag push
  id-token: write  # nexus-1odsm: keyless cosign signing of release assets (OIDC)

concurrency:
  group: engine-service-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Generate jOOQ sources ONCE on a Docker-capable runner (testcontainers codegen
  # needs Docker), upload them. The per-platform native builds then consume the
  # artifact with -Pprebuilt-jooq and need no Docker — which unblocks mac-arm64
  # (GH macOS runners have no Docker). nexus-f6j31.
  jooq-codegen:
    name: jOOQ codegen (linux, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
      - name: Set up GraalVM 25.0.3
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Run testcontainers jOOQ codegen
        working-directory: service
        # generate-sources triggers testcontainers-jooq-codegen (boots pgvector,
        # applies the master changelog, generates into target/generated-sources/jooq).
        run: ./mvnw -q generate-sources
      - name: Upload generated jOOQ sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jooq-sources
          path: service/target/generated-sources/jooq
          if-no-files-found: error
          retention-days: 3

  # nexus-84ki0: create the GitHub Release in a dedicated, fast, tag-only job
  # that BOTH publish jobs below `needs:` — decoupling "does the release
  # exist yet" from the (up to 65-minute) native-binary matrix and from
  # jooq-codegen. The prior structure had build-publish-pg-bundle `needs:
  # build-publish` only; that is correct ONLY while build-publish actually
  # RUNS. On engine-service-v0.1.61 (2026-08-01, run 30722685942) jooq-codegen
  # hit its timeout and was killed (cancelled) after 25m, so build-publish
  # (needs: jooq-codegen, no override) was SKIPPED without ever reaching its
  # inline release-create step — but build-publish-pg-bundle's `if:
  # !cancelled()` (added to tolerate a PARTIAL build-publish matrix failure,
  # substantive-critic S2) also bypasses a full SKIP of build-publish, so all
  # three PG-bundle matrix legs raced ahead of a release that was never
  # created and failed "release not found" (confirmed in the job logs).
  #
  # This job needs nothing but the tag itself, typically completes in
  # seconds, and both matrices below `needs:` it instead of each other —
  # which *improves* parallelism (the PG-bundle matrix no longer waits on
  # the native-binary matrix at all) while closing the race.
  #
  # TRADEOFF (documented, not accidental): this gives up the old incidental
  # property that a TOTAL native-binary failure left no release for the
  # PG-bundle job to upload to (S2's "worse state than a clean failure").
  # A release can now carry PG bundles with zero native binaries attached if
  # every build-publish matrix leg fails. Both matrices already run
  # fail-fast: false, so a release with a partial asset set is already an
  # accepted characteristic of this workflow — asset-completeness was not
  # verified before this change either.
  create-release:
    name: Create GitHub Release (engine-service-v* tag only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/engine-service-v')
    timeout-minutes: 5
    steps:
      # nexus-3wh8d.28: a tag whose tree carries a changeset listed in scripts/release-holds.txt gets no release,
      # and both publish matrices need this job, so nothing is built or attached. The engine-release skill runs
      # the same check before the tag is pushed; this is the backstop for a tag pushed without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
      - name: Refuse a tag that carries a held changeset
        run: python3 scripts/check_release_holds.py
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # printf (not a heredoc): immune to YAML run-block indentation.
          printf '%s\n' \
            "Native nexus-service binaries for the RDR-157 cloud + local habitats:" \
            "run with no embedded PG, pointed at a managed Postgres via NX_DB_URL" \
            "(skips pg_provision). Consumed by conexus deploy/engine (build the" \
            "runtime image FROM the linux-amd64 binary). Per-platform assets +" \
            "sha256 attached: nexus-service-linux-amd64, nexus-service-linux-arm64," \
            "nexus-service-mac-arm64." \
            "" \
            "NOTE: the mac-arm64 binary is built + smoke-tested on the hellmini" \
            "self-hosted runner (Mac mini M5 Pro, Docker via colima; nexus-yd9po)." \
            "A workflow_dispatch run whose mac_runner input falls back to macos-14" \
            "(hellmini offline) builds mac-arm64 UNSMOKED instead -- GH-hosted macOS" \
            "has no Docker for native-smoke.sh; treat that build as experimental." \
            "All three binaries ARE smoke-tested on a normal tag-push release." \
            "mac-arm64 signing: Developer-ID signed + notarized WHEN the repo" \
            "variable APPLE_SIGNING_REQUIRED is true (see the build job summary for this run's" \
            "actual status); otherwise ad-hoc-signed — browser downloads are then" \
            "Gatekeeper-blocked, but 'nx daemon service install-binary' (urllib" \
            "fetch, no quarantine xattr) works either way. Ticket is checked" \
            "online; bare Mach-O cannot be stapled." \
            "" \
            "glibc floor: linux binaries built on ubuntu-latest (~2.39). The runtime" \
            "base must have glibc >= that (conexus uses debian:trixie-slim = 2.41);" \
            "deploy/engine/build-image.sh enforces this via objdump." \
            "" \
            "ONNX model NOT bundled (RDR-160) — in local mode the binary loads the" \
            "STANDARD fp32 bge-base-en-v1.5 ONNX from the filesystem at runtime." \
            "Before building the runtime image, stage it (or run nx init --service):" \
            "  MODEL_DIR=~/.cache/nexus/onnx_models/bge-base-en-v1.5/onnx; mkdir -p \$MODEL_DIR" \
            "  base=https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-assets-bge-768-v1" \
            "  curl -fL --retry 5 --retry-all-errors \$base/model.onnx -o \$MODEL_DIR/model.onnx" \
            "  curl -fL --retry 5 --retry-all-errors \$base/tokenizer.json -o \$MODEL_DIR/tokenizer.json" \
            "" \
            "Provenance: each asset carries a sha256 AND a keyless cosign/Sigstore" \
            "signature in TWO bundle formats — <asset>.cosign.bundle (old JSON) and" \
            "<asset>.sigstore.json (new protobuf). Verify before use, either path:" \
            "  cosign verify-blob <asset> --bundle <asset>.cosign.bundle \\" \
            "    --certificate-oidc-issuer https://token.actions.githubusercontent.com \\" \
            "    --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/engine-service-release.yml@refs/tags/engine-service-v.*'" \
            "conexus deploy verifies the .cosign.bundle before docker run (ECR_PUSH.md)." \
            "The local 'nx daemon service install-binary' path verifies the protobuf" \
            ".sigstore.json offline via sigstore-python (no cosign binary required)." \
            > notes.md
          # Idempotent: a rerun of this job (e.g. `gh run rerun --failed`) must
          # not fail when the tag's release already exists from a prior attempt.
          # nexus-cl14i: created as a DRAFT. Every downstream consumer keys on
          # the tag (REQUIRED_ENGINE_VERSION, install-binary, deploy relays,
          # check_engine_release_floor's isDraft check), and a draft is not
          # resolvable by any of them, so a run that fails anywhere upstream
          # of the binaries leaves NO consumable release, not a half-published
          # one. promote-release (below) flips the draft flag only after both
          # matrices succeeded and the full asset set is present.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "nexus-service (native) ${tag}" --notes-file notes.md
          fi

  build-publish:
    name: Build + smoke + publish native nexus-service (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    needs: [jooq-codegen, create-release]
    # Job-level if (replaces the implicit success()-on-needs default): must
    # still run on workflow_dispatch, where create-release is SKIPPED by its
    # own tag-only `if:` (no release to create off-tag) — success() alone
    # would treat that skip as "not satisfied" and skip this job too, which
    # would break the workflow_dispatch dev/smoke path entirely. Require
    # jooq-codegen to have actually SUCCEEDED (unchanged from before: no
    # jOOQ sources, no build), and require create-release to not have
    # FAILED outright (tolerates its skip on non-tag runs, blocks on tag
    # runs where release creation itself errored — no point burning a
    # 40-65m native build with nowhere to publish it).
    if: ${{ !cancelled() && needs.jooq-codegen.result == 'success' && needs.create-release.result != 'failure' }}
    # APPLE SIGNING SECRETS ARE ENVIRONMENT-SCOPED, NOT REPO-SCOPED (nexus-2oh5q).
    #
    # The six APPLE_* secrets live in the `apple-signing` environment. Repo-level
    # secrets are readable by ANY job in ANY workflow that names them — including
    # a workflow added later — and the Developer ID private key is the one
    # credential here whose compromise is not cleanly recoverable: Apple's remedy
    # is revoking the cert, and Gatekeeper checks revocation ONLINE, so binaries
    # already shipped can start failing. Environment scoping means only a job
    # that declares this environment can read them, and only after the required
    # reviewer approves.
    #
    # The environment's deployment policy allows the `engine-service-v*` tag (the
    # real release path) and `develop` (so the workflow_dispatch dev path in the
    # header still runs — a ref outside the policy is REJECTED, not merely
    # gated). The signing STEPS remain independently tag-gated, so the policy is
    # defence in depth rather than the only control.
    #
    # COST, stated so it is not a surprise: every run of this job now waits for
    # one approval, including the linux legs that need no secrets. Approval is
    # per-environment-per-run, so one click releases all three matrix legs. The
    # alternative — splitting mac signing into its own job so linux runs
    # unattended — means rewriting this 20-step job into a build/sign/publish
    # graph with artifact plumbing, in a workflow that only executes on a tag
    # push. Not worth the post-tag-discovery risk for an approval click on a
    # release the human just cut by hand.
    environment: apple-signing
    # Native-image build (~2-3m analysis + image) + native smoke test (all three
    # arches now, nexus-yd9po). No jOOQ codegen here — sources come from the
    # jooq-codegen artifact, so no Docker is needed to BUILD (mac-arm64 can
    # build). 40m covers a cold runner; mac-arm64 gets 65m on tag runs to cover
    # its macos-14-fallback path (a slow 8GB build) PLUS the nexus-27i0m
    # notarytool --wait (up to 20m on a slow Apple queue) — hellmini itself is
    # expected to be faster on both counts (review 96677bf7 Suggestion 3).
    timeout-minutes: ${{ matrix.target.timeout }}
    strategy:
      fail-fast: false
      # max-parallel: 2 — the two linux builds run in parallel (they schedule
      # cleanly on the shared GH-hosted pool). mac-arm64 (ordered last) only
      # starts once a linux slot frees; when it falls back to macos-14 this
      # still matters (the scarce shared GH macOS pool was getting
      # starved-then-slammed when all three launched at once). On hellmini
      # (the default) mac-arm64 has its own dedicated runner and isn't
      # actually contending for anything, but the deferred ordering is
      # harmless there too, so it stays unconditional.
      max-parallel: 2
      matrix:
        # maxheap: log-measured per-runner (engine-service-v0.1.40 run 29258747763).
        # Both linux boxes report ~16GB (5632m showed as 31% of system memory) and
        # were heap-starved at the pom default (1208/2519 GCs); 11g = ~69%, leaving
        # room for the observed ~1.7GB native-image RSS overhead above heap.
        # mac-arm64 stays at the pom default: its log shows peak RSS (4.55GB) never
        # reached the 5.25GB heap — the 8GB box itself is the constraint there, and
        # a larger heap would deepen the swap pressure behind its 25%-GC-time build.
        target:
          - { arch: linux-amd64, runner: ubuntu-latest,    smoke: true,  maxheap: 11g, timeout: 40 }
          - { arch: linux-arm64, runner: ubuntu-24.04-arm, smoke: true,  maxheap: 11g, timeout: 40 }
          # mac-arm64: SMOKED (nexus-yd9po, closes nexus-4xf5m's coverage gap) --
          # runs on the hellmini self-hosted runner (Mac mini M5 Pro), which has
          # Docker via colima, so native-smoke.sh's throwaway-pgvector container
          # works here unlike on GH-hosted macOS. workflow_dispatch can fall back
          # to macos-14 (UNSMOKED there too -- no Docker) when hellmini is down;
          # a tag push always defaults to hellmini.
          - { arch: mac-arm64,   runner: "${{ inputs.mac_runner || 'hellmini' }}", smoke: "${{ (inputs.mac_runner || 'hellmini') == 'hellmini' }}", maxheap: 5632m, timeout: 65 }
    env:
      ASSET: nexus-service-${{ matrix.target.arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Set up GraalVM 25.0.3
        # SHA-pinned (not @v1): this is a PUBLISH path that creates a GitHub
        # Release, so a floating tag is a supply-chain hole. bef4b0e == v1.
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1
        with:
          # >= 25.0.2 REQUIRED: the bundled jOOQ / liquibase reachability metadata
          # use GraalVM's unified reachability-metadata schema (nexus-lp2qo).
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        # RDR-160: in local mode the native binary constructs Bge768Embedder,
        # which loads the STANDARD fp32 bge-base-en-v1.5 ONNX from ~/.cache/nexus
        # — the native smoke needs it. Centralised in
        # .github/actions/prime-bge-onnx (self-hosted release asset, no
        # HuggingFace 429 dependency). Arch-qualified cache key: one cold
        # download per arch, restored thereafter.
        uses: ./.github/actions/prime-bge-onnx
        with:
          cache-key: bge-onnx-standard-${{ runner.os }}-${{ matrix.target.arch }}-v1

      - name: Prime ms-marco cross-encoder ONNX (cache or pinned HF revision)
        # RDR-188 P1: the native smoke's fused-rerank section exercises the
        # cross-encoder's STRONG scoring path (DJL pair tokenization + a second
        # OrtSession in the native image) only when the ~91MB artifact is
        # present; absent, it falls back to asserting the LOUD-degrade contract.
        # Prime it so release binaries are gated on real native inference.
        uses: ./.github/actions/prime-crossencoder-onnx
        with:
          cache-key: crossencoder-onnx-msmarco-${{ runner.os }}-${{ matrix.target.arch }}-v1

      - name: Resolve engine-service version
        id: ver
        # On a tag push, the published version is the tag minus the
        # 'engine-service-v' prefix. On workflow_dispatch (dev/smoke) there is no
        # release version. RDR-002: the version is stamped into a dedicated
        # release_version field (see the release.properties stamp step below), NOT
        # into the Maven app_version — app_version stays 1.0-SNAPSHOT (the dev
        # coordinate). nx clients pin on release_version (RDR-002 ez5.4) and
        # fail-closed when it is null (dev/unstamped build).
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/engine-service-v* ]]; then
            echo "version=${ref#engine-service-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-generated jOOQ sources
        # From the jooq-codegen job — compiled by -Pprebuilt-jooq below. No Docker
        # needed to build, which is what lets mac-arm64 build here.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: jooq-sources
          path: service/target/generated-sources/jooq

      - name: Stamp release_version into the binary (tag push only)
        # RDR-002 (conexus PR #78): bake the release identity into a dedicated
        # release_version field read by VersionHandler from
        # META-INF/nexus/release.properties — NOT into the Maven app_version
        # (do NOT versions:set the pom; app_version stays 1.0-SNAPSHOT, the dev
        # coordinate). On workflow_dispatch the file stays blank in source, so
        # VersionHandler reports release_version=null and the RDR-002 pin
        # fail-closes — exactly the intended dev-build behaviour.
        if: steps.ver.outputs.version != ''
        working-directory: service
        env:
          # Via env (not direct ${{ }} interpolation into the script body): a git
          # tag can legally contain shell metacharacters, so interpolating it into
          # the command text is an injection vector (code-review H1). The runner
          # sets this as an env value; the shell never re-parses it as code.
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          props="src/main/resources/META-INF/nexus/release.properties"
          test -f "$props" || { echo "release.properties missing at $props"; exit 1; }
          # Overwrite the release_version line in place (preserve the header).
          tmp="$(mktemp)"
          grep -v '^release_version=' "$props" > "$tmp"
          printf 'release_version=%s\n' "$RELEASE_VERSION" >> "$tmp"
          mv "$tmp" "$props"
          echo "stamped release_version=$RELEASE_VERSION"
          grep '^release_version=' "$props"

      - name: Build native image (-Pnative -Pprebuilt-jooq)
        working-directory: service
        # -Pprebuilt-jooq unbinds the testcontainers codegen and compiles the
        # downloaded sources → no Docker needed (mac-arm64 builds here).
        # Do NOT `clean`: it would wipe the downloaded target/generated-sources/jooq.
        env:
          # nexus-280ei: belt-and-suspenders alongside the pom.xml's
          # -H:NativeLinkerOption/-H:CCompilerOption buildArgs (native-libs-mac
          # profile, service/pom.xml) — those are the actual enforcement,
          # proven on hellmini, because GraalVM native-image drives its own
          # clang/ld invocation and does not reliably inherit this var from
          # the environment. Harmless on linux: nothing there reads a
          # Darwin-only env var. Must match the "Assert binary ABI floor"
          # step's ceiling below and the pom.xml value.
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          # nexus-zz2w7: native-image writes target/embedded-resources.json (every
          # embedded resource and its origins) for the "Check the embedded native
          # resources" step below. No extra build: the same native-image run.
          NATIVE_IMAGE_OPTIONS: "-H:+UnlockExperimentalVMOptions -H:+GenerateEmbeddedResourcesFile"
        # No -q: the checker reads the `--- jar:...:jar`, `--- native:...:compile-no-fork`,
        # `--- shade:...:shade` execution lines to prove build order, and -q suppresses
        # them. -B -ntp keep the log free of progress bars and download noise. The log
        # goes to $RUNNER_TEMP through tee, with pipefail so a failed build still fails
        # the step (a bare pipe into tee would exit with tee's status).
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Pnative -Pprebuilt-jooq -DskipTests -Dnative.image.maxheap=${{ matrix.target.maxheap }} package 2>&1 | tee "$RUNNER_TEMP/native-build.log"

      - name: Check the embedded native resources (nexus-zz2w7)
        # The same check ci.yml's PR trip-wire runs on linux, now on every shipped
        # binary: a mac-only regression (osx onnxruntime embedded twice, a .dSYM)
        # or a lost required library fails the leg before smoke and publish.
        # Per-platform directories and the required-library list are the
        # checker's PLATFORMS entry for this leg's matrix arch.
        run: |
          python3 scripts/check_native_embedded_resources.py \
            --report service/target/embedded-resources.json \
            --build-log "$RUNNER_TEMP/native-build.log" \
            --platform ${{ matrix.target.arch }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        if: ${{ format('{0}', matrix.target.smoke) == 'true' }}
        # nexus-97oz3: native-smoke.sh's T1 section shells `uv run python` to
        # exercise the REAL nexus.db.t1.get_t1_database() client against the
        # native binary this job just built -- routing-correctness (Python)
        # and backend-correctness (the compiled artifact) proven TOGETHER,
        # closing the seam that let nexus-opr9m (a native-image-only
        # reflection bug) ship silently through this exact gate. Without
        # this step `uv` is absent and that section WARN+skips, silently
        # reverting to curl-only coverage. Gated on matrix.target.smoke
        # (mac-arm64 never runs the smoke step at all) so the non-smoking
        # leg doesn't pay for a toolchain it never uses.
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install nexus (for native-smoke.sh's real-client T1 check)
        if: ${{ format('{0}', matrix.target.smoke) == 'true' }}
        run: uv sync

      - name: Native smoke test (boot against throwaway pgvector)
        if: ${{ format('{0}', matrix.target.smoke) == 'true' }}
        working-directory: service
        # Asserts liquibase migration + jOOQ INSERT/SELECT/FTS return 200 against
        # a real Postgres — the cloud runtime path. Don't publish a broken binary.
        # Needs Docker: linux-{amd64,arm64} always have it; mac-arm64 has it too
        # when running on hellmini (colima), but not on the macos-14 fallback —
        # matrix.target.smoke is false there (nexus-yd9po).
        run: ./native-smoke.sh

      - name: Developer ID codesign (mac-arm64; nexus-27i0m)
        # Signs the bare Mach-O IN PLACE — must run BEFORE the sha256 stage
        # and cosign steps, which hash the final bytes. Secrets are Hal's
        # Apple Developer identity (provisioning checklist in the bead):
        #   APPLE_DEV_ID_CERT_P12      — Developer ID Application cert, .p12 base64
        #   APPLE_DEV_ID_CERT_PASSWORD — the .p12 passphrase
        #   APPLE_DEV_ID_IDENTITY      — e.g. "Developer ID Application: Hal Hildebrand (TEAMID)"
        # OPT-IN by repo variable, not by secret presence (nexus-e8iml): the
        # secrets also live in apple-signing so mac-signing-rehearsal.yml can
        # run, and restoring them for a rehearsal must not arm the next tag.
        # APPLE_SIGNING_REQUIRED unset (or anything but "true") → the ad-hoc
        # GraalVM linker signature ships whatever secrets exist, said in the
        # step summary (runs via nx install-binary; Gatekeeper-blocked on
        # browser download). "true" → sign, and absent or partial secrets
        # FAIL (never a silent downgrade). Behavior is pinned by running this
        # body in tests/test_engine_release_workflow_signing.py.
        # TAG-GATED like the sibling cosign steps (review 96677bf7 Critical):
        # a workflow_dispatch dev/smoke run must not burn a Developer-ID
        # sign + a 20-minute notarytool wait on a 10x-billed macOS runner
        # for a 14-day Actions artifact (CI Cost Discipline directive).
        if: matrix.target.arch == 'mac-arm64' && startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          APPLE_DEV_ID_CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
          APPLE_DEV_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
          APPLE_DEV_ID_IDENTITY: ${{ secrets.APPLE_DEV_ID_IDENTITY }}
          APPLE_SIGNING_REQUIRED: ${{ vars.APPLE_SIGNING_REQUIRED }}
        run: |
          set -euo pipefail
          bin="service/target/nexus-service"
          if [ "${APPLE_SIGNING_REQUIRED:-}" != "true" ]; then
            echo "::notice title=mac-arm64 UNSIGNED (ad-hoc)::Signing is off (repo variable APPLE_SIGNING_REQUIRED is not true); publishing the ad-hoc-signed binary. See docs/operations/apple-code-signing.md."
            echo "### mac-arm64 signing: SKIPPED — APPLE_SIGNING_REQUIRED is not true (ad-hoc binary published)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${APPLE_DEV_ID_CERT_P12:-}" ] || [ -z "${APPLE_DEV_ID_CERT_PASSWORD:-}" ] || [ -z "${APPLE_DEV_ID_IDENTITY:-}" ]; then
            echo "FAIL: APPLE_SIGNING_REQUIRED=true but the APPLE_DEV_ID_* secrets are absent or partial in the apple-signing environment. Restore all three, or consciously unset the repo variable." >&2
            exit 1
          fi
          # Mechanics live in service/deploy/mac-sign.sh (nexus-aq9y8) so the
          # dispatch-only mac-signing-rehearsal.yml runs the SAME bytes off-release:
          # temp keychain + vendored G2 intermediate, find-identity preflight,
          # codesign --force --options runtime --timestamp --keychain with
          # --entitlements service/deploy/mac-entitlements.plist (LOAD-BEARING,
          # nexus-2oh5q), verify --strict, and the TeamIdentifier non-vacuity
          # assert (fails on "ad-hoc signature survived").
          result="$(SIGN_WORKDIR="$RUNNER_TEMP" service/deploy/mac-sign.sh sign "$bin")"
          printf '%s\n' "$result"
          echo "### mac-arm64 signing: ${result##*$'\n'}" >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize (mac-arm64; nexus-27i0m)
        # Requires the Developer-ID-signed binary from the step above.
        # Secrets (App Store Connect API key):
        #   APPLE_NOTARY_KEY_P8     — .p8 private key, base64
        #   APPLE_NOTARY_KEY_ID    — key id
        #   APPLE_NOTARY_ISSUER_ID — issuer id
        # A bare Mach-O CANNOT be stapled (stapler needs .app/.dmg/.pkg) —
        # the notarization ticket is checked ONLINE by Gatekeeper, which is
        # sufficient for the browser-download case this bead closes.
        # TAG-GATED and OPT-IN by APPLE_SIGNING_REQUIRED (same rationale as
        # the codesign step above).
        if: matrix.target.arch == 'mac-arm64' && startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_SIGNING_REQUIRED: ${{ vars.APPLE_SIGNING_REQUIRED }}
        run: |
          set -euo pipefail
          bin="service/target/nexus-service"
          if [ "${APPLE_SIGNING_REQUIRED:-}" != "true" ]; then
            echo "### mac-arm64 notarization: SKIPPED — APPLE_SIGNING_REQUIRED is not true" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${APPLE_NOTARY_KEY_P8:-}" ] || [ -z "${APPLE_NOTARY_KEY_ID:-}" ] || [ -z "${APPLE_NOTARY_ISSUER_ID:-}" ]; then
            echo "FAIL: APPLE_SIGNING_REQUIRED=true but the APPLE_NOTARY_* secrets are absent or partial in the apple-signing environment. Restore all three, or consciously unset the repo variable." >&2
            exit 1
          fi
          # mac-sign.sh refuses an ad-hoc binary up front ("cannot notarize",
          # a guaranteed Apple-side rejection otherwise) and treats only
          # "status: Accepted" as success, printing the notary log on anything else.
          result="$(SIGN_WORKDIR="$RUNNER_TEMP" service/deploy/mac-sign.sh notarize "$bin")"
          printf '%s\n' "$result"
          echo "### mac-arm64 notarization: ${result##*$'\n'}" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing keychain (mac-arm64)
        if: always() && matrix.target.arch == 'mac-arm64'
        run: |
          # Deletes the temp keychain and restores the user search list saved
          # by `sign` (the old `-s login.keychain-db` reset left ghrunner's
          # list naming a login keychain that does not exist).
          SIGN_WORKDIR="$RUNNER_TEMP" service/deploy/mac-sign.sh cleanup

      - name: Stage artifact + sha256
        id: stage
        run: |
          set -euo pipefail
          src="service/target/nexus-service"
          test -x "$src" || { echo "native binary missing at $src"; ls -la service/target; exit 1; }
          # Size floor: a native image is tens of MB. A truncated/empty build that
          # still had its exec bit set would otherwise pass the -x check.
          # wc -c (not stat -c%s) for macOS/BSD portability.
          sz=$(wc -c < "$src")
          test "$sz" -gt 20000000 || { echo "native binary suspiciously small ($sz bytes)"; exit 1; }
          mkdir -p dist
          cp "$src" "dist/$ASSET"
          # sha256sum on linux, shasum -a 256 on macOS (identical file format).
          ( cd dist && { command -v sha256sum >/dev/null && sha256sum "$ASSET" || shasum -a 256 "$ASSET"; } > "$ASSET.sha256" )
          ls -la dist
          file "dist/$ASSET" || true

      - name: Assert binary ABI floor (code-review M1)
        # The release native image is built on ubuntu-latest (~glibc 2.39) — a
        # HIGHER floor than the CA-3 bundle gate (manylinux 2.28). Enforcement was
        # previously deferred entirely to conexus deploy/engine/build-image.sh, so a
        # runner bump that pushed the floor ABOVE the consumer base would surface
        # only at image-build time. Assert it here too: linux max-required GLIBC
        # must be <= the conexus runtime base (debian:trixie-slim = 2.41). For mac,
        # report the Mach-O minos (informational; no Docker smoke covers it).
        #
        # CROSS-REPO COUPLING (substantive-critic M1): the 2.41 ceiling is the glibc
        # of conexus's runtime base, whose canonical definition lives in the conexus
        # repo (deploy/engine/build-image.sh / its FROM image), NOT here. If conexus
        # changes its runtime base distro/version, UPDATE this ceiling in lockstep —
        # nothing in nexus/ will alert you otherwise. Keep this the looser (>=) of
        # the two bases if they ever diverge so the assertion never blocks a release
        # that the consumer would actually accept.
        run: |
          set -euo pipefail
          asset="dist/$ASSET"
          case "${{ matrix.target.arch }}" in
            linux-*)
              # Max GLIBC_x.y.z token referenced by the binary's dynamic symbols.
              maxglibc=$(objdump -T "$asset" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | sed 's/GLIBC_//' | sort -V | tail -1)
              if [ -z "$maxglibc" ]; then
                # No GLIBC tokens: a statically-linked binary (no floor to enforce).
                # GraalVM on linux currently emits DYNAMIC binaries, so flag this as
                # a surprising build change rather than silently passing (code-review L1).
                echo "NOTE: no GLIBC symbol references in $asset — statically linked? (no floor to assert)"
              else
                echo "max required GLIBC: $maxglibc"
                ceiling="2.41"  # conexus runtime base (debian:trixie-slim) — see header note
                if [ "$(printf '%s\n%s\n' "$maxglibc" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
                  echo "FAIL: binary requires GLIBC $maxglibc > consumer base $ceiling" >&2
                  exit 1
                fi
              fi
              ;;
            mac-*)
              # nexus-0n3vt: this arm was `|| true` — purely informational,
              # the ABI floor enforced on linux (cheap to catch) and
              # unenforced on the platform where toolchain drift is most
              # likely AND the binary ships with no smoke (nexus-4xf5m).
              # Now enforced: minos must parse (an empty probe is a FAIL,
              # never a silent pass) and must not exceed the supported
              # local-install floor.
              minos=$(otool -l "$asset" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; f=0}')
              if [ -z "$minos" ]; then
                echo "FAIL: could not read LC_BUILD_VERSION minos from $asset — the ABI probe produced nothing; refusing to publish an unproven binary" >&2
                exit 1
              fi
              echo "Mach-O minos: $minos"
              # Oldest macOS a local `nx init --service` install is expected
              # to run (dated 2026-08-18): Sonoma. A GraalVM/SDK bump that
              # raises minos beyond this strands existing local installs at
              # download time, far from the cause.
              ceiling="14.0"
              if [ "$(printf '%s\n%s\n' "$minos" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
                echo "FAIL: binary requires macOS $minos > supported floor $ceiling" >&2
                exit 1
              fi

              # nexus-cd8b7 (follow-up to nexus-280ei): the outer Mach-O
              # executable above isn't the whole ABI surface. onnxruntime
              # and djl-tokenizers each ship their own osx-aarch64 .dylib,
              # embedded as native-image RESOURCES (-H:IncludeResources in
              # native-libs-mac's buildArgs, service/pom.xml) and
              # System.load()'d/dlopen'd at runtime — never touched by
              # -H:NativeLinkerOption/-H:CCompilerOption, which govern only
              # the linker step that produces the OUTER binary checked
              # above. Measured 2026-09-29: djl-tokenizers 0.30.0's
              # libtokenizers.dylib already sits at minos 14.0 — zero
              # headroom — while onnxruntime 1.20.0's dylibs sit at 13.3. A
              # routine dependency bump could silently push either past the
              # ceiling while the outer-binary check above stays green.
              #
              # Source: the resolved Maven jars in the local repository, not any
              # native-image build-staging directory. GraalVM extracts
              # embedded resources internally at image-build time and
              # leaves no stable on-disk staging dir to re-read afterward;
              # the m2 jars are guaranteed present immediately after
              # `package` just resolved them (same maven session, same
              # runner — see the "Build native image" step above), and
              # their bytes are exactly what -H:IncludeResources pulled the
              # dylibs from, so re-reading the resolved dependency jar is
              # the more reliable source of the two, not a proxy for one.
              # Ask Maven, not the file system: the versions come from the
              # effective model (a property moved to a parent or BOM still
              # resolves; a commented-out line does not match), and the
              # local repository from settings, since a runner can relocate
              # it with MAVEN_OPTS=-Dmaven.repo.local=... (hellmini does; the
              # hardcoded ~/.m2 path failed engine-service-v0.1.141's
              # mac-arm64 leg there, nexus-zwn92). The plugin is pinned so a
              # publish path never floats with Central.
              mvn_eval() {
                (cd service && ./mvnw -q org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
                  -Dexpression="$1" -DforceStdout)
              }
              onnx_version=$(mvn_eval onnxruntime.version)
              djl_version=$(mvn_eval djl.tokenizers.version)
              m2_repo=$(mvn_eval settings.localRepository)
              case "$onnx_version$djl_version" in
                ''|*'null object'*|*[[:space:]]*)
                  echo "FAIL: could not resolve onnxruntime.version/djl.tokenizers.version from service/pom.xml (got '$onnx_version' / '$djl_version') — cannot locate the embedded dylibs to check" >&2
                  exit 1 ;;
              esac
              if [ -z "$m2_repo" ] || [ ! -d "$m2_repo" ]; then
                echo "FAIL: could not resolve Maven's local repository (got '$m2_repo')" >&2
                exit 1
              fi
              echo "ABI floor: local repository $m2_repo; onnxruntime $onnx_version, djl tokenizers $djl_version"
              onnx_jar="$m2_repo/com/microsoft/onnxruntime/onnxruntime/$onnx_version/onnxruntime-$onnx_version.jar"
              djl_jar="$m2_repo/ai/djl/huggingface/tokenizers/$djl_version/tokenizers-$djl_version.jar"
              for jar in "$onnx_jar" "$djl_jar"; do
                if [ ! -f "$jar" ]; then
                  echo "FAIL: resolved dependency jar missing at $jar — can't check its embedded dylibs" >&2
                  exit 1
                fi
              done
              dylib_dir="$RUNNER_TEMP/abi-floor-dylibs"
              rm -rf "$dylib_dir"
              mkdir -p "$dylib_dir/onnx" "$dylib_dir/djl"
              # -x excludes the .dSYM debug-symbol dirs onnxruntime bundles
              # alongside each dylib — same exclusion native-libs-mac's own
              # -H:ExcludeResources applies at embed time. djl-tokenizers
              # 0.30.0 ships none today (verified), but carrying the same
              # exclusion on both lines means a future djl release that
              # starts bundling .dSYM dirs doesn't silently start feeding
              # debug-symbol companions into the minos loop below.
              unzip -q -o "$onnx_jar" "ai/onnxruntime/native/osx-aarch64/*.dylib" -x "*.dSYM/*" -d "$dylib_dir/onnx"
              unzip -q -o "$djl_jar" "native/lib/osx-aarch64/*.dylib" -x "*.dSYM/*" -d "$dylib_dir/djl"
              dylib_count=0
              while IFS= read -r -d '' dylib; do
                dylib_count=$((dylib_count + 1))
                dylib_minos=$(otool -l "$dylib" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; f=0}')
                if [ -z "$dylib_minos" ]; then
                  echo "FAIL: could not read LC_BUILD_VERSION minos from $dylib — the ABI probe produced nothing" >&2
                  exit 1
                fi
                echo "embedded dylib $(basename "$dylib"): minos $dylib_minos"
                if [ "$(printf '%s\n%s\n' "$dylib_minos" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
                  echo "FAIL: embedded dylib $dylib requires macOS $dylib_minos > supported floor $ceiling" >&2
                  exit 1
                fi
              done < <(find "$dylib_dir" -name '*.dylib' -print0)
              # Vacuity guard (nexus-moht0 doctrine): a check that finds
              # nothing to examine is a FAILURE, not a silent pass — an
              # unzip pattern that stopped matching (a jar layout change, a
              # wrong version path) must not read as "all embedded dylibs
              # are within floor".
              if [ "$dylib_count" -eq 0 ]; then
                echo "FAIL: zero embedded dylibs found under $dylib_dir — vacuous ABI-floor assertion, refusing to treat that as a pass" >&2
                exit 1
              fi
              echo "checked $dylib_count embedded onnxruntime/djl-tokenizers dylib(s) against ceiling $ceiling"
              ;;
            *)
              echo "FAIL: unhandled arch '${{ matrix.target.arch }}' — no ABI floor check defined" >&2
              exit 1
              ;;
          esac

      - name: Install cosign (release tag only)
        # nexus-1odsm: keyless Sigstore signing. Only needed on the publish path.
        # SHA-pinned (not @v3.7.0): this is the tool that installs the release
        # signing primitive, so a floating tag is the supply-chain hole this whole
        # bead exists to close — same reasoning as the SHA-pinned graalvm action
        # above. SHA backs v3.7.0.
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign release asset (cosign keyless, release tag only)
        # nexus-1odsm: the native binary runs with DB credentials in the conexus
        # cloud and is opaque to static inspection, so a detached Sigstore
        # signature matters more than for a JAR. Keyless: the GitHub Actions OIDC
        # identity is bound into the Fulcio cert; the Rekor transparency log entry
        # is embedded in the bundle. Verify with the identity + issuer below
        # (see the release notes / conexus deploy ECR_PUSH.md).
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # Two bundle formats, same keyless signature:
          #  (1) .cosign.bundle      — old JSON format (cosign v2.4.1 default).
          #      Consumed by conexus deploy's `cosign verify-blob` before docker run.
          #  (2) .sigstore.json      — new protobuf bundle (--new-bundle-format).
          #      Consumed by the local `nx daemon service install-binary` path via
          #      sigstore-python (RDR-161 RF-161-1): offline-verifiable, no 130MB
          #      cosign binary on the pip user's machine. The old JSON format only
          #      carries an inclusion *promise* (SET), which sigstore-python cannot
          #      verify offline; the protobuf format carries the full inclusion
          #      proof. Both halves of RDR-161 P1 (this publisher + the consumer
          #      command) land together or local verification is non-functional.
          cosign sign-blob "dist/$ASSET" --bundle "dist/$ASSET.cosign.bundle"
          cosign sign-blob "dist/$ASSET" --new-bundle-format --bundle "dist/$ASSET.sigstore.json"
          # Self-verify BOTH before publishing so a malformed bundle fails the
          # build, not the consumer. Identity = this workflow at this tag ref.
          cosign verify-blob "dist/$ASSET" \
            --bundle "dist/$ASSET.cosign.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/engine-service-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify-blob "dist/$ASSET" \
            --new-bundle-format \
            --bundle "dist/$ASSET.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/engine-service-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "cosign signatures verified for $ASSET (.cosign.bundle + .sigstore.json)"

      - name: Upload Actions artifact (always — dev smoke / non-tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload native binary assets to Release (engine-service-v* tag only)
        # The release is created by the dedicated create-release job (this job
        # `needs` it — nexus-84ki0); here we only attach this arch's assets.
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # CAUTION (critique 96677bf7 observation): once APPLE_* signing is
          # provisioned, do NOT re-run an already-published tag's job to
          # "backfill" signing — --clobber would silently change the asset
          # bytes + sha256 under the same download URL. Cut a fresh tag.
          gh release upload "$tag" --clobber \
            "dist/$ASSET" "dist/$ASSET.sha256" \
            "dist/$ASSET.cosign.bundle" "dist/$ASSET.sigstore.json"

  # RDR-161 P2 (nexus-9yt2p): publish the relocatable PostgreSQL+pgvector bundle
  # as a release asset so `nx daemon service install-binary` / `nx init --service`
  # can acquire+verify it (RF-161-3). Until now scripts/build_pg_bundle.sh was
  # exercised only by ci.yml as a 7-day Actions artifact — nothing uploaded it to
  # a release. Lives in THIS workflow so the cosign cert identity is
  # `engine-service-release.yml@<tag>` — the SAME pin the consumer already
  # verifies for the native binary, so one identity-regexp covers both artifacts.
  #
  # mac-arm64 targets hellmini (nexus-yd9po), same fallback input as build-publish
  # above. HISTORY, FIXED: scripts/build_pg_bundle.sh's Darwin path used to run
  # an unconditional `brew install -q flex bison` on a cache miss, and
  # hellmini's Homebrew prefix (/opt/homebrew) is owned by an admin account, not
  # writable by the ghrunner service user, so the install failed (confirmed via
  # the hellmini-probe.yml dispatch). Fixed by 97d8ec39c: the Darwin branch now
  # installs flex+bison only when `brew list --formula` says they are missing
  # (ghrunner can read the admin-installed keg, so the check short-circuits past
  # the install it cannot perform) and always exports the keg-only PATH. The
  # host owner installed flex+bison once as an admin. A cache-miss seed run on
  # hellmini (pg-bundle-cache-seed run 36491497942, 2026-09-28) then compiled PG
  # + pgvector and passed. SKIP_PREREQS now gates only the Linux branch.
  build-publish-pg-bundle:
    name: Build + sign + publish PG bundle (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    # nexus-84ki0: needs the dedicated create-release job directly, NOT
    # build-publish. This artifact is fully independent of the native-binary
    # build (no jOOQ/Maven involved), so gating it behind the up-to-65-minute
    # native matrix bought nothing but latency — and, when build-publish was
    # SKIPPED outright (its own needs, jooq-codegen, failed/timed out), the
    # old `if: !cancelled()` bypassed that skip too and raced a fast
    # cache-hit build into a release that never got created ("release not
    # found", engine-service-v0.1.61, 2026-08-01). create-release is a
    # single fast job with no matrix, so plain `needs:` semantics are enough:
    # if it's skipped (workflow_dispatch, no tag) this job still runs (for
    # the Actions-artifact dev path); if it fails outright, this job's `if:`
    # below blocks rather than uploading into a void.
    needs: create-release
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - { arch: linux-amd64, runner: ubuntu-latest,    image: "quay.io/pypa/manylinux_2_28_x86_64" }
          # linux-arm64: built + published; full relocation proof is deferred to
          # nexus-xqk5r (the ci.yml relocation smoke runs on amd64). The bundle
          # itself builds identically via the aarch64 manylinux image.
          - { arch: linux-arm64, runner: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64" }
          # mac-arm64: hellmini by default (nexus-yd9po), workflow_dispatch
          # mac_runner falls back to macos-14 when hellmini is offline.
          - { arch: mac-arm64,   runner: "${{ inputs.mac_runner || 'hellmini' }}", image: "" }
    env:
      # Pinned identically to ci.yml's CA-3 job (single source of truth is the
      # build script; these select versions). PG17 aligns with the deployed stack.
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      ASSET: nexus-pg-${{ matrix.target.arch }}
      # nexus-280ei: pin explicitly rather than relying on build_pg_bundle.sh's
      # own 13.0 default (which honours an inherited env value — so an
      # unset-here env previously meant the FLOOR CAME FROM THE SCRIPT
      # default, not a value the workflow asserts). Same value as ci.yml's
      # CA-3 macOS job; build_pg_bundle.sh's Darwin branch is the only reader
      # (Linux legs never touch this var — harmless no-op there).
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      # nexus-m8au7: PG_VERSION + PGVECTOR_VERSION are pinned constants that
      # rarely change across tags, yet every tag recompiled both from source
      # (~10-20 min/arch). Cache the COMPILED PREFIX keyed on everything that
      # determines its content: versions, arch, builder image, and the build
      # script itself (the script does the macOS relocatability fixup — a
      # script change MUST invalidate the cache, or a stale bundle would ship
      # the exact 2026-07-01 dyld-abort class again). On a hit the compile is
      # skipped; packaging, the relocation gate, signing, and upload still run
      # per release, so the one-cosign-identity contract and per-release
      # acquisition URLs are unchanged, and the relocation gate stays the
      # safety net against a stale/poisoned cache entry.
      # restore-ONLY (review finding): tag-scoped cache saves can never be
      # restored (tags only read default-branch caches), so a save here is
      # pure quota waste against the repo's 10GB budget and can evict the
      # legit main-scoped entries. Only pg-bundle-cache-seed.yml saves.
      - name: Restore compiled PG bundle cache
        id: pg-bundle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: bundle
          # nexus-cd8b7: macfloor${{ env.MACOSX_DEPLOYMENT_TARGET }} folds the
          # MACOSX_DEPLOYMENT_TARGET pin above into the key — keep this line
          # BYTE-IDENTICAL to pg-bundle-cache-seed.yml's save key (see that
          # workflow's header), or a future divergence restores nothing here
          # (graceful cache miss, not silent corruption) rather than the
          # inverse (a stale-floor bundle restoring with no signal).
          key: pg-bundle-${{ matrix.target.arch }}-${{ matrix.target.runner }}-pg${{ env.PG_VERSION }}-pgvector${{ env.PGVECTOR_VERSION }}-img-${{ matrix.target.image || 'native' }}-macfloor${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/build_pg_bundle.sh') }}

      - name: Build PG + pgvector bundle (cache miss only)
        if: steps.pg-bundle-cache.outputs.cache-hit != 'true'
        env:
          MANYLINUX_IMAGE: ${{ matrix.target.image }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          mkdir -p "$bundle"
          if [ -n "$MANYLINUX_IMAGE" ]; then
            # linux: build inside manylinux_2_28 so the binaries' glibc floor is
            # 2.28 (broad compatibility), exactly as ci.yml's CA-3 gate builds them.
            docker run --rm \
              -e PG_VERSION -e PGVECTOR_VERSION -e BUNDLE_PREFIX="$bundle" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$MANYLINUX_IMAGE" /bin/bash -c '
                set -eux
                bash "'"$GITHUB_WORKSPACE"'/scripts/build_pg_bundle.sh"
              '
          else
            # mac-arm64: native build (the script brew-installs flex/bison and
            # applies MACOSX_DEPLOYMENT_TARGET). GH macOS runners have no Docker.
            BUNDLE_PREFIX="$bundle" bash scripts/build_pg_bundle.sh
          fi

      - name: Package .txz
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          mkdir -p dist
          # Cache-hit sanity: a restored prefix must actually contain the PG
          # toolchain; an empty/partial restore fails loud here rather than
          # shipping a hollow .txz (the relocation gate below would also catch
          # it, but this points at the cache instead of at relocation).
          if [ ! -x "$bundle/bin/initdb" ]; then
            echo "::error::bundle/bin/initdb missing — cache restored a hollow prefix or the build did not run"
            exit 1
          fi
          # nexus-u30zm (critique Critical): a cache hit skips the build
          # script's verify_and_mark(), which is the only place contrib
          # completeness was asserted — a partial restore that kept initdb
          # and vector but lost pg_trgm would otherwise sign + ship broken
          # (RDR-155 needs pg_trgm). Mirror verify_and_mark here.
          sharedir="$("$bundle/bin/pg_config" --sharedir)"
          for ctl in vector pg_trgm; do
            if [ ! -f "$sharedir/extension/$ctl.control" ]; then
              echo "::error::$ctl.control missing from bundle — contrib set incomplete (cache corruption or build regression)"
              exit 1
            fi
          done
          # -C parent + basename preserves the relative bin/ lib/ share/ layout
          # relocation depends on (identical to ci.yml packaging).
          tar -cJf "dist/$ASSET.txz" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          sz=$(wc -c < "dist/$ASSET.txz")
          echo "bundle .txz size: $sz bytes"
          # CA-2 ship-alongside size tripwire (mirrors ci.yml): the verdict rests
          # on a small (~5.7 MB) bundle; a configure-flag or contrib change that
          # doubled it would invalidate the rationale — fail loud, don't ship it.
          if [ "$sz" -gt $((10 * 1024 * 1024)) ]; then
            echo "::error::nexus-pg bundle .txz is $sz bytes (> 10 MiB) — CA-2 ship-alongside size assumption breached"
            exit 1
          fi
          ( cd dist && { sha256sum "$ASSET.txz" 2>/dev/null || shasum -a 256 "$ASSET.txz"; } > "$ASSET.txz.sha256" )

      - name: Verify the PUBLISHED artifact is genuinely relocatable (relocation gate)
        run: |
          set -euo pipefail
          # 2026-07-01 postmortem: every prior nexus-pg-mac-arm64 release shipped
          # a psql/createdb/pg_dump/initdb/... that dyld-aborted ("Library not
          # loaded") on any machine other than the exact CI build path — macOS
          # `configure`/`make install` bakes the literal absolute --prefix into
          # every libpq-linked binary's LC_LOAD_DYLIB. Linux has the SAME class
          # of defect — the literal build-prefix RUNPATH, dangling off-runner
          # (nexus-iytd3, verified on the live v0.1.32 artifact; the earlier
          # claim here that Linux gets $ORIGIN by default was wrong).
          # scripts/build_pg_bundle.sh now rewrites this at build time
          # (fixup_macos_relocatability), but NOTHING previously verified the
          # PUBLISHED ARTIFACT ITSELF before it shipped — ci.yml's relocation
          # smoke (tests/db/test_pg_bundle_relocation.py) is path-filtered, builds
          # its own fresh bundle, and has zero identity link to what this job
          # signs and uploads. This step closes that gap directly: extract the
          # EXACT .txz about to be signed to a directory with NO relationship to
          # the build prefix, and prove initdb -> start -> CREATE EXTENSION
          # vector actually works from there — on every target (Linux gets this
          # for free via PG's own relocatability; verify rather than assume).
          reloc="$RUNNER_TEMP/relocation-gate-$$"
          mkdir -p "$reloc"
          tar -xJf "dist/$ASSET.txz" -C "$reloc"
          root="$reloc/$(basename "$GITHUB_WORKSPACE/bundle")"
          # nexus-iytd3 gate hardening: this step used to run the binaries with
          # the runner's ambient env — a system libpq (present on ubuntu-latest)
          # satisfied the loader even when the bundle's own RUNPATH was a
          # dangling literal build path, which is exactly how the broken linux
          # bundles false-passed and shipped. Two closures: (a) deterministic —
          # on Linux, assert every critical binary's RUNPATH carries $ORIGIN;
          # (b) behavioural — run everything below with LD_LIBRARY_PATH unset.
          if [ "$(uname -s)" = "Linux" ]; then
            for b in psql initdb pg_ctl pg_config createdb postgres; do
              rp="$(readelf -d "$root/bin/$b" | grep -E 'RUNPATH|RPATH' || true)"
              case "$rp" in
                *'$ORIGIN'*) : ;;
                *) echo "::error::relocation gate: $b RUNPATH lacks \$ORIGIN (got: ${rp:-none}) — bundle is not self-contained (nexus-iytd3)"; exit 1 ;;
              esac
            done
            echo "RUNPATH \$ORIGIN assertion passed for all critical binaries"
          fi
          data="$reloc/pgdata"
          sock="$(mktemp -d /tmp/pgrelocgate.XXXXXX)"
          cleanup() { "$root/bin/pg_ctl" -D "$data" stop -m fast >/dev/null 2>&1 || true; rm -rf "$sock" "$reloc"; }
          trap cleanup EXIT
          env -u LD_LIBRARY_PATH "$root/bin/initdb" --no-locale -D "$data" -U "$(id -un)" >/dev/null
          env -u LD_LIBRARY_PATH "$root/bin/pg_ctl" -D "$data" -o "-p 59987 -k $sock" -l "$reloc/pg.log" start
          # Two SEPARATE psql calls, not one semicolon-joined -tAc: psql echoes
          # each statement's own output (a DDL's completion tag AND a SELECT's
          # row) concatenated into one combined -tAc stream, which is NOT the
          # bare "vector" this assertion originally (incorrectly) expected.
          env -u LD_LIBRARY_PATH "$root/bin/psql" -h "$sock" -p 59987 -U "$(id -un)" -d postgres -c \
            "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null
          # nexus-u30zm: pg_trgm must LOAD, not merely exist on disk — the
          # cache-hit path has no other executable proof of the contrib set.
          env -u LD_LIBRARY_PATH "$root/bin/psql" -h "$sock" -p 59987 -U "$(id -un)" -d postgres -c \
            "CREATE EXTENSION IF NOT EXISTS pg_trgm" >/dev/null
          out="$(env -u LD_LIBRARY_PATH "$root/bin/psql" -h "$sock" -p 59987 -U "$(id -un)" -d postgres -tAc \
            "SELECT extname FROM pg_extension WHERE extname='vector'")"
          if [ "$out" != "vector" ]; then
            echo "::error::relocation gate FAILED for $ASSET — SELECT extname did not return 'vector' (got: '$out')"
            cat "$reloc/pg.log" >&2 || true
            exit 1
          fi
          echo "relocation gate PASSED — $ASSET is genuinely relocatable (verified from $reloc, not the build prefix)"

      - name: Install cosign (release tag only)
        # SHA-pinned (not @v3.7.0): same supply-chain reasoning as the native-binary
        # job above — the signing primitive must not float.
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign PG bundle (cosign keyless, release tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # Protobuf bundle ONLY (.sigstore.json): the PG bundle is a NEW artifact
          # with no legacy .cosign.bundle consumer, so it ships the single format
          # the install seam's sigstore-python path verifies. Self-verify before
          # publishing so a malformed bundle fails the build, not the consumer.
          cosign sign-blob "dist/$ASSET.txz" --new-bundle-format --bundle "dist/$ASSET.txz.sigstore.json"
          cosign verify-blob "dist/$ASSET.txz" \
            --new-bundle-format \
            --bundle "dist/$ASSET.txz.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/engine-service-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "cosign signature verified for $ASSET.txz (.sigstore.json)"

      - name: Upload Actions artifact (always — dev smoke / non-tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish PG bundle to GitHub Release (engine-service-v* tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The release already exists (this job `needs` create-release). Attach
          # the PG-bundle assets; --clobber makes re-runs idempotent.
          gh release upload "$tag" --clobber \
            "dist/$ASSET.txz" "dist/$ASSET.txz.sha256" "dist/$ASSET.txz.sigstore.json"

  # nexus-f9bgu.14 (RDR-224 P2.2): the windows-x64 PG bundle. A job of its own,
  # not a matrix entry: the runner, the shell and every build step differ from
  # the other three, and a matrix entry cannot be skipped on its own.
  #
  # Host: `win-release`, the self-hosted runner on qwentescence's native Windows
  # side (P0.1, Sam 2026-10-05). Release legs only, never pull_request, inside the
  # release trust boundary, like hellmini; see AGENTS.md § Self-hosted runners and
  # fork PRs. A bare custom label (no 'self-hosted' in runs-on).
  #
  # SWITCH: the repo variable NX_WINDOWS_RELEASE_LEGS. Unset or anything but
  # 'on', this job is skipped and promote-release neither waits for it nor expects
  # its assets, so a tag run is exactly what it was before this job existed. With
  # no runner online a job queued here would wait with nothing to run it, which is
  # why the gate is a variable Sam flips once the runner is registered, not the
  # job's mere presence. When 'on', the assets BLOCK promotion (P0.4).
  #
  # ACTOR GUARD (nexus-f9bgu.27): `github.actor == 'Hellblazer'`, as in the rehearsal
  # and the seed leg. A tag push or a dispatch needs write access, so this is the
  # owner today; the guard makes that a property of the file and not of the collaborator
  # list. An actor who is not the owner skips the job, and with the switch on that
  # leaves the release a draft (the safe direction). It does not make the job's CODE
  # safe: the scripts it runs execute on the release runner after merge with no click,
  # which is why AGENTS.md reviews a change to them as release-runner code.
  #
  # NEVER RUN BY THE REHEARSAL: this file is not in the rehearsal's path filter (a
  # push trigger on a release workflow would run release jobs). Its Windows jobs are
  # proven only by a workflow_dispatch run of THIS workflow, on develop, with the
  # switch on, before the first Windows-carrying cut (a non-tag ref runs everything
  # except sign, upload and promote). The engine-release skill's pre-cut steps and the
  # checklist bead record that run.
  #
  # The build is scripts/build_pg_bundle_windows.py (nexus-f9bgu.12): MSVC +
  # meson, stdlib Python. Cache key = the script's own `cache-key` output (version
  # pins + the script's sha256), the same exact-input shape as the other legs;
  # pg-bundle-cache-seed.yml's seed-windows job computes it the same way, so a
  # tag restores what main seeded. Restore-only here, for the reason given on the
  # other legs. The four VC++ runtime DLLs are NOT a key input (P0.6 condition 8:
  # refreshed from the current redist every release), so a restored prefix goes
  # through refresh-runtime before it is packaged.
  #
  # Gate: the relocation smoke runs against the exact .txz about to be signed,
  # with the build tree deleted first (the smoke refuses a reachable build prefix).
  # Runner prerequisites: Python 3.12+ (or uv), Visual Studio 2022 Build Tools,
  # win_flex_bison, meson, ninja, Strawberry Perl, git, gh, PowerShell 7 (pwsh)
  # and the Windows tar on PATH for the service account.
  build-publish-pg-bundle-windows:
    name: Build + sign + publish PG bundle (windows-x64)
    runs-on: win-release
    needs: create-release
    if: ${{ !cancelled() && github.actor == 'Hellblazer' && needs.create-release.result != 'failure' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      # Pinned identically to the other PG-bundle jobs (tests/test_pg_bundle_version_parity.py).
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      # Runner label segment of the cache key; must equal pg-bundle-cache-seed.yml's seed-windows.
      PG_BUNDLE_RUNNER: win-release
      ASSET: nexus-pg-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Resolve Python
        uses: ./.github/actions/resolve-windows-python

      - name: Compute the cache key
        id: key
        run: |
          $key = (& $env:PYTHON scripts\build_pg_bundle_windows.py cache-key)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "key=$("$key".Trim())" >> $env:GITHUB_OUTPUT

      # actions/cache packs and unpacks with Git's tar -z, which runs gzip from
      # Git's usr\bin; the runner service's PATH has only Git\cmd (seed run
      # 37421965631: "gzip: command not found", nothing saved, so every release
      # leg rebuilt PG from source). APPENDED, never prepended (GITHUB_PATH would):
      # usr\bin also holds an msys perl.exe, link.exe and find.exe that would
      # shadow Strawberry Perl, MSVC's linker and Windows' find in the build.
      - name: Append Git's usr\bin to PATH (gzip for actions/cache)
        shell: pwsh
        run: |
          $d = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $d 'gzip.exe'))) { throw "no gzip.exe in $d" }
          "PATH=$env:PATH;$d" >> $env:GITHUB_ENV

      - name: Restore compiled PG bundle cache
        id: pg-bundle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: bundle
          key: ${{ steps.key.outputs.key }}

      - name: Build PG + pgvector bundle (cache miss only)
        if: steps.pg-bundle-cache.outputs.cache-hit != 'true'
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py build --prefix "$env:GITHUB_WORKSPACE\bundle"

      - name: Refresh the VC++ runtime from the current redist (cache hit only)
        if: steps.pg-bundle-cache.outputs.cache-hit == 'true'
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py refresh-runtime --prefix "$env:GITHUB_WORKSPACE\bundle"

      - name: Verify the bundle layout
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py verify --prefix "$env:GITHUB_WORKSPACE\bundle"

      - name: Package .txz
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py package --prefix "$env:GITHUB_WORKSPACE\bundle" --out-dir dist

      - name: Verify the PUBLISHED artifact is genuinely relocatable (relocation gate)
        run: |
          # The smoke refuses to run while the recorded build prefix still exists,
          # and after a cache hit that prefix is this workspace's bundle. Nothing
          # below needs the build tree (this job restores the cache, never saves it).
          Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\bundle"
          & $env:PYTHON scripts\pg_bundle_windows_smoke.py --archive "dist\$env:ASSET.txz"

      # sigstore/cosign-installer runs a `shell: bash` step. On win-release `bash`
      # resolved to System32\bash.exe, the WSL launcher, and the runner account has
      # no WSL distro, so the first tag run failed here (engine-service-v0.1.148, run
      # 37425299859). Git's bin holds only bash.exe, git.exe and sh.exe, so putting
      # it first shadows nothing else. The install runs on every run, not only tags,
      # so a workflow_dispatch proves it before a tag; signing stays tag-only.
      - name: Put Git's bin first on PATH (bash for cosign-installer)
        run: |
          $d = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $d 'bash.exe'))) { throw "no bash.exe in $d" }
          $d >> $env:GITHUB_PATH

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: cosign runs, and bash is Git's
        run: |
          $bash = (Get-Command bash).Source
          if ($bash -notlike 'C:\Program Files\Git\bin\*') { throw "bash resolves to $bash, not Git's" }
          cosign version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign PG bundle (cosign keyless, release tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          COSIGN_YES: "true"
        run: |
          # Same protobuf-bundle-only contract as the other PG bundles, and the
          # same certificate identity (this workflow at this ref).
          cosign sign-blob "dist\$env:ASSET.txz" --new-bundle-format --bundle "dist\$env:ASSET.txz.sigstore.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob "dist\$env:ASSET.txz" `
            --new-bundle-format `
            --bundle "dist\$env:ASSET.txz.sigstore.json" `
            --certificate-identity "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/engine-service-release.yml@$env:GITHUB_REF" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "cosign signature verified for $env:ASSET.txz (.sigstore.json)"

      - name: Upload Actions artifact (always; dev smoke / non-tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish PG bundle to GitHub Release (engine-service-v* tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release already exists (this job `needs` create-release); --clobber
          # makes re-runs idempotent.
          gh release upload "$env:GITHUB_REF_NAME" --clobber `
            "dist\$env:ASSET.txz" "dist\$env:ASSET.txz.sha256" "dist\$env:ASSET.txz.sigstore.json"
      - name: Stop stray engine and Postgres processes (always)
        if: always()
        uses: ./.github/actions/windows-job-cleanup

  # nexus-f9bgu.9 (RDR-224 P1.2): the windows-x64 engine. A job of its own for the
  # reasons in the header; same runner, same switch and the same trust boundary as
  # build-publish-pg-bundle-windows above (read that job's comment for all three).
  #
  # It needs that job: the smoke boots the engine against the Windows PG bundle this
  # same run just built, taken from its Actions artifact (the exact .txz that ships,
  # not a rebuild). One runner runs one job at a time, so the two legs queue anyway.
  # It also needs jooq-codegen: a Windows runner has no Docker for testcontainers, so
  # the sources come from the linux job's artifact and the build uses -Pprebuilt-jooq,
  # exactly as the three other legs (the generated sources are plain Java, the same
  # on every OS). The steps live in .github/actions/windows-engine-leg, which the
  # rehearsal also runs, so the tag is never the first run of a change to them.
  #
  # Order inside: build, embedded-resources check, dependency check (dumpbin on the
  # exe and every embedded native library), package, smoke; only then sign and
  # publish (tag runs). With the switch on, a failure here keeps the release a draft.
  build-publish-engine-windows:
    name: Build + smoke + sign + publish engine (windows-x64)
    runs-on: win-release
    needs: [jooq-codegen, create-release, build-publish-pg-bundle-windows]
    if: ${{ !cancelled() && github.actor == 'Hellblazer' && needs.jooq-codegen.result == 'success' && needs.create-release.result != 'failure' && needs.build-publish-pg-bundle-windows.result == 'success' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      ASSET: nexus-service-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Download the Windows PG bundle built earlier in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: nexus-pg-windows-x64
          path: pg-bundle

      - name: Resolve engine-service version
        id: ver
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The published version is the tag minus the prefix; a dispatch run has none
          # (release_version stays blank and clients fail closed on it, by design).
          $version = ''
          if ($env:REF.StartsWith('refs/tags/engine-service-v')) {
            $version = $env:REF_NAME.Substring('engine-service-v'.Length)
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build, check, package and smoke the engine
        uses: ./.github/actions/windows-engine-leg
        with:
          version: ${{ steps.ver.outputs.version }}
          pg-archive: pg-bundle/nexus-pg-windows-x64.txz
          out-dir: dist

      # sigstore/cosign-installer runs a `shell: bash` step. On win-release `bash`
      # resolved to System32\bash.exe, the WSL launcher, and the runner account has
      # no WSL distro, so the first tag run failed here (engine-service-v0.1.148, run
      # 37425299859). Git's bin holds only bash.exe, git.exe and sh.exe, so putting
      # it first shadows nothing else. The install runs on every run, not only tags,
      # so a workflow_dispatch proves it before a tag; signing stays tag-only.
      - name: Put Git's bin first on PATH (bash for cosign-installer)
        run: |
          $d = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $d 'bash.exe'))) { throw "no bash.exe in $d" }
          $d >> $env:GITHUB_PATH

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: cosign runs, and bash is Git's
        run: |
          $bash = (Get-Command bash).Source
          if ($bash -notlike 'C:\Program Files\Git\bin\*') { throw "bash resolves to $bash, not Git's" }
          cosign version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign release asset (cosign keyless, release tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          COSIGN_YES: "true"
        run: |
          # New protobuf bundle ONLY (.sigstore.json): the client verifies that format offline
          # (nexus-f9bgu.15) and nothing else consumes the Windows asset, so no .cosign.bundle.
          # The signature is over the .txz, the one file the client downloads. Self-verify
          # before publishing, with this workflow at this ref as the certificate identity.
          cosign sign-blob "dist\$env:ASSET.txz" --new-bundle-format --bundle "dist\$env:ASSET.txz.sigstore.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cosign verify-blob "dist\$env:ASSET.txz" `
            --new-bundle-format `
            --bundle "dist\$env:ASSET.txz.sigstore.json" `
            --certificate-identity "https://github.com/$env:GITHUB_REPOSITORY/.github/workflows/engine-service-release.yml@$env:GITHUB_REF" `
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "cosign signature verified for $env:ASSET.txz (.sigstore.json)"

      - name: Upload Actions artifact (always; dev smoke / non-tag path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload the engine archive to Release (engine-service-v* tag only)
        if: startsWith(github.ref, 'refs/tags/engine-service-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release exists (this job needs create-release); --clobber makes re-runs idempotent.
          gh release upload "$env:GITHUB_REF_NAME" --clobber `
            "dist\$env:ASSET.txz" "dist\$env:ASSET.txz.sha256" "dist\$env:ASSET.txz.sigstore.json"
      - name: Stop stray engine and Postgres processes (always)
        if: always()
        uses: ./.github/actions/windows-job-cleanup

  # nexus-cl14i: the all-or-nothing gate. engine-service-v0.1.95 (run
  # 33697831082) published a non-draft release carrying 9 PG-bundle assets
  # and ZERO engine binaries after a transient upstream fetch failure skipped
  # the whole native matrix; the tag existed, looked shipped, and was not
  # installable. create-release now creates a DRAFT and this job is the only
  # thing that publishes it: it needs BOTH matrices, requires both to have
  # SUCCEEDED (fail-fast: false means a single leg's failure still fails the
  # matrix result), asserts the complete asset set by name, and only then
  # flips the draft flag. Any upstream failure leaves the draft in place: a
  # rerun of the failed jobs re-uploads (--clobber) and this job promotes.
  promote-release:
    name: Promote GitHub Release (all assets present, engine-service-v* tag only)
    runs-on: ubuntu-latest
    # nexus-f9bgu.14: the Windows leg is required to have SUCCEEDED only while the
    # NX_WINDOWS_RELEASE_LEGS variable is 'on' (P0.4: Windows assets block promotion).
    # Both Windows jobs (the PG bundle and the engine, nexus-f9bgu.9) are held to that.
    # Off, those jobs are skipped by design and their absence must not hold the release:
    # a job whose `needs` include a SKIPPED job is itself skipped unless its `if`
    # has a status function, so `!cancelled()` replaces the implied success() and
    # the explicit result checks below carry the all-succeeded requirement.
    needs: [create-release, build-publish, build-publish-pg-bundle, build-publish-pg-bundle-windows, build-publish-engine-windows]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/engine-service-v') && needs.create-release.result == 'success' && needs.build-publish.result == 'success' && needs.build-publish-pg-bundle.result == 'success' && (vars.NX_WINDOWS_RELEASE_LEGS != 'on' || (needs.build-publish-pg-bundle-windows.result == 'success' && needs.build-publish-engine-windows.result == 'success')) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # The promote script runs the size ceilings from check_engine_cut_riders.py
          # (stdlib python), the one place they are defined (nexus-ujbz8).
          sparse-checkout: |
            scripts/promote_engine_release.sh
            scripts/check_engine_cut_riders.py
          sparse-checkout-cone-mode: false
      - name: Assert the complete asset set, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Normalised here (GitHub compares strings case-insensitively) so the
          # script sees exactly "on" or "off" and reads no GitHub state itself.
          WINDOWS_LEGS: ${{ vars.NX_WINDOWS_RELEASE_LEGS == 'on' && 'on' || 'off' }}
        run: |
          set -euo pipefail
          scripts/promote_engine_release.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${WINDOWS_LEGS}"
