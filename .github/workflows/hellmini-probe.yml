# nexus-yd9po: one-shot verification probe for the "hellmini" self-hosted
# GitHub Actions runner (Mac mini M5 Pro, macOS arm64) before wiring it into
# the release workflows below. Confirms the runner actually picks up a job
# under its bare custom label (registered with --no-default-labels, so it
# carries NO 'self-hosted'/'macOS'/'ARM64' default labels — only 'hellmini'),
# and that the expected toolchain (GraalVM, uv, Docker via colima) is present
# and working.
#
# Deliberately scoped to workflow_dispatch + push on a throwaway
# 'runner-probe/**' branch, never pull_request or push to develop/main — this
# runner is release-jobs-only (Sam's directive) and this probe itself must
# not become a routine PR/push trigger.
name: hellmini-probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'runner-probe/**'

concurrency:
  group: hellmini-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe hellmini runner
    runs-on: hellmini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Report runner identity + toolchain versions
        # Deliberately NOT `set -e`: this step is a diagnostic survey, so one
        # missing tool must not hide the report for every tool after it.
        run: |
          set -uo pipefail
          echo "=== sw_vers ==="
          sw_vers || echo "MISSING: sw_vers"
          echo "=== JAVA_HOME / GRAALVM_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "GRAALVM_HOME=${GRAALVM_HOME:-<unset>}"
          echo "=== java -version ==="
          java -version || echo "MISSING: java"
          echo "=== native-image --version ==="
          native-image --version || {
            echo "MISSING: native-image on PATH"
            echo "-- checking \$JAVA_HOME/bin/native-image and \$GRAALVM_HOME/bin/native-image --"
            [ -n "${JAVA_HOME:-}" ] && ls -la "${JAVA_HOME}/bin/native-image" 2>&1
            [ -n "${GRAALVM_HOME:-}" ] && ls -la "${GRAALVM_HOME}/bin/native-image" 2>&1
            echo "-- which java --"
            command -v java
            echo "-- java binary's real path (resolves symlinks) --"
            java -XshowSettings:properties -version 2>&1 | grep -i "java.home" || true
          }
          echo "=== uv --version ==="
          uv --version || echo "MISSING: uv"
          echo "=== docker version ==="
          docker version || echo "MISSING: docker / colima not running"
          echo "=== git --version / gh --version / jq --version ==="
          git --version || echo "MISSING: git"
          gh --version || echo "MISSING: gh"
          jq --version || echo "MISSING: jq"

      - name: Docker smoke (hello-world via colima)
        run: docker run --rm hello-world

      - name: Disk space
        run: |
          df -h /
          df -h /Volumes/Bulk || echo "NOTE: /Volumes/Bulk not present on this runner"
