# nexus-yd9po: one-shot verification probe for the "hellmini" self-hosted
# GitHub Actions runner (Mac mini M5 Pro, macOS arm64) before wiring it into
# the release workflows below. Confirms the runner actually picks up a job
# under its bare custom label (registered with --no-default-labels, so it
# carries NO 'self-hosted'/'macOS'/'ARM64' default labels — only 'hellmini'),
# and that the expected toolchain (GraalVM, uv, Docker via colima) is present
# and working.
#
# Deliberately scoped to workflow_dispatch, never pull_request or push — this
# runner takes release jobs (Sam's directive). Since 2026-09-30 the Service CI
# Java job (service-ci.yml; nexus-f5i1m) runs on a separate runner, label
# `hellmini-ci` under its own macOS user, not on this one; its isolation from
# this runner is checked by hellmini-ci-isolation-probe.yml. No workflow here
# routes a pull_request job to either (a routing rule, not a security
# boundary; see service-ci.yml), and this probe itself must not become a
# routine PR/push trigger.
name: hellmini-probe

# workflow_dispatch only (2026-10-02 audit): the one-shot yd9po check is done, and a
# runner-probe/** push trigger fired a 20-minute job on the RELEASE runner each time.
on:
  workflow_dispatch: {}

concurrency:
  group: hellmini-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe hellmini runner
    # Owner-only guard (Sam, 2026-09-28). This repo is PUBLIC. A workflow on a
    # branch a collaborator can push may target a self-hosted runner, and a fork
    # PR's workflow can too: what keeps an outside contributor off it is the
    # repo's fork-PR approval policy, not this file. This `if:` only declines to
    # run the probe for anyone but the repo owner. It is not a security
    # boundary: a write collaborator could still target hellmini from their own
    # workflow change. As of 2026-09-30 the repo has no write collaborators.
    if: github.actor == 'Hellblazer'
    runs-on: hellmini
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Report runner identity + toolchain versions
        # Deliberately NOT `set -e`: this step is a diagnostic survey, so one
        # missing tool must not hide the report for every tool after it.
        run: |
          set -uo pipefail
          echo "=== sw_vers ==="
          sw_vers || echo "MISSING: sw_vers"
          echo "=== JAVA_HOME / GRAALVM_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          echo "GRAALVM_HOME=${GRAALVM_HOME:-<unset>}"
          echo "=== java -version ==="
          java -version || echo "MISSING: java"
          echo "=== native-image --version ==="
          native-image --version || {
            echo "MISSING: native-image on PATH"
            echo "-- checking \$JAVA_HOME/bin/native-image and \$GRAALVM_HOME/bin/native-image --"
            [ -n "${JAVA_HOME:-}" ] && ls -la "${JAVA_HOME}/bin/native-image" 2>&1
            [ -n "${GRAALVM_HOME:-}" ] && ls -la "${GRAALVM_HOME}/bin/native-image" 2>&1
            echo "-- which java --"
            command -v java
            echo "-- java binary's real path (resolves symlinks) --"
            java -XshowSettings:properties -version 2>&1 | grep -i "java.home" || true
          }
          echo "=== uv --version ==="
          uv --version || echo "MISSING: uv"
          echo "=== docker version ==="
          docker version || echo "MISSING: docker / colima not running"
          echo "=== git --version / gh --version / jq --version ==="
          git --version || echo "MISSING: git"
          gh --version || echo "MISSING: gh"
          jq --version || echo "MISSING: jq"
          echo "=== brew (needed by scripts/build_pg_bundle.sh: brew install flex bison) ==="
          brew --version || echo "MISSING: brew"
          echo "-- brew prefix / ownership --"
          brew --prefix 2>&1 || true
          ls -ld "$(brew --prefix 2>/dev/null)" 2>&1 || true
          echo "-- flex/bison already present? --"
          brew list flex bison 2>&1 || echo "flex/bison not yet installed (brew install would run at build time)"
          echo "-- attempting 'brew install -q flex bison' as the ghrunner user (what build_pg_bundle.sh runs) --"
          brew install -q flex bison && echo "brew install flex bison: OK" || echo "brew install flex bison: FAILED (rc=$?)"
          echo "=== RUNNER_TOOL_CACHE (setup-graalvm/setup-uv persistence across jobs) ==="
          echo "RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-<unset>}"
          [ -n "${RUNNER_TOOL_CACHE:-}" ] && ls -ld "$RUNNER_TOOL_CACHE" 2>&1

      - name: Docker smoke (hello-world via colima)
        run: docker run --rm hello-world

      - name: Disk space
        run: |
          df -h /
          df -h /Volumes/Bulk || echo "NOTE: /Volumes/Bulk not present on this runner"
