name: Local-service functional gate (nightly)

# nexus-edwlp follow-on (2026-07-07): the hermetic local-service functional
# gate (tests/e2e/local-service-gate.sh) on a nightly cadence. The gate
# self-provisions a throwaway PG + Java service and drives the whole
# `-m "integration and not lived_in"` family (~450 tests) with a vacuity
# guard, so a silent coverage collapse (the 74-vs-442 class) or a real
# integration regression surfaces within a day instead of at release time.
#
# CI-cost discipline: NIGHTLY only (never per-push — the family takes
# ~15 min end to end and its inputs change many times a day), ubuntu only,
# every deterministic artifact cached (PG bundle, ONNX models, Maven repo,
# uv wheels). One run per day + manual dispatch.
#
# SECRETS REQUIRED (repo settings): VOYAGE_API_KEY. The gate is
# infra-hermetic but NOT credential-independent: the voyage/CCE subset
# hard-fails (by design, fail-loud) without a real VOYAGE_API_KEY.
#
# RDR-155 P4b P3: the CHROMA_API_KEY / CHROMA_TENANT / CHROMA_DATABASE trio was
# REMOVED here. It was described as driving "cloud-mode detection plus one
# idempotent ensure-databases probe against the real ChromaCloud tenant" — but
# tests/e2e/local-service-gate.sh contains ZERO chroma references, so the probe
# had already gone and three live credentials were being injected into a nightly
# run that could not consume them. The repo secrets themselves can be deleted;
# nothing reads them.
#
# Guard bounds: the script's built-in FLOOR/BUDGET were pinned on macOS
# (446 passed / 31 skipped). This runner differs (CA-3 bundle present
# unlocks ~24 more tests; linux/macOS platform-conditional tests flip),
# so the env overrides below pin CI's own bounds, from the first green
# baseline (nexus-f4wcg, run 28875352534: 459 passed / 19 skipped).

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (~2:17am PT), off the release-hour paths
  workflow_dispatch:

permissions:
  contents: read
  # nexus-f6qzj: the three CI-evidence `mandatory_regression_pin` tests
  # (tests/scripts/test_check_release_ci_evidence.py) read check-runs and
  # PR association through `gh api` with the job token — read scopes only.
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: local-service-gate-nightly
  cancel-in-progress: true

jobs:
  gate:
    name: local-service gate (hermetic, throwaway PG + service)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pinned for determinism — MUST match ci.yml's CA-3 job so the cache
      # key resolves the bundle pg-bundle-cache-seed.yml seeds on main.
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      MANYLINUX_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # Scheduled workflows execute from the DEFAULT branch (main), but the
          # tree worth gating nightly is develop — the integration branch where
          # regressions land daily (main only moves at releases, where the
          # release checklist runs this gate by hand anyway). So schedule
          # falls back to develop.
          #
          # A DISPATCH gets the branch you picked. It did not until
          # 2026-08-23 (nexus-pc15o): this line read a bare `ref: develop`,
          # which overrides checkout's triggering-ref default
          # UNCONDITIONALLY. The comment here used to say "dispatch from a
          # feature ref if you need a different tree" — advice this very
          # line made impossible. Run 32659044975 dispatched a pc15o fix
          # against its own branch, gated develop instead, reported
          # "573 passed, 51 skipped" byte-identical to the pre-fix run, and
          # was read as the fix having failed. Pinned by
          # tests/test_workflow_dispatch_ref_lint.py.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'develop' }}
          # nexus-f6qzj: the gate's `mandatory_regression_pin` tests need the
          # REAL tag history (v7.6.1 / engine-service-v0.1.71 for the
          # release-floor source-ancestry pin) — a shallow clone makes them
          # skip, and tests/conftest.py's non-vacuity guard (budget 0) then
          # correctly reds the whole run. Full depth + tags, same as ci.yml.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Cache ChromaDB ONNX model
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/chroma
          key: chromadb-onnx-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            chromadb-onnx-${{ runner.os }}-

      - name: Set up JDK 25 (dev-jar build)
        # The gate rebuilds the dev jar; the runner's default JDK 17 cannot run
        # the jOOQ codegen (class-file 65 = Java 21+). Same toolchain as ci.yml's
        # write-seam job / service-ci.
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f  # v1
        with:
          java-version: "25.0.3"
          distribution: "graalvm"

      - name: Cache Maven local repo (dev-jar build)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('service/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Install ripgrep
        # test_doctor_runs_and_reports asserts rg presence.
        run: sudo apt-get install -y ripgrep

      - name: Install project + dev deps
        run: uv sync --group dev

      - name: Restore compiled PG bundle cache
        # Same key as ci.yml's CA-3 job / pg-bundle-cache-seed.yml (main-seeded
        # caches are restorable from every branch). The bundle provides
        # PG17 + pgvector for the throwaway cluster AND unlocks the CA-3
        # bundle test family inside the gate run.
        id: pg-bundle-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: bundle
          key: pg-bundle-linux-amd64-ubuntu-latest-pg${{ env.PG_VERSION }}-pgvector${{ env.PGVECTOR_VERSION }}-img-${{ env.MANYLINUX_IMAGE }}-${{ hashFiles('scripts/build_pg_bundle.sh') }}

      - name: Build PG + pgvector bundle from source (cache miss only)
        if: steps.pg-bundle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          mkdir -p "$bundle"
          docker run --rm \
            -e PG_VERSION -e PGVECTOR_VERSION -e BUNDLE_PREFIX="$bundle" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            "$MANYLINUX_IMAGE" /bin/bash -c '
              set -eux
              bash "'"$GITHUB_WORKSPACE"'/scripts/build_pg_bundle.sh"
            '

      - name: Point provisioning + CA-3 tests at the bundle
        run: |
          set -euo pipefail
          if [ ! -x "$GITHUB_WORKSPACE/bundle/bin/initdb" ]; then
            echo "::error::bundle/bin/initdb missing after cache-restore/build"
            exit 1
          fi
          # NEXUS_PG_BIN: `nx init --service` provisions the throwaway cluster
          # from the bundle (pgvector included — the runner's system PG lacks it).
          echo "NEXUS_PG_BIN=$GITHUB_WORKSPACE/bundle/bin" >> "$GITHUB_ENV"
          # The bundle's binaries carry no RPATH (nexus-iytd3); linux honors
          # LD_LIBRARY_PATH, so point it at the bundle's libs.
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/bundle/lib" >> "$GITHUB_ENV"
          # NEXUS_CA3_BUNDLE: unlocks the CA-3 bundle test family in the run.
          echo "NEXUS_CA3_BUNDLE=$GITHUB_WORKSPACE/bundle" >> "$GITHUB_ENV"

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        # The dev jar boots its local ONNX embedder (RDR-160 bge-768) at
        # startup; without the model the service never binds its port.
        uses: ./.github/actions/prime-bge-onnx

      - name: Run the local-service functional gate
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # Pinned from the first green linux baseline (nexus-f4wcg, run
          # 28875352534: 459 passed / 19 skipped). Same allowance style as
          # the script's macOS pins: floor slightly under observed for
          # platform variation, budget slightly over. New legitimately-
          # conditional tests must bump these consciously, in the same
          # change that adds them.
          #
          # 455 -> 452 (nexus-w6h2m, 2026-07-28): the cloud_mode carve-out
          # DESELECTS 3 tests that were passing when this floor was pinned —
          # back when the gate ran in cloud mode and the service embedded
          # voyage. They cannot pass against a bge-768 local service, which is
          # what a local service IS (RDR-160). Deselected tests land in
          # pytest's `deselected` bucket, not `passed`, so the reachable
          # maximum drops by exactly 3 and leaving the floor at 455 would have
          # left 1 test of slack — the guard would trip on the first
          # legitimately-conditional skip and read as a regression. Lowered by
          # exactly the carve-out size, no more: the same rule that says
          # additions bump it consciously says removals do too.
          NX_GATE_FLOOR: "452"
          NX_GATE_BUDGET: "25"
          # nexus-f6qzj (Sam, 2026-08-20: "grant it the read token"): the
          # gate's `-m integration` run collects the `mandatory_regression_pin`
          # tests, which authenticate via GITHUB_TOKEN / `gh auth token`
          # (tests/scripts/test_check_release_ci_evidence.py::_live_github_token).
          # Without a token all four skipped and the session-level
          # non-vacuity guard reddened every nightly since the pins landed.
          # Job token, read-only permissions above. MEASURED by dispatch
          # (run 32401440865, 2026-08-20): 3/4 pins now run; the ONE residual
          # is test_required_check_contexts_matches_live_branch_protection,
          # which skips with `gh: Resource not accessible by integration
          # (HTTP 403)` — reading branch protection needs push/admin access a
          # job token cannot carry. Budget sized to EXACTLY that pin; any
          # second skip still reds the run. Lifting it needs a PAT secret
          # (Sam-provisioned), not a permissions line.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NX_MANDATORY_PIN_SKIP_BUDGET: "1"
        run: |
          set -euo pipefail
          if [ -z "$VOYAGE_API_KEY" ]; then
            echo "::error::VOYAGE_API_KEY secret is not configured — the gate would fail on every voyage/CCE test. Add the four .env secrets to the repo."
            exit 1
          fi
          tests/e2e/local-service-gate.sh

      - name: Ungated integration files (nexus-5opzu)
        # The tests/db files with NO other automated gate anywhere —
        # one of which (test_i711w_gap_xfails.py) holds the SOLE repo-wide
        # pins on five service-catalog contracts, whose strict xfails went
        # stale unseen for a session (6 XPASS(strict), 2026-07-31). They
        # cannot join CI's seam job (it provisions Docker PG; these want
        # local binaries via pg_bin_dir()), but THIS job already exports
        # NEXUS_PG_BIN at the bundle and the gate above just built the dev
        # jar — so they run here, sequentially (one pytest at a time).
        # Hal call 2026-08-02 on nexus-5opzu: option (a), scheduled gate;
        # per-contract hermetic splits stay opportunistic.
        #
        # tests/integration/test_tp8yk_manifest_never_outruns_chunks.py
        # (nexus-irszw, 2026-08-04): the SOLE production-layer, real-engine
        # proof of nexus-tp8yk's D1 fix (manifest rows structurally
        # unreachable for an unconfirmed chunk batch), including its
        # mandatory kill control. Not a tests/db file, but the identical
        # shape — @pytest.mark.integration, self-provisioning against the
        # shared engine substrate, zero other CI wiring — so it joins the
        # same allowlist rather than inventing a second gate.
        run: |
          set -euo pipefail
          uv run pytest \
            tests/db/test_i711w_gap_xfails.py \
            tests/db/test_http_catalog_integration.py \
            tests/db/test_indexer_seam_b_integration.py \
            tests/db/test_frecency_enehl_integration.py \
            tests/db/test_5xn3k_runfence_gate.py \
            tests/integration/test_tp8yk_manifest_never_outruns_chunks.py \
            -o addopts="" -m integration -q -rs --junit-xml=ungated-5opzu.xml

      - name: Non-vacuity — every ungated file actually ran (nexus-5opzu)
        # A gate that skip-passes when its dependency is absent must carry a
        # non-vacuity assert (AGENTS.md § Critical conventions). Each of the four files
        # must contribute >= 1 non-skipped testcase; a jar/PG-prereq skip
        # sweep reads as a broken gate, not a pass.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          FILES = {
              "test_i711w_gap_xfails",
              "test_http_catalog_integration",
              "test_indexer_seam_b_integration",
              "test_frecency_enehl_integration",
              # nexus-5xn3k.7: the RUNFENCE phase-exit falsification gate —
              # same never-otherwise-selected file shape (its own review's
              # Critical #1, 2026-08-02). Reachability caveat nexus-5a8ic
              # applies to this whole leg until a release promotes it.
              "test_5xn3k_runfence_gate",
              # nexus-irszw (2026-08-04): nexus-tp8yk's sole production-layer
              # real-engine D1 proof, incl. its mandatory kill control — same
              # never-otherwise-selected shape as the RUNFENCE gate above.
              "test_tp8yk_manifest_never_outruns_chunks",
          }
          root = ET.parse("ungated-5opzu.xml").getroot()
          ran: dict[str, int] = {f: 0 for f in FILES}
          for case in root.iter("testcase"):
              for f in FILES:
                  if f in (case.get("classname") or ""):
                      if case.find("skipped") is None:
                          ran[f] += 1
          bad = [f for f, n in ran.items() if n == 0]
          print("non-skipped testcases per file:", ran)
          if bad:
              print(f"VACUOUS: {bad} contributed zero non-skipped tests — prereq skip sweep, gate is broken", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Slow-marked tests (nexus-s6dei)
        # `-m slow` was selected by ZERO commands repo-wide before this leg —
        # a slow-marked test was operationally deleted (no output, no skip
        # line, nothing to notice its absence), while three docstrings
        # falsely claimed CI or the release shakedown already ran it. This
        # leg is the fix: it reuses the dev jar + PG bundle + bge-768 ONNX
        # this job already built/primed above, so it costs nothing beyond
        # the few extra minutes the tests take (CI-cost discipline: no new
        # runner, piggyback the existing nightly schedule).
        #
        # test_mineru_path_preserves_formulas is DESELECTED here — DECIDED
        # state, not pending (nexus-jy4hd, 2026-08-18): MinerU's first
        # invocation downloads ~2-3GB of model weights with no HF cache in
        # this job, and MinerU-end-to-end coverage is owned by the release
        # shakedown's step 3b, which now indexes with an EXPLICIT
        # --extractor mineru, doctor-precheck parsed, and a post-hoc
        # extraction_method identity assert — a route-away or substitution
        # reddens every release. Do not fold the pytest twin in here
        # without also adding the HF cache step ci.yml already carries.
        #
        # FIRST-NIGHTLY-RUN VERIFICATION (manual, once, after this merges): confirm this step exits 0; the non-vacuity step below prints exactly 7 (floor=7); slow-s6dei.xml contains no test_mineru_path_preserves_formulas testcase; and -rs prints no unexpected skip lines beyond legitimately-conditional ones.
        run: |
          set -euo pipefail
          uv run pytest \
            -o addopts="" -m slow -q -rs \
            --deselect tests/test_pdf_subsystem.py::TestFormulaPreservationOnRealPdf::test_mineru_path_preserves_formulas \
            --junit-xml=slow-s6dei.xml

      - name: Non-vacuity — slow tests actually ran (nexus-s6dei)
        # Same shape as the nexus-5opzu guard above: a gate that skip-passes
        # on a missing prerequisite reads as a broken gate, not a pass.
        # Floor pinned to the currently slow-marked, non-MinerU tests; bump
        # consciously (same change that adds the new slow test) if it ever
        # needs to move. 6 -> 7 for nexus-utpuw.3's flip-window measurement
        # (tests/scripts/test_flip_current.py), which is slow-marked because it
        # cannot calibrate on every machine and starves neighbouring shards.
        # RG-A caught that the floor was NOT bumped in the commit that added
        # it, which would have left this guard silent about that test's
        # deletion -- the exact thing it exists to notice.
        run: |
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          FLOOR = 7
          root = ET.parse("slow-s6dei.xml").getroot()
          ran = 0
          for case in root.iter("testcase"):
              if case.find("skipped") is None:
                  ran += 1
          print(f"non-skipped slow testcases: {ran} (floor={FLOOR})")
          if ran < FLOOR:
              print(f"VACUOUS: only {ran} non-skipped slow testcases ran, floor is {FLOOR} — prereq skip sweep, gate is broken", file=sys.stderr)
              sys.exit(1)
          PY
