# nexus-m8au7: seed + keep-warm the compiled PG-bundle cache on MAIN.
#
# WHY THIS WORKFLOW EXISTS — GitHub Actions cache isolation: a run triggered
# by a tag can only RESTORE caches created on the same ref or on the DEFAULT
# branch (main). Caches saved by one engine-service tag run are invisible to
# the next tag, so engine-service-release.yml's cache step can only ever hit
# entries seeded here. Eviction is 7-days-unused; engine tags are often
# further apart, hence the weekly cron keep-warm.
#
# The cache key MUST stay byte-identical to the one in
# engine-service-release.yml (build-publish-pg-bundle job):
#   pg-bundle-<arch>-<runner>-pg<PG_VERSION>-pgvector<PGVECTOR_VERSION>-img-<image|native>-macfloor<MACOSX_DEPLOYMENT_TARGET>-<sha256 of scripts/build_pg_bundle.sh>
# PG_VERSION / PGVECTOR_VERSION are duplicated across ci.yml, the release
# workflow, and here (the pre-existing duplication pattern; the build script
# holds the defaults). Bumping a version in the release workflow WITHOUT
# bumping it here just means a cache miss at the next tag (graceful — it
# compiles as before); the versions live in the key precisely so a stale
# bundle of the WRONG version can never be restored silently. Same reasoning
# for MACOSX_DEPLOYMENT_TARGET (nexus-cd8b7): the PG bundle's own floor is
# pinned 13.0 here. The 13.0-vs-14.0 split (PG bundle vs engine binary) and
# why 14.0 is the floor that actually binds a mac-arm64 local install is
# recorded ONCE, canonically, in service/pom.xml's native-libs-mac profile
# comment — read it there rather than here. The <runner>
# segment is the resolved runner LABEL (e.g. "hellmini", "macos-14"). This
# file seeds BOTH mac-arm64 labels on push/schedule (nexus-n7q28: keeps the
# macos-14 fallback's cache warm too, not just whichever label the release
# workflow currently defaults to) and only the chosen one on
# workflow_dispatch — see the `plan` job below, which computes the seed
# matrix per trigger. scripts/build_pg_bundle.sh's Darwin `brew install flex
# bison` step is blocked by a Homebrew-permissions gap on hellmini as of
# nexus-yd9po (see the release workflow's build-publish-pg-bundle header for
# detail); Sam has accepted hellmini into the release trust boundary
# (2026-09-28, see AGENTS.md).
name: pg-bundle-cache-seed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pg_bundle.sh'
      - '.github/workflows/pg-bundle-cache-seed.yml'
  schedule:
    # Weekly keep-warm (Mondays 07:23 UTC — off the hour to dodge cron rush).
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      mac_runner:
        description: >-
          Runner label for the mac-arm64 leg. Default is the hellmini
          self-hosted Mac mini (nexus-yd9po); fall back to macos-14 when
          hellmini is offline.
        required: false
        default: hellmini
        type: choice
        options:
          - hellmini
          - macos-14

permissions:
  contents: read

concurrency:
  # Keyed on the mac runner too: a dispatch for hellmini and one for macos-14
  # seed different cache keys, so one must not cancel the other (it did on
  # 2026-09-28, run 36490979010). push/schedule seed both and share one group.
  group: pg-bundle-cache-seed-${{ github.ref }}-${{ inputs.mac_runner || 'all' }}
  cancel-in-progress: true

jobs:
  # actionlint (correctly) refuses a job-level `if:` referencing `matrix` --
  # per-run context availability doesn't include it there (only github,
  # inputs, needs, vars) -- so "seed both mac labels on push/schedule, only
  # the chosen one on workflow_dispatch" can't be a per-entry skip. Instead
  # this job COMPUTES which entries exist in the first place; the seed job's
  # matrix is exactly the array this job emits, so there is nothing to skip.
  plan:
    name: Determine PG-bundle seed matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.compute.outputs.targets }}
    steps:
      - name: Compute target matrix
        id: compute
        env:
          MAC_RUNNER_INPUT: ${{ inputs.mac_runner }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          linux='{"arch":"linux-amd64","runner":"ubuntu-latest","image":"quay.io/pypa/manylinux_2_28_x86_64"},{"arch":"linux-arm64","runner":"ubuntu-24.04-arm","image":"quay.io/pypa/manylinux_2_28_aarch64"}'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Dispatch names exactly one mac runner -- seed only that key.
            runner="${MAC_RUNNER_INPUT:-hellmini}"
            mac="{\"arch\":\"mac-arm64\",\"runner\":\"$runner\",\"image\":\"\"}"
          else
            # push / schedule (no inputs): seed BOTH mac cache keys
            # (nexus-n7q28) so the macos-14 fallback stays warm alongside
            # hellmini, not just whichever label happens to be the default.
            mac='{"arch":"mac-arm64","runner":"hellmini","image":""},{"arch":"mac-arm64","runner":"macos-14","image":""}'
          fi
          targets="[$linux,$mac]"
          echo "$targets" | jq -e . >/dev/null  # fail loud on malformed JSON
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  seed:
    name: Seed PG bundle cache (${{ matrix.target.arch }} @ ${{ matrix.target.runner }})
    needs: plan
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Computed by the plan job above -- keep the runner LABELS it emits
        # IDENTICAL to engine-service-release.yml's build-publish-pg-bundle
        # mac-arm64 entries; the cache key embeds matrix.target.runner
        # verbatim (see header), so a mismatch means the release workflow's
        # restore never hits what this seeds.
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      # Pinned identically to engine-service-release.yml + ci.yml (see header).
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      # nexus-cd8b7 (follow-up to nexus-280ei): pin explicitly rather than
      # relying on build_pg_bundle.sh's own 13.0 default. Before this, the
      # release job's build-publish-pg-bundle job asserted 13.0 via this same
      # var while THIS job — the one that actually compiles the bundle in the
      # common cache-HIT path — left the floor to the script default, the
      # exact "floor came from the script, not an asserted workflow value"
      # anti-pattern nexus-280ei's PG-bundle-job fix was meant to close.
      # Linux legs never read this var (harmless no-op there). Must match
      # engine-service-release.yml's build-publish-pg-bundle job value.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Restore/claim cache slot
        id: pg-bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: bundle
          # nexus-cd8b7: macfloor${{ env.MACOSX_DEPLOYMENT_TARGET }} folds the
          # deployment-target pin above into the key, so a future divergence
          # between this workflow's and the release workflow's floor value
          # produces a cache MISS (compiles fresh, correct) instead of
          # silently serving a stale-floor bundle with no error and no
          # signal. Keep this key line BYTE-IDENTICAL to the release
          # workflow's build-publish-pg-bundle restore key (see header) —
          # enforced by tests/test_pg_bundle_version_parity.py.
          key: pg-bundle-${{ matrix.target.arch }}-${{ matrix.target.runner }}-pg${{ env.PG_VERSION }}-pgvector${{ env.PGVECTOR_VERSION }}-img-${{ matrix.target.image || 'native' }}-macfloor${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/build_pg_bundle.sh') }}

      - name: Compile PG + pgvector (cache miss only)
        if: steps.pg-bundle-cache.outputs.cache-hit != 'true'
        env:
          MANYLINUX_IMAGE: ${{ matrix.target.image }}
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/bundle"
          mkdir -p "$bundle"
          if [ -n "$MANYLINUX_IMAGE" ]; then
            # Identical build environment to engine-service-release.yml:
            # manylinux_2_28 for the glibc-2.28 floor.
            docker run --rm \
              -e PG_VERSION -e PGVECTOR_VERSION -e BUNDLE_PREFIX="$bundle" \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$MANYLINUX_IMAGE" /bin/bash -c '
                set -eux
                bash "'"$GITHUB_WORKSPACE"'/scripts/build_pg_bundle.sh"
              '
          else
            BUNDLE_PREFIX="$bundle" bash scripts/build_pg_bundle.sh
          fi

      - name: Sanity-check the prefix before it becomes the cached artifact
        if: steps.pg-bundle-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ ! -x "bundle/bin/initdb" ] || [ ! -x "bundle/bin/pg_ctl" ]; then
            echo "::error::compiled prefix is missing the PG toolchain — refusing to seed a hollow cache"
            exit 1
          fi
          # nexus-u30zm: contrib completeness (mirrors verify_and_mark). The
          # actions/cache post-save runs with post-if: success() (verified
          # upstream), so an exit 1 here genuinely prevents the seed.
          sharedir="$(bundle/bin/pg_config --sharedir)"
          for ctl in vector pg_trgm; do
            if [ ! -f "$sharedir/extension/$ctl.control" ]; then
              echo "::error::$ctl.control missing — refusing to seed an incomplete contrib set"
              exit 1
            fi
          done
          echo "prefix ok — cache will be saved on job success"
