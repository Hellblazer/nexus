# Isolation probe for the `qwen-linux` self-hosted runner. Written in the style of
# hellmini-ci-isolation-probe.yml, but INFORMATIONAL: it reports what the runner
# user can reach, and fails only on things that must never be true.
#
# WHY. ci.yml's `test-qwen` job runs the whole pytest suite on `qwen-linux` for
# owner pushes to develop, once the repository variable QWEN_CI_PUSH_RUNNER is set
# to `qwen-linux` (the route is OPT-IN; Sam, 2026-10-01). The runner is the Linux
# user `ghci` in a WSL distro that ALSO hosts a live nexus install (user `nexus`,
# with nexus-service) and the suite user `nxtest`, on a Windows 11 host whose
# drives WSL can mount. `ghci` is in the `docker` group, and membership of that
# group on a rootful daemon is root on the distro: `docker run -v /:/h` reads and
# writes every file in it, and can rewrite /etc/wsl.conf for the next WSL restart.
# THIS PROBE DOES NOT BOUND DOCKER. It checks the unprivileged route (file modes,
# sudo, WSL interop, the /mnt drives) at one point in time; the per-run Windows-side
# preflight in ci.yml's `test-qwen` re-checks the Windows side on every run and is
# what catches a wsl.conf rewrite after the fact. AGENTS.md says "intended, not
# proven" until a run of this workflow is green.
#
# WHAT IT DOES, each as its own step so one result does not hide the rest:
#   REPORTS (never fail):
#     - whether the runner user is in the docker group (the user name and the
#       group list are not printed);
#     - whether /home/nexus and /home/nxtest are listable by file mode;
#     - whether the docker daemon is reachable by the runner user. The probe runs
#       NO container: an image is third-party code on a self-hosted runner, and
#       the docker route is a known gap (root-equivalent), not something to
#       measure by running more code. (An earlier draft pulled an unpinned alpine
#       image; the step was dropped rather than pinned by digest.)
#   FAILS ONLY ON what must never be true:
#     - the job does not run as exactly `ghci` (the runner user the docs name; as
#       `nexus` or root the checks below would prove nothing about it, and as
#       any other account they would prove it about the wrong one);
#     - `sudo -n true` succeeds (passwordless sudo);
#     - ANY file under /home/nexus/.config/nexus is readable by ghci by file mode
#       (the live install's credentials live in config.yml and sibling files; a
#       count is printed, never a name; config.yml is also tested by name, since
#       `find -readable` is blind in a directory this user may search but not
#       list). An unreachable or absent directory is reported as NOT CHECKED,
#       which is also what a closed /home/nexus looks like from here, so it cannot
#       fail. NOT CHECKED means the credential check was never performed: it is
#       emitted as a `::warning::` annotation on the run summary, and a green run
#       carrying it is NOT a pass;
#     - this is not a WSL kernel, or binfmt_misc is not mounted (a positive
#       control: the Windows-side checks are true on any non-WSL machine, so a
#       pass there proves nothing);
#     - WSL interop works: /mnt/<drive>/Windows/System32/cmd.exe runs (a
#       harmless `cmd.exe /c exit 0` with a timeout) or the WSLInterop binfmt
#       handler is enabled. Measured on qwentescence: the host admin, as ghci,
#       ran cmd.exe as a Windows admin;
#     - any /mnt/<single letter> directory (the C: drive is /mnt/c) is mounted and
#       listable (the same measurement: the Windows user's SSH private key was readable);
#     - a /mnt/<drive> directory is on the job's PATH (appendWindowsPath).
#     The fix is host-side, in /etc/wsl.conf: [interop] enabled=false,
#     appendWindowsPath=false and [automount] enabled=false. Each failure names it.
#   The probe never opens a file's content. The log of this public repo carries
#   pass or fail and counts only: no modes, owners, user names or group lists, and
#   no name found under a /mnt drive, on the PATH or under the config directory.
#
# TRIGGERS, both owner only, never pull_request:
#   - workflow_dispatch. GitHub offers a dispatch only for a workflow file on the
#     DEFAULT branch (main), which this file is not until a release promotes
#     it, so a dispatch cannot run the probe from develop-era code;
#   - push to a branch named runner-probe/qwen-*. This is how to run it BEFORE the
#     file reaches main: push a throwaway branch (`git push origin
#     HEAD:refs/heads/runner-probe/qwen-<date>`), read the run, then delete the
#     branch (`git push origin :refs/heads/runner-probe/qwen-<date>`). ci.yml
#     triggers only on push to develop and on pull_request, and hellmini-probe.yml
#     (`runner-probe/**`) excludes `runner-probe/qwen-*`, so a probe branch fires
#     this probe and nothing else (round-4 review L2: it used to fire a 20-minute
#     hellmini-probe job on the release runner too; pinned by a test).
#     hellmini-ci-isolation-probe.yml's two recorded runs were pushes of exactly
#     this shape.
# The job runs on a self-hosted runner in a public repo. The `if:` compares account
# ids (a renamed login can be re-registered) and is a routing rule, not a security
# boundary: this file lives where a write collaborator's branch could replace it,
# and the push trigger means a pushed branch carries its OWN copy of the file. The
# repo has had no write collaborators since 2026-09-30. The probe runs no checkout
# and no third-party action or image, reads no secrets, prints no environment and
# no file contents.
name: qwen-linux-isolation-probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'runner-probe/qwen-*'

concurrency:
  group: qwen-linux-isolation-probe
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    name: Isolation report (qwen-linux)
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, qwen-linux]
    timeout-minutes: 10
    steps:
      - name: Identity (fails unless the job runs as exactly the runner user ghci)
        shell: bash
        run: |
          set -uo pipefail
          expected=ghci
          user="$(id -un)"
          rc=0
          # Exactly the runner user, not merely "not nexus or root": the docs say
          # the job runs as ghci, so any other account (nxtest included) means the
          # checks below describe the wrong user. The name is never printed.
          if [ "$user" != "$expected" ]; then
            echo "::error::the job does not run as the runner user the docs name (ghci): the checks below would describe a different account"
            rc=1
          fi
          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo "docker group: member (root-equivalent on this distro; see the docker step)"
          else
            echo "docker group: not a member"
          fi
          [ "$rc" -eq 0 ] && echo "the job runs as the runner user (expected)"
          exit "$rc"

      - name: Passwordless sudo is refused
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v sudo >/dev/null 2>&1; then
            echo "no sudo on PATH (report: nothing to test, nothing to abuse)"
            exit 0
          fi
          # A refused sudo is the EXPECTED result and the runner shell is bash -e,
          # so capture the status instead of letting -e end the step.
          status=0
          sudo -n true >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::sudo -n true succeeded: the runner user has passwordless sudo"
            exit 1
          fi
          echo "sudo -n true failed with exit $status (expected)"

      - name: Other users' homes by file mode (report; fails on ANY readable file under the nexus config directory)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for home in /home/nexus /home/nxtest; do
            status=0
            ls -A "$home" >/dev/null 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "REPORT: $home is listable by the runner user (file mode)"
            else
              echo "REPORT: $home is not listable by the runner user"
            fi
          done
          cfg=/home/nexus/.config/nexus
          echo "--- $cfg"
          if [ ! -d "$cfg" ]; then
            # From here an absent directory and a /home/nexus closed to this user
            # look the same (the closed home is the EXPECTED good state), so this
            # cannot fail. It must not read as a pass either: the credential check
            # was never performed, so the run says so as a WARNING annotation, which
            # GitHub shows on the run summary, not only as a line in the log (round-4
            # review M2). A green run with this warning is NOT isolation evidence.
            if [ -e "$(dirname "$(dirname "$cfg")")" ]; then
              echo "REPORT: NOT CHECKED: $cfg is absent or unreachable by the runner user (expected when /home/nexus is closed to it; a moved install looks the same)"
              echo "::warning::NOT CHECKED: the credential check was not performed ($cfg is absent or unreachable by the runner user). A green probe with this warning is not a pass."
            else
              echo "REPORT: NOT CHECKED: there is no /home/nexus on this host, so there is no live install's directory to read"
              echo "::warning::NOT CHECKED: the credential check was not performed (there is no /home/nexus on this host). A green probe with this warning is not a pass."
            fi
            exit 0
          fi
          # ANY readable file is a failure, not a filename heuristic: the install's
          # credentials sit in config.yml (a `credentials:` block), which no name
          # pattern would catch. A count only, never names or contents.
          # `find -readable` needs read permission on the DIRECTORY, so a config
          # directory that is searchable but not listable (mode 0711) with a
          # world-readable config.yml in it counts 0 there while `cat` succeeds by
          # name. That one file is therefore tested by name as well (round-4 review L1).
          readable="$(find "$cfg" -type f -readable 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$readable" -eq 0 ] && [ -r "$cfg/config.yml" ]; then
            readable=1
          fi
          if [ "$readable" -gt 0 ]; then
            echo "::error::$readable file(s) under $cfg are readable by the runner user (names withheld): the live install's credentials are reachable by file mode"
            rc=1
          else
            echo "$cfg is reachable but holds no file readable by the runner user (expected)"
          fi
          exit "$rc"

      - name: Docker reachability (report only; docker is root-equivalent and is NOT bounded here)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # No container is started: see the header. Whether the runner user can
          # reach the daemon is all this reports; if it can, every file of the
          # distro, /etc/wsl.conf and the other users' homes included, is
          # reachable to a job through it, whatever the modes and the other checks
          # in this workflow say.
          if ! command -v docker >/dev/null 2>&1; then
            echo "REPORT: no docker on PATH"
            exit 0
          fi
          status=0
          docker info >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "REPORT: the docker daemon is not reachable by the runner user (exit $status): no container-root route from this user"
          else
            echo "REPORT: the docker daemon is reachable by the runner user: docker = root on this distro. File modes do not separate this user from the live install, and /etc/wsl.conf can be rewritten for the next WSL restart. The per-run Windows-side preflight in ci.yml is the control that notices; nothing here bounds it."
          fi

      - name: Windows side (fails off WSL, if interop runs, a /mnt drive is readable, or PATH has a /mnt entry)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # The two roots are plain assignments so the tests can point them at a
          # fake tree; nothing in the environment can move them.
          mnt_root=/mnt
          binfmt_dir=/proc/sys/fs/binfmt_misc
          proc_version=/proc/version
          fix="set /etc/wsl.conf to [interop] enabled=false, appendWindowsPath=false and [automount] enabled=false, then run wsl --shutdown from Windows"
          rc=0
          # POSITIVE CONTROL: "no handler", "no drive" and "no cmd.exe" are all
          # true on a machine that is not WSL, or where binfmt_misc is unmounted
          # and no handler can be seen. A pass there would prove nothing.
          if ! grep -qi microsoft "$proc_version" 2>/dev/null; then
            echo "::error::this is not a WSL kernel: the Windows-side checks cannot be established here, so the probe fails closed"
            exit 1
          fi
          if [ ! -e "$binfmt_dir/status" ]; then
            echo "::error::binfmt_misc is not mounted: a WSLInterop handler would not be visible, so the interop check cannot be established and the probe fails closed"
            exit 1
          fi
          echo "positive control: WSL kernel and binfmt_misc present"
          # Every check captures its status: a refused command is the EXPECTED
          # result and the runner shell is bash -e.

          echo "--- interop: can a process here start a Windows program?"
          if command -v timeout >/dev/null 2>&1; then run_prefix="timeout 10"; else run_prefix=""; fi
          tried=0
          for cmd in "$mnt_root"/[a-zA-Z]/Windows/System32/cmd.exe; do
            [ -e "$cmd" ] || continue
            tried=$((tried + 1))
            status=0
            # cmd.exe /c exit 0 changes nothing. Exit 126 or 127 is the shell
            # saying the file could not be executed: interop is off. Anything
            # else, 0 or a timeout included, means Windows code started.
            $run_prefix "$cmd" /c exit 0 >/dev/null 2>&1 || status=$?
            case "$status" in
              126|127)
                echo "REPORT: a Windows cmd.exe exists but could not be executed (exit $status): interop is off for it"
                ;;
              *)
                echo "::error::a Windows cmd.exe ran (exit $status): WSL interop lets the runner user start Windows programs as the Windows user. Fix on the host: $fix"
                rc=1
                ;;
            esac
          done
          if [ "$tried" -eq 0 ]; then
            echo "REPORT: no cmd.exe under $mnt_root/<drive>/Windows/System32 to try"
          fi
          for entry in WSLInterop WSLInterop-late; do
            f="$binfmt_dir/$entry"
            [ -e "$f" ] || continue
            first=""
            read -r first < "$f" 2>/dev/null || true
            if [ "$first" = "enabled" ]; then
              echo "::error::the $entry binfmt handler is enabled: any Windows .exe runs from this user. Fix on the host: $fix"
              rc=1
            else
              echo "REPORT: the $entry binfmt handler is registered but not enabled ($first)"
            fi
          done
          if [ ! -e "$binfmt_dir/WSLInterop" ] && [ ! -e "$binfmt_dir/WSLInterop-late" ]; then
            echo "REPORT: no WSLInterop binfmt handler is registered"
          fi

          echo "--- /mnt/<drive>: is a Windows drive mounted and listable?"
          seen=0
          for d in "$mnt_root"/[a-zA-Z]; do
            [ -d "$d" ] || continue
            seen=$((seen + 1))
            # Names are never printed: a drive root can hold a user-profile
            # directory name, and a count is all the verdict needs.
            status=0
            out="$(ls -A "$d" 2>/dev/null)" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "REPORT: a /mnt drive directory is not listable by the runner user (exit $status)"
            elif [ -z "$out" ]; then
              echo "REPORT: a /mnt drive directory exists and is empty (not a mounted drive)"
            else
              echo "::error::a /mnt drive is mounted and listable by the runner user ($(printf '%s\n' "$out" | wc -l | tr -d ' ') entries): the Windows drive is reachable. Fix on the host: $fix"
              rc=1
            fi
          done
          if [ "$seen" -eq 0 ]; then
            echo "REPORT: no $mnt_root/<drive> directory exists"
          fi

          echo "--- PATH: is a Windows directory on this job's PATH?"
          count=0
          old_ifs="$IFS"
          IFS=:
          for entry in $PATH; do
            case "$entry" in
              /mnt/[a-zA-Z]|/mnt/[a-zA-Z]/*) count=$((count + 1)) ;;
            esac
          done
          IFS="$old_ifs"
          if [ "$count" -gt 0 ]; then
            # The entries are not printed: they can name a Windows user profile.
            echo "::error::$count PATH entries point under /mnt/<drive> (appendWindowsPath is on). Fix on the host: $fix"
            rc=1
          else
            echo "no PATH entry points under /mnt/<drive> (expected)"
          fi
          exit "$rc"
