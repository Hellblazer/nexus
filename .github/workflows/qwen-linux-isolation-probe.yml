# Isolation probe for the `qwen-linux` self-hosted runner. Written in the style of
# hellmini-ci-isolation-probe.yml, but INFORMATIONAL: it reports what the runner
# user can reach, and fails only on things that must never be true.
#
# WHY. ci.yml's `test-qwen` job runs the whole pytest suite on `qwen-linux` for
# owner pushes to develop. The runner is the Linux user `ghci` in a WSL distro
# that ALSO hosts a live nexus install (user `nexus`, with nexus-service) and the
# suite user `nxtest`, on a Windows 11 host whose drives WSL can mount. `ghci` is
# in the `docker` group, and membership of that group on a rootful daemon is root
# on the distro: `docker run -v /:/h` reads and writes every file in it. So the
# honest state is "isolated from the other users by file modes, NOT from root via
# docker", and no workflow file can assert even the first half by reading itself.
# AGENTS.md says "intended, not proven" until a run of this workflow is green.
#
# WHAT IT DOES, each as its own step so one result does not hide the rest:
#   REPORTS (never fail):
#     - whether the runner user is in the docker group (the user name and the group list are not printed);
#     - whether /home/nexus and /home/nxtest are readable by file mode;
#     - whether a container run through the docker group can read /home/nexus
#       (EXPECTED to succeed today: this documents that docker is root, it is
#       a known gap, not a defect of the probe);
#   FAILS ONLY ON what must never be true:
#     - the job runs as `nexus` or root (the probe, and the job it stands for,
#       would then not be running as the unprivileged runner user);
#     - `sudo -n true` succeeds (passwordless sudo);
#     - a credential-shaped file under /home/nexus/.config/nexus is readable by
#       ghci by file mode (the live install's credentials);
#     - WSL interop works: /mnt/<drive>/Windows/System32/cmd.exe runs (a
#       harmless `cmd.exe /c exit 0` with a timeout) or the WSLInterop binfmt
#       handler is enabled. Measured on qwentescence: the host admin, as ghci,
#       ran cmd.exe as a Windows admin;
#     - any /mnt/<single letter> directory (the C: drive is /mnt/c) is mounted and
#       listable (the same measurement: the Windows user's SSH private key was readable);
#     - a /mnt/<drive> directory is on the job's PATH (appendWindowsPath).
#     The fix is host-side, in /etc/wsl.conf: [interop] enabled=false,
#     appendWindowsPath=false and [automount] enabled=false. Each failure names it.
#   Reading a credential through the docker route is the known gap above and is
#   not tested here: the probe never opens a credential file's content. The log of
#   this public repo carries pass or fail and counts only: no modes, owners, user
#   names or group lists, and no name found under a /mnt drive, on the PATH or as a
#   credential-shaped file.
#
# TRIGGER. workflow_dispatch only, owner only, never pull_request or push: the
# job runs on a self-hosted runner in a public repo. The `if:` compares account
# ids (a renamed login can be re-registered) and is a routing rule, not a
# security boundary: this file lives where a write collaborator's branch could
# replace it. The repo has had no write collaborators since 2026-09-30. The probe
# runs no checkout and no third-party action, reads no secrets, prints no
# environment and no file contents.
name: qwen-linux-isolation-probe

on:
  workflow_dispatch: {}

concurrency:
  group: qwen-linux-isolation-probe
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    name: Isolation report (qwen-linux)
    if: github.event_name == 'workflow_dispatch' && github.actor_id == github.repository_owner_id && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, qwen-linux]
    timeout-minutes: 10
    steps:
      - name: Identity (report; fails if the job runs as nexus or root)
        shell: bash
        run: |
          set -uo pipefail
          user="$(id -un)"
          rc=0
          case "$user" in
            nexus|root)
              echo "::error::the job runs as the live install's user or as root: the checks below prove nothing about the runner user"
              rc=1
              ;;
          esac
          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo "docker group: member (root-equivalent on this distro; see the docker step)"
          else
            echo "docker group: not a member"
          fi
          [ "$rc" -eq 0 ] && echo "the job runs as an unprivileged user that is not the live install's user (expected)"
          exit "$rc"

      - name: Passwordless sudo is refused
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v sudo >/dev/null 2>&1; then
            echo "no sudo on PATH (report: nothing to test, nothing to abuse)"
            exit 0
          fi
          # A refused sudo is the EXPECTED result and the runner shell is bash -e,
          # so capture the status instead of letting -e end the step.
          status=0
          sudo -n true >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::sudo -n true succeeded: the runner user has passwordless sudo"
            exit 1
          fi
          echo "sudo -n true failed with exit $status (expected)"

      - name: Other users' homes by file mode (report; fails on a readable nexus credential file)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for home in /home/nexus /home/nxtest; do
            status=0
            ls -A "$home" >/dev/null 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "REPORT: $home is listable by the runner user (file mode)"
            else
              echo "REPORT: $home is not listable by the runner user"
            fi
          done
          cfg=/home/nexus/.config/nexus
          echo "--- $cfg"
          if [ ! -d "$cfg" ]; then
            echo "REPORT: $cfg is absent or not reachable by the runner user; nothing to check by file mode"
            exit 0
          fi
          # A count only, never names or contents. A credential-shaped file is one
          # whose name says so; a plain listing of an unreadable directory finds none.
          readable="$(find "$cfg" -maxdepth 3 -type f -readable \( -iname '*cred*' -o -iname '*token*' -o -iname '*secret*' -o -iname '*key*' -o -iname '*auth*' -o -iname '.env' -o -iname '*.pem' \) 2>/dev/null || true)"
          if [ -n "$readable" ]; then
            echo "::error::$(printf '%s\n' "$readable" | wc -l | tr -d ' ') credential-shaped file(s) under $cfg are readable by the runner user (names withheld)"
            rc=1
          else
            echo "no credential-shaped file under $cfg is readable by the runner user (expected)"
          fi
          exit "$rc"

      - name: Docker is root (report only; EXPECTED to read /home/nexus today)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "REPORT: no docker on PATH"
            exit 0
          fi
          status=0
          docker info >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "REPORT: the docker daemon is not reachable by the runner user (exit $status): no container-root route from this user"
            exit 0
          fi
          # Read-only bind of the distro root, a count of entries only. This
          # documents that the docker group is root-equivalent; it is the known
          # gap in AGENTS.md, so it is reported and never fails the probe.
          status=0
          out="$(docker run --rm -v /:/h:ro alpine ls -A /h/home/nexus 2>&1)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "REPORT: a container started by the runner user listed /home/nexus ($(printf '%s\n' "$out" | wc -l | tr -d ' ') entries). docker = root on this distro: file modes do not separate the runner user from the live install."
          else
            echo "REPORT: the container could not list /home/nexus (exit $status)"
          fi

      - name: Windows side (fails if interop runs, a /mnt drive is readable, or PATH has a /mnt entry)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # The two roots are plain assignments so the tests can point them at a
          # fake tree; nothing in the environment can move them.
          mnt_root=/mnt
          binfmt_dir=/proc/sys/fs/binfmt_misc
          fix="set /etc/wsl.conf to [interop] enabled=false, appendWindowsPath=false and [automount] enabled=false, then run wsl --shutdown from Windows"
          rc=0
          # Every check captures its status: a refused command is the EXPECTED
          # result and the runner shell is bash -e.

          echo "--- interop: can a process here start a Windows program?"
          if command -v timeout >/dev/null 2>&1; then run_prefix="timeout 10"; else run_prefix=""; fi
          tried=0
          for cmd in "$mnt_root"/[a-zA-Z]/Windows/System32/cmd.exe; do
            [ -e "$cmd" ] || continue
            tried=$((tried + 1))
            status=0
            # cmd.exe /c exit 0 changes nothing. Exit 126 or 127 is the shell
            # saying the file could not be executed: interop is off. Anything
            # else, 0 or a timeout included, means Windows code started.
            $run_prefix "$cmd" /c exit 0 >/dev/null 2>&1 || status=$?
            case "$status" in
              126|127)
                echo "REPORT: a Windows cmd.exe exists but could not be executed (exit $status): interop is off for it"
                ;;
              *)
                echo "::error::a Windows cmd.exe ran (exit $status): WSL interop lets the runner user start Windows programs as the Windows user. Fix on the host: $fix"
                rc=1
                ;;
            esac
          done
          if [ "$tried" -eq 0 ]; then
            echo "REPORT: no cmd.exe under $mnt_root/<drive>/Windows/System32 to try"
          fi
          for entry in WSLInterop WSLInterop-late; do
            f="$binfmt_dir/$entry"
            [ -e "$f" ] || continue
            first=""
            read -r first < "$f" 2>/dev/null || true
            if [ "$first" = "enabled" ]; then
              echo "::error::the $entry binfmt handler is enabled: any Windows .exe runs from this user. Fix on the host: $fix"
              rc=1
            else
              echo "REPORT: the $entry binfmt handler is registered but not enabled ($first)"
            fi
          done
          if [ ! -e "$binfmt_dir/WSLInterop" ] && [ ! -e "$binfmt_dir/WSLInterop-late" ]; then
            echo "REPORT: no WSLInterop binfmt handler is registered"
          fi

          echo "--- /mnt/<drive>: is a Windows drive mounted and listable?"
          seen=0
          for d in "$mnt_root"/[a-zA-Z]; do
            [ -d "$d" ] || continue
            seen=$((seen + 1))
            # Names are never printed: a drive root can hold a user-profile
            # directory name, and a count is all the verdict needs.
            status=0
            out="$(ls -A "$d" 2>/dev/null)" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "REPORT: a /mnt drive directory is not listable by the runner user (exit $status)"
            elif [ -z "$out" ]; then
              echo "REPORT: a /mnt drive directory exists and is empty (not a mounted drive)"
            else
              echo "::error::a /mnt drive is mounted and listable by the runner user ($(printf '%s\n' "$out" | wc -l | tr -d ' ') entries): the Windows drive is reachable. Fix on the host: $fix"
              rc=1
            fi
          done
          if [ "$seen" -eq 0 ]; then
            echo "REPORT: no $mnt_root/<drive> directory exists"
          fi

          echo "--- PATH: is a Windows directory on this job's PATH?"
          count=0
          old_ifs="$IFS"
          IFS=:
          for entry in $PATH; do
            case "$entry" in
              /mnt/[a-zA-Z]|/mnt/[a-zA-Z]/*) count=$((count + 1)) ;;
            esac
          done
          IFS="$old_ifs"
          if [ "$count" -gt 0 ]; then
            # The entries are not printed: they can name a Windows user profile.
            echo "::error::$count PATH entries point under /mnt/<drive> (appendWindowsPath is on). Fix on the host: $fix"
            rc=1
          else
            echo "no PATH entry points under /mnt/<drive> (expected)"
          fi
          exit "$rc"
