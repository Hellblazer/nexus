name: Release

on:
  push:
    tags:
      - "v*"
  # Retry path for a publish that failed for CI-side reasons (a rotted action
  # pin, a transient upload error) rather than a defect in the artifact.
  # Without this, the tag is the ONLY trigger AND GitHub runs the workflow file
  # from the tagged ref, so fixing the pipeline means MOVING the tag — which
  # breaks the immutability that .claude-plugin/marketplace.json's source.ref
  # depends on. 7.6.0 moved twice for exactly that reason (2026-08-11).
  # Dispatch checks out the named tag, so it publishes the same tree the tag
  # names, using the CURRENT workflow file from the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v7.6.0)"
        required: true
        type: string

# Gap 6 (T2 [22511]): without a concurrency group, the workflow_dispatch retry
# path above (added for exactly "a transient upload error") can race the
# original tag-push run instead of queuing behind it -- both ci.yml and
# engine-service-release.yml already carry one, this workflow didn't.
# `inputs.tag || github.ref_name` covers both triggers: on a tag push
# `inputs.tag` is unset so it falls through to the pushed tag's ref_name; on
# workflow_dispatch `inputs.tag` names the tag being retried. cancel-in-progress
# is deliberately false -- this publishes to PyPI, and cancelling a mid-publish
# run is worse than making the retry wait.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 2026-07-06 CI-cost pass: the pytest matrix that used to run here was
  # removed. A v* tag always points at a main merge commit whose identical
  # tree passed the release PR's required checks (pytest 3.12 + 3.13)
  # minutes before the tag was pushed — re-running ~40 min of ubuntu per
  # tag re-tested the same tree a fourth time and made publish hostage to
  # the nexus-9eaz GHA-flake family. The publish job below still verifies
  # tag == pyproject version before building.
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write   # required for OIDC trusted publisher
      contents: write   # required to create GitHub release
      checks: read      # nexus-jvhsw: read the tagged commit's check-run evidence

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # On workflow_dispatch, check out the tag the operator named; on a
          # tag push this is empty and checkout uses the triggering ref.
          ref: ${{ inputs.tag }}
          # fetch-depth: 0, NOT fetch-tags (nexus-dhs30). The engine-freshness
          # gate reads `git tag -l engine-service-v*` to prove every gated engine
          # tag is pinned. `fetch-tags: true` on a depth-1 checkout does NOT
          # deliver them — the tags point at commits outside that history, so the
          # refs never appear and the gate fails closed on every release. Full
          # history is the only reliable way to see them. Affordable here: this
          # workflow runs once per release, unlike ci.yml which runs per push.
          fetch-depth: 0

      - name: Resolve release tag (push vs dispatch)
        # ONE authority for every later step (v7.7.0 retry incident, runs
        # 31792663991 + 31792768971: on workflow_dispatch GITHUB_REF_NAME is
        # the BRANCH, so every step deriving TAG from it compared 'main'/
        # 'develop' against the version; the gh-release step would likewise
        # have targeted the branch ref absent an explicit tag_name).
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "Publishing tag $RELEASE_TAG (version ${RELEASE_TAG#v})"

      - name: Verify the tagged commit already carries a green required check (nexus-jvhsw)
        # EVIDENCE, NOT RE-EXECUTION (see scripts/check_release_ci_evidence.py's
        # module docstring): this reads GitHub's existing check-run record for
        # the commit checkout just resolved -- it does NOT run the test suite,
        # per CI Cost Discipline ("never test the same tree twice", the
        # 2026-07-06 billing incident). `git rev-parse HEAD` (not $GITHUB_SHA)
        # because on workflow_dispatch $GITHUB_SHA is the default branch's
        # tip, not the named tag's commit -- checkout above already resolved
        # the right commit into the working tree regardless of trigger type.
        # Stdlib-only script (no uv sync needed yet) so this runs first and
        # fails fast before any build work.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_release_ci_evidence.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "$(git rev-parse HEAD)"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          python-version: "3.12"
          # nexus-2ivn: see ci.yml. Bundled enable-cache caches metadata
          # only; explicit actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5 step below targets the
          # wheel-cache directory setup-uv actually uses.
          enable-cache: false

      - name: Cache uv wheel cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Verify tag matches pyproject.toml version
        # On workflow_dispatch GITHUB_REF_NAME is the BRANCH the workflow ran
        # from (e.g. 'main'), not the tag being published -- the retry path
        # compared 'main' against the version and failed on its first real
        # exercise (v7.7.0, run 31792663991; 7.6.0 moved tags instead of
        # dispatching, so this had never run). Resolve from the tag input
        # when present, exactly like the checkout step above does.
        run: |
          TAG="$RELEASE_VERSION"
          PKG=$(python3 -c "
          import re
          m = re.search(r'^version\s*=\s*\"(.+?)\"', open('pyproject.toml').read(), re.M)
          print(m.group(1) if m else '')
          ")
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag '$TAG' does not match pyproject.toml version '$PKG'"
            exit 1
          fi
          echo "Version check passed: $PKG"

      - name: Verify mcpb/manifest.json version matches tag (RDR-126 nexus-2yajx)
        run: |
          # The Claude Desktop .mcpb bundle is a separate version-drift
          # surface: its manifest.json carries its own version field. The
          # pytest parity test catches drift on the release SHA, but the
          # tag is applied after merge — this release-time guard fails the
          # publish loud if the bundle was not bumped in lock-step.
          TAG="$RELEASE_VERSION"
          MCPB=$(python3 -c "import json; print(json.load(open('mcpb/manifest.json')).get('version',''))")
          if [ "$TAG" != "$MCPB" ]; then
            echo "ERROR: tag '$TAG' does not match mcpb/manifest.json version '$MCPB'"
            exit 1
          fi
          echo "mcpb version check passed: $MCPB"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG="$RELEASE_VERSION"
          python3 - <<EOF > /tmp/release_notes.md
          import re, sys
          tag = "$TAG"
          text = open("CHANGELOG.md").read()
          # Match the section for this version (between its heading and the next ## heading)
          pattern = rf'## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          m = re.search(pattern, text, re.DOTALL)
          # nexus-5crgr: this used to fall back to a stub body ("Release
          # X.Y.Z") and publish anyway — the one version surface with no
          # parity enforcement. A missing section now fails the release,
          # matching the adjacent version checks' exit 1 discipline; the
          # pytest parity half lives in tests/test_plugin_structure.py.
          if m is None:
              print(f"::error::CHANGELOG.md has no '## [{tag}]' section — "
                    "refusing to publish with a stub release body (nexus-5crgr)",
                    file=sys.stderr)
              sys.exit(1)
          body = m.group(1).strip()
          if not body:
              print(f"::error::CHANGELOG.md's '## [{tag}]' section is EMPTY — "
                    "refusing to publish with a blank release body (nexus-5crgr)",
                    file=sys.stderr)
              sys.exit(1)
          print(body)
          EOF
          echo "Release notes:"
          cat /tmp/release_notes.md

      - name: Install project
        run: uv sync

      - name: Verify cloud engine meets required floor (nexus-b6qlf)
        # Mechanically enforces the release checklist's "Engine-freshness
        # gate" step, which was previously prose-only and got skipped in
        # practice: the cloud engine sat at engine-service-v0.1.17 for 9+
        # days across releases while REQUIRED_ENGINE_VERSION moved to
        # v0.1.34. Requires network egress to the live managed service
        # (api.conexus-nexus.com, unauthenticated GET /version, no secrets
        # needed) -- a transient network blip could block a release
        # momentarily; accepted tradeoff vs. the alternative of silent
        # engine drift.
        #
        # --paired-deploy-auto (nexus-gc9ir): under the paired-release
        # choreography the engine deploy fires AT client-tag push, in
        # PARALLEL with this publish job -- so a below-floor cloud at this
        # exact moment is the EXPECTED pre-deploy state for a paired
        # release, not drift. v7.10.0 (2026-08-18) ran this step bare, with
        # no human present to type --paired-deploy <tag>, and a routine
        # paired release red'd the publish outright. --paired-deploy-auto
        # derives the candidate tag from REQUIRED_ENGINE_VERSION and only
        # engages the paired-acceptance path when the cloud is confirmed
        # below that floor -- a cloud that already meets the floor takes
        # the untouched bare-invocation path, so this is never weaker than
        # the previous unconditional invocation for a non-paired release.
        #
        # GITHUB_TOKEN: the paired-acceptance path (engaged only when the
        # cloud is below floor) shells out to `gh release view` to verify
        # the derived tag is a published release -- without this, `gh`
        # refuses to run unauthenticated in Actions and the paired check
        # fails closed (UNVERIFIABLE) exactly when it is needed most.
        #
        # THE CORE TRADEOFF (review round, 2026-08-18): paired acceptance
        # here proves the engine TAG is legitimate (published, exactly
        # pinned, newest, fresh) -- it does NOT prove the deploy relay has
        # actually landed; this job has no way to observe that (it runs on
        # a different system, on Hal's side of the AGENTS.md bus). That is
        # an accepted, bounded gap: the DAILY `engine-floor-verify` job
        # (.github/workflows/scheduled-failure-watch.yml, 09:23 UTC, bare
        # gate against the real public endpoint) is the backstop -- a
        # deploy that never fired, or silently failed, surfaces within at
        # most 24h via the same "Scheduled workflows are failing silently"
        # tracked GH issue every other rotted scheduled gate reports
        # through. See check_engine_release_floor.py's module docstring
        # for the full statement and its behavior-pinning test.
        #
        # KNOWN FAILURE MODE, NO CI-SIDE BYPASS BY DESIGN: this invocation
        # has no --ack-client-lag flag (there is no human here to name a
        # bead), so an unacknowledged docs/wire-contract-pending.md
        # ## Unshipped entry fails this step CLOSED during a paired
        # release, with the ledger blocking BEFORE the tag/cloud checks
        # even run. That is correct -- do not add a bypass here.
        #
        # REMEDY, CORRECTED (nexus-55r6o, substantive-critic Critical
        # finding): re-running this SAME tag via `workflow_dispatch` does
        # NOT pick up a ledger fix -- the checkout step above pins
        # `ref: ${{ inputs.tag }}`, an IMMUTABLE tag, and
        # check_client_lag_ledger reads the ledger off that frozen tree, so
        # a same-tag retry re-reads the identical unacknowledged entry and
        # fails identically. The two REAL remedies: (a) cut a FRESH client
        # tag whose tree carries the ledger fix -- this is a new release,
        # not a retry of the failed one -- or (b) implemented (nexus-55r6o):
        # ci.yml's `release-ledger-gate` job runs the identical ledger-only
        # check (check_engine_release_floor.py --ledger-only) on EVERY PR
        # targeting main, before any tag exists -- not narrowed to
        # `release/*`-named branches, so a hand-named branch promoting to
        # main is covered too. That job is wired into `pytest-gate`'s
        # `needs:` (ci.yml), and `pytest-gate` is main's actual required
        # branch-protection check -- so this is mechanically MERGE-BLOCKING
        # on the release PR, not advisory, with no separate GitHub
        # repo-settings change needed. By the time this step runs at Step 8
        # on a frozen tag, a genuinely unacknowledged entry has already
        # failed the release PR at Step 7 and could not have merged, while
        # the tree was still mutable. This step's own unbypassable behavior
        # remains the correct backstop for whatever still reaches it (e.g.
        # a ledger entry added between PR merge and tag push).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_engine_release_floor.py --paired-deploy-auto

      - name: Build wheel and sdist
        run: uv build --sdist --wheel

      - name: Pack .mcpb Desktop Extension (RDR-126 nexus-bsjro)
        run: |
          # The Claude Desktop .mcpb bundle is a tiny artifact (~1-2 KB)
          # carrying manifest.json + pyproject.toml + src/server.py.
          # Users on Claude Desktop chat double-click it to install.
          # `npx @anthropic-ai/mcpb pack` zips the mcpb/ directory and
          # validates manifest.json against the v0.4 schema.
          npm install -g @anthropic-ai/mcpb
          cd mcpb
          mcpb pack . conexus.mcpb
          ls -la conexus.mcpb
          mkdir -p ../mcpb-dist && mv conexus.mcpb ../mcpb-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 (COMMIT sha, not the annotated-tag object sha)
        # No api-token needed — uses OIDC trusted publisher
        with:
          # Gap 6 (T2 [22511]): the 4.34.4 incident (see the GH-release step
          # below) had PyPI publish SUCCEED and only the GH-release sub-step
          # fail, repaired by hand. The workflow_dispatch retry path exists
          # for exactly this shape of partial failure -- but without
          # skip-existing, re-running after a successful PyPI upload hard-fails
          # here on the duplicate-file rejection before ever reaching the step
          # that actually needs retrying. skip-existing makes a re-run of an
          # already-published version a no-op here instead of a hard stop.
          skip-existing: true

      - name: Create GitHub Release
        # Pinned to v2.6.2 SHA after the floating @v2 tag was implicated
        # in a "Bad credentials" failure during the 4.34.4 publish (run
        # 26327424584, 2026-05-23). PyPI publish succeeded; only the GH
        # release sub-step failed and was created manually. Pinning to a
        # full-length SHA prevents silent action upgrades from re-introducing
        # the issue. Bump deliberately when validating a newer v2.x.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            mcpb-dist/conexus.mcpb
          prerelease: ${{ contains(env.RELEASE_TAG, 'rc') || contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') }}
