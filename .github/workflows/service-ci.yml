name: Service CI

# Kept separate from ci.yml (Python suite) so neither blocks the other.
#
# WHY pull_request CARRIES NO `paths:` FILTER (Hal directive 2026-07-31).
# This workflow's Java job is a REQUIRED check. A workflow-level `paths:` filter
# means the workflow never TRIGGERS on a PR that misses the filter, so the check
# never reports — and a required check that never reports leaves the PR pending
# FOREVER, not passing. Every docs-only and Python-only PR would wedge.
#
# So the filter moves from the workflow to the JOB: `changes` always runs and
# decides, and the expensive job is gated with `if:`. A job skipped via `if:`
# reports as SKIPPED, which branch protection treats as SUCCESS. Same trade the
# repo already makes for CA-3 in ci.yml, one level up (job-level skip rather
# than always-run-with-gated-steps, because the always-run shape would add a
# full-history checkout to every PR in the repo — CI cost discipline).
#
# WHY THIS BECAME REQUIRED. It was advisory, so 1541 engine tests gated nothing
# at merge. Two separate P0 catalog defects (nexus-u4e20, nexus-v6za0) reached
# develop behind that gap, each pinned ONLY in Java, each therefore unenforced.
#
# `push` KEEPS its paths filter: pushes gate nothing, so filtering there is pure
# cost saving with no pending-check hazard.
on:
  push:
    branches: [main, develop]
    paths:
      - 'service/**'
      - '.github/workflows/service-ci.yml'
  pull_request:
    branches: [main, develop]

# Explicit least privilege (the repo default is read, but the setting lives
# outside this file). contents: read is what checkout needs; pull-requests: read
# is what dorny/paths-filter needs to list a PR's files in the `changes` job.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: service-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # MUST ITSELF BE A REQUIRED CHECK. If this job fails, the Java job below is
    # skipped for want of its `needs`, and a skipped job reads as SUCCESS — so a
    # broken detector would silently green-light every PR. Requiring this job too
    # is what closes that fail-open path; do not require one without the other.
    name: service change detection
    runs-on: ubuntu-latest
    outputs:
      # nexus-hak6p: sourced from the VALIDATED `decide` step, never
      # `steps.filter` directly -- see that step's comment. Consumers
      # (`java-test-and-drift-guard`'s `if:`) now see only a value that
      # already passed the true/false case check, not the raw dorny output.
      service: ${{ steps.decide.outputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # Full history so dorny/paths-filter resolves the merge-base without
          # --deepen, whose shallow-fetch loop races ("fatal: shallow file has
          # changed since we read it") and flaked the CA-3 gate twice in 2026-06.
          fetch-depth: 0

      # SHA-pinned (not @v3), for the same reason ci.yml pins it: this filter's
      # output decides whether a REQUIRED check runs its tests at all. A floating
      # tag compromised to always emit 'false' would skip the entire engine suite
      # while the check still reported green. Pin copied from ci.yml so the two
      # workflows cannot drift onto different versions of the same decider.
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            service:
              - 'service/**'
              - '.github/workflows/service-ci.yml'

      - name: Report the decision (fail loud, never default-skip)
        # State the skip out loud. A gate that silently declines to run reads
        # identically to one that ran and passed.
        #
        # nexus-cqquo: the ORIGINAL two-armed if/else treated ANY non-"true"
        # value -- including an empty or malformed paths-filter output -- as
        # the "unchanged, skip" branch. Since `java-test-and-drift-guard`'s
        # job-level `if: needs.changes.outputs.service == 'true'` reads
        # exactly the same output, a malformed filter result would skip that
        # REQUIRED check's real work while this job (which per the comment
        # above "MUST ITSELF BE A REQUIRED CHECK" precisely so a broken
        # detector cannot silently green-light every PR) still exits 0. The
        # third `*)` arm closes that: an unproven predicate now fails THIS
        # job, which is the one thing standing between a broken detector and
        # a silent green.
        #
        # nexus-hak6p (review follow-up, 2026-08-12): this step ALSO now
        # owns the `id: decide` output the job publishes below. The
        # ORIGINAL shape had this validation run BESIDE the value flow --
        # the job's `outputs.service` read straight from `steps.filter`,
        # so the validated/unvalidated paths were only coupled by this
        # step's `exit 1` (and the implicit success()-gated `needs:` skip
        # it triggers). A guard that only observes the value and fails
        # loud on the side is a warning; re-emitting the SAME value from
        # THIS step, and pointing the job's public output at it, puts the
        # guard IN the path -- nothing downstream can observe a value that
        # didn't pass through the case statement above.
        id: decide
        run: |
          set -euo pipefail
          service="${{ steps.filter.outputs.service }}"
          case "$service" in
            true)
              echo "service/** changed — the Java suite WILL run."
              echo "service=true" >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo "service/** unchanged — the Java suite is SKIPPED (reports success)."
              echo "This PR is NOT evidence the engine suite passes."
              echo "service=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::paths-filter produced no usable service output ('$service') — cannot prove whether service/** changed, refusing to silently skip the Java suite"
              exit 1
              ;;
          esac

  java-test-and-drift-guard:
    name: Java tests + jOOQ codegen drift guard
    needs: changes
    if: needs.changes.outputs.service == 'true'
    # Runs on GitHub-hosted `ubuntu-latest`, like every other job in CI. The
    # self-hosted routes (hellmini-ci, qwen-linux) were deleted on 2026-10-03
    # (cleanup step 7).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # nexus-rjk2a, measured 2026-09-29/30 (14 runs in 30 hours): the job took
    # 21 to 34 min. The old 30-minute limit cut three runs with no test failure
    # (release PR #1583, 5de0e23f9 at 30m flat, 54d37bf43 at 30m16s); the
    # longest run so far, 36733252314, took 34m06s (suite step 22m04s,
    # integration step 11m30s). Runner variance is real: two trees differing
    # only in non-test files differed by 5.5 min in the suite step.
    #
    # How the three bounds interact (the job bound is not a sum of the others):
    #   - suite step: surefire kills a wedged fork at 45 min
    #     (forkedProcessTimeoutInSeconds, service/pom.xml) and the step fails.
    #     The integration step is then skipped, so a killed suite never adds
    #     the integration time to the job. Setup before the suite is a few
    #     minutes, so the job ends at about 50 min with a surefire timeout
    #     message, before the 60-minute line below.
    #   - integration step: it starts after a normal suite (about 22 min) and
    #     has its own 45-minute fork bound, which would fire at about 70 min
    #     into the job. The 60-minute job line fires first, about 35 min into
    #     that step. So an integration-step hang is caught by THIS line, not
    #     by the fork bound.
    #   - 60 sits above the longest job measured (34m06s) with room for the
    #     suite step to grow toward its fork bound, and above 45 min + setup so
    #     that a wedged suite fork gets surefire's own message.
    # It is a STOPGAP sized from one afternoon of data, not a derived
    # steady-state bound: the per-class timing step at the end of this job
    # exists to replace it with one once a few runs of per-class data are in.
    # This is a REQUIRED check on main and develop, so a timeout blocks a merge.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # The job token must not sit in a persistent workspace's .git/config
          # after the job. No later step pushes;
          # the prime-* actions pass github.token through their own env, and the
          # rehearsal's fallback `git fetch origin tag` reads a public repo.
          persist-credentials: false
          # SchemaUpgradeRehearsalIntegrationTest (nexus-4m6i0.6) needs an old
          # engine-service tag's changelog tree via `git archive <tag>`. Default
          # checkout (fetch-depth 1) fetches no tags at all; fetch-tags fetches
          # every tag's commit+tree cheaply (no full history), so the rehearsal
          # never falls back to its loud-skip path in CI.
          fetch-tags: true

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173  # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          # Cache Maven local repo across runs; bust when pom.xml changes.
          cache: maven

      - name: Cache MiniLM ONNX model
        # EmbedParityTest constructs OnnxEmbedder, which loads the
        # all-MiniLM-L6-v2 model from ~/.cache/chroma. Mirror the SAME
        # cache key as ci.yml (the Python suite) so this Java-only runner
        # restores the model the Python workflow already downloaded.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/chroma
          key: chromadb-onnx-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            chromadb-onnx-${{ runner.os }}-

      - name: Prime ONNX model on cache miss
        # Self-sufficiency: if the cache was empty (e.g. ci.yml has not run
        # on this branch yet), fetch the model directly. chromadb downloads
        # this exact tarball on first use; mirror its layout under
        # ~/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx/.
        run: |
          MODEL_DIR="$HOME/.cache/chroma/onnx_models/all-MiniLM-L6-v2"
          if [ ! -f "$MODEL_DIR/onnx/model.onnx" ]; then
            echo "ONNX model not in cache; downloading."
            mkdir -p "$MODEL_DIR"
            curl -fsSL https://chroma-onnx-models.s3.amazonaws.com/all-MiniLM-L6-v2/onnx.tar.gz \
              -o "$RUNNER_TEMP/onnx.tar.gz"
            tar -xzf "$RUNNER_TEMP/onnx.tar.gz" -C "$MODEL_DIR"
            test -f "$MODEL_DIR/onnx/model.onnx" || { echo "model.onnx missing after extract"; exit 1; }
          else
            echo "ONNX model restored from cache."
          fi

      - name: Prime bge-768 ONNX (cache or self-hosted asset)
        # RDR-160: Bge768ParityTest (the parity go/no-go gate) loads the STANDARD
        # fp32 bge ONNX; priming it here makes the gate RUN on CI instead of
        # skipping. Centralised in .github/actions/prime-bge-onnx (self-hosted
        # release asset, no HuggingFace 429 dependency).
        uses: ./.github/actions/prime-bge-onnx

      - name: Prime ms-marco cross-encoder ONNX (cache or pinned HF revision)
        # RDR-188 P1: CrossEncoderRerankerInferenceTest + the integration
        # suite's cross-encoder success path load the real ms-marco ONNX;
        # priming makes them RUN on CI instead of Assumptions-skipping (the
        # bge/RDR-160 CA-1 export-compat risk class must be CI-caught).
        # Non-vacuity enforced by assert_rerank_inference_ran.py below.
        uses: ./.github/actions/prime-crossencoder-onnx

      # jOOQ codegen now runs INSIDE the build (bead nexus-9qvam): the
      # testcontainers-jooq-codegen-maven-plugin generates into
      # target/generated-sources/jooq at the generate-sources phase from the
      # Liquibase changelog (sole schema authority), so generated sources are
      # never committed and drift is impossible by construction — a codegen
      # failure fails this step. The former -Pcodegen profile + committed
      # src/main/generated/ tree + git-diff drift guard are retired.
      #
      # NOTE: the job id/display name still say "drift guard" — they are kept
      # verbatim because the PR status-check name is referenced by branch
      # protection; renaming would strand required checks.
      # nexus-13eb0: forkCount default (4) is the LOCAL-loop parallelism
      # lever. forks=1 is pinned for CI because RAM, not core count, is the
      # limit: each fork boots its own Testcontainers Postgres, and neither CI
      # target was sized for N of them. GH-hosted ubuntu-latest is 4-core/16GB,
      # so the serial shape is right. Revisit deliberately if CI itself
      # is ever parallelized.
      - name: Run Java test suite
        working-directory: service
        run: ./mvnw -q test -Dnexus.test.forks=1

      # RDR-224 review (nexus-f9bgu.29/.32): tests/fixtures/native_jar_listings.txt is the
      # evidence the native-resource tests and OrtTempSweep's LOADED_LIBS pin are built on.
      # Only this comparison with the real jars proves it; the lint leg has no ~/.m2, so it
      # runs here, after the build resolved them. Fails loudly (jar not found, listing
      # differs); there is no skip path.
      - name: Native jar listing matches the resolved jars
        run: python3 scripts/native_jar_listing.py --check

      # nexus-yuogq: the @Tag("integration") group is EXCLUDED from the step
      # above (service/pom.xml sets test.excluded.groups=integration) and, until
      # 2026-09-12, ran in no default suite, no release battery and no schedule.
      # Three fixtures rotted there undetected: two carried the RDR-204
      # unregistered-collection defect and were found only because a bead named
      # them by hand, and a third still errored at SETUP afterwards with 12
      # tests dark. They are the SQL-function-versus-app-stitch parity tests --
      # the cross-check between the combined-query functions and the repository
      # path, which is precisely the surface an engine release changes. A parity
      # suite that never runs is worse than none, because its existence gets
      # cited as coverage. Cost on CI: 5.5 to 11.5 min over 14 runs on
      # 2026-09-29/30 (an earlier local figure of ~3 min for 25 tests was
      # wrong for the CI runner), across the 9 classes carrying the tag.
      - name: Run Java integration group (SQL-vs-stitch parity fixtures)
        working-directory: service
        run: ./mvnw -q test -Dtest.excluded.groups= -Dgroups=integration -Dnexus.test.forks=1

      # Non-vacuity for the step above: it fails loud on a red test, but a
      # selector that stops matching exits 0 having run NOTHING, which is the
      # silent shape that hid the three fixtures. Derives the expected classes
      # from the source tag rather than a hardcoded list, so it stays correct as
      # classes come and go. Same reasoning as assert_rehearsal_ran.py below.
      - name: Assert every integration-tagged class actually executed
        run: python3 scripts/assert_integration_group_ran.py service

      # nexus-c3rer: the old-to-HEAD upgrade rehearsal skips (JUnit
      # Assumptions.abort) when the old engine tag is unavailable — a skip
      # that Maven treats as success and the Actions UI shows green. This
      # step fails the job if the rehearsal was skipped or never executed,
      # so a fetch-tags regression can't silently retire the gate
      # (gates-scripted-not-ambient; mirrors ci.yml's assert_ca3_ran.py).
      - name: Assert upgrade rehearsal actually ran (not skipped)
        run: |
          python3 scripts/assert_rehearsal_ran.py \
            service/target/surefire-reports/TEST-dev.nexus.service.SchemaUpgradeRehearsalIntegrationTest.xml

      # RDR-188 P1 critic fold: the cross-encoder real-inference tests gate on
      # the primed ms-marco ONNX via JUnit Assumptions — a skip is invisible
      # behind a green checkmark, so prove the priming reached the tests.
      - name: Assert cross-encoder real-inference gate actually ran (not skipped)
        run: |
          python3 scripts/assert_rerank_inference_ran.py \
            service/target/surefire-reports/TEST-dev.nexus.service.vectors.CrossEncoderRerankerInferenceTest.xml \
            service/target/surefire-reports/TEST-dev.nexus.service.RerankStageIntegrationTest.xml

      # nexus-zbwgb: Bge768ParityTest (RDR-160 go/no-go) and
      # Bge768BatchCompositionTest (nexus-zu4ma sub-batch equivalence gate)
      # both Assumptions-skip when the standard fp32 bge ONNX is absent — the
      # identical invisible-skip risk the rerank assert above closes. Same
      # mirror.
      - name: Assert bge-768 model-dependent gates actually ran (not skipped)
        run: |
          python3 scripts/assert_bge_gates_ran.py \
            service/target/surefire-reports/TEST-dev.nexus.service.Bge768ParityTest.xml \
            service/target/surefire-reports/TEST-dev.nexus.service.vectors.Bge768BatchCompositionTest.xml

      # nexus-rjk2a: per-class timing, so the next duration question has data.
      # `-q` only quiets maven's console; surefire still writes TEST-*.xml (the
      # asserts above read them). Both mvn invocations write into the same
      # surefire-reports directory (the integration classes are excluded from
      # the first, and nothing cleans between), so ONE call sees every class.
      # `if: always()` so a timed-out or red run still leaves the ranking; the
      # script never fails, so it cannot redden a run on its own. Python
      # stdlib only, no uv sync.
      - name: Slowest test classes (diagnostic, never fails)
        if: always()
        run: python3 scripts/surefire_slowest.py service/target/surefire-reports --top 25


  # 2026-07-06 CI-cost pass: the native-image-build-and-smoke job that lived
  # here was removed — every service/** push was building the native image
  # TWICE (this job's full -O2 build + pgvector smoke, PLUS ci.yml's
  # engine-service-build -Ob reachability trip-wire on the same events). The
  # reachability-regression class is covered by ci.yml's trip-wire on every
  # push/PR; the full-optimization build + boot smoke still runs where the
  # artifact is actually produced (engine-service-release.yml, on every
  # engine-service-v* tag, before anything is published or deployed).
