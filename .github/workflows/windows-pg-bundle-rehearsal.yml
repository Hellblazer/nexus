# nexus-f9bgu.5 (RDR-224 P0.5a, Sam 2026-10-05): exercise the Windows release
# machinery OFF the release path, on the same runner and through the same scripts
# the release legs use (engine-service-release.yml's
# build-publish-pg-bundle-windows and build-publish-engine-windows), so the first
# real run of any change to it is not the tag. Modelled on mac-signing-rehearsal.yml.
#
# Why this exists: the release legs only run on a tag, and a Windows build that
# fails mid-release costs a tag. This runs, on a push that touches the inputs:
#   bundle:       the build-script unit tests, a fresh from-source build of the
#                 bundle (no cache, so the script itself is what is proven),
#                 the layout check, the package step and the relocation smoke
#                 against the exact archive (build tree deleted first);
#   engine:       (nexus-f9bgu.9, RDR-224 P1.2) the windows-x64 ENGINE leg, through
#                 the same composite action the release leg runs
#                 (.github/actions/windows-engine-leg): native build, embedded-
#                 resources check, dumpbin dependency check, the .txz with the four
#                 VC++ DLLs, and the smoke against the archive the bundle job just
#                 built. It signs and publishes nothing. The jOOQ sources come from a
#                 linux codegen job (a Windows runner has no Docker), which is why this
#                 workflow now has one ubuntu job; it is held behind the same actor
#                 guard and switch as the Windows jobs;
#   conformance:  the supervisor lifecycle conformance suite on Windows. It is a
#                 job of its own so its result does not hide the bundle's; until
#                 the Windows supervisor work lands (RDR-224 Phase 3) it can be
#                 red for reasons that have nothing to do with the bundle.
# The release legs run the smoke again at tag time.
#
# Triggers: a push to develop that touches those inputs (the mac rehearsal's
# accepted shape: a workflow_dispatch workflow is only runnable once it is on the
# default branch), plus workflow_dispatch once this file reaches main. Never
# pull_request: this is a public repo on a self-hosted runner.
#
# Runner: `win-release`, the self-hosted runner on qwentescence's native Windows
# side (P0.1). It carries no per-minute charge. The guard below and the
# NX_WINDOWS_RELEASE_LEGS switch mean nothing queues for it until Sam has
# registered it and flipped the variable. One runner runs one job at a time, so a
# rehearsal in flight delays a release leg by about its length, and a push that
# touches both sets of inputs runs bundle, then engine, then conformance (about a
# quarter of an hour in all).
#
# The file keeps its name although it now rehearses the engine as well: a rename
# would churn the concurrency group, AGENTS.md and the tests that name it for no
# change in behaviour.
#
# What this does NOT prove (nexus-f9bgu.31, critique S6). The release workflow's own
# Windows jobs (engine-service-release.yml: build-publish-pg-bundle-windows and
# build-publish-engine-windows) and the cache-seed leg are NOT in this file's path
# filter, and must not be: a push trigger on a release workflow would run release
# jobs. This rehearsal runs the SHARED pieces (the composite actions and the scripts),
# but not the parts only the release workflow has: the cosign install, sign and
# verify-blob steps, `gh release upload`, the cross-job artifact handoff
# (nexus-pg-windows-x64 there, rehearsal-pg-bundle here), cache restore and save on
# the self-hosted runner, and the promotion step against a real 27-asset release.
# Those are proven only by a workflow_dispatch run of engine-service-release.yml on
# develop, with the switch on, before the first Windows-carrying cut (a non-tag ref
# runs everything except sign, upload and promote); the engine-release skill's pre-cut
# steps name it, and AGENTS.md § Self-hosted runners and fork PRs repeats it.
#
# Post-merge code execution. A push to develop runs the scripts and the build of the
# merged tree on the release-boundary runner under the MERGER's actor, so the actor
# guard below says who merged, not who wrote the code (nexus-f9bgu.27, review S2).
# Every path in the filter below (and service/pom.xml, a pom edit being arbitrary code
# at build time) is therefore reviewed as release-runner code: AGENTS.md says so, with
# the one-sentence option of an `environment:` with a required reviewer.
#
# Runner prerequisites: uv (or Python 3.13), Visual Studio 2022 Build Tools (with
# its VC redist folder), win_flex_bison, meson, ninja, Strawberry Perl, git,
# PowerShell 7 (pwsh) and the Windows tar on PATH for the service account; for the
# engine job also network access to download GraalVM and, on a first run, the bge
# model.
name: windows-pg-bundle-rehearsal

on:
  push:
    branches: [develop]
    paths:
      - scripts/build_pg_bundle_windows.py
      - scripts/pg_bundle_windows_smoke.py
      - tests/test_pg_bundle_windows.py
      - scripts/windows_engine_release.py
      - scripts/engine_windows_smoke.py
      - scripts/check_native_embedded_resources.py
      - tests/test_windows_engine_release.py
      - tests/test_engine_windows_smoke.py
      - scripts/windows_job_cleanup.py
      - tests/test_windows_job_cleanup.py
      - scripts/engine_windows_stop_probe.py
      - tests/test_engine_windows_stop_probe.py
      - tests/fixtures/windows_dumpbin/**
      - service/pom.xml
      - service/src/main/resources/META-INF/native-image/**
      - tests/daemon/test_rdr149_lifecycle_conformance.py
      - src/nexus/daemon/service_registry.py
      - src/nexus/daemon/storage_service_daemon.py
      - tests/_engine_substrate.py
      - tests/conftest.py
      - scripts/check_junit_floor.py
      - .github/actions/resolve-windows-python/**
      - .github/actions/windows-engine-leg/**
      - .github/actions/windows-job-cleanup/**
      - .github/workflows/windows-pg-bundle-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pg-bundle-rehearsal
  cancel-in-progress: true

jobs:
  bundle:
    name: Build, package and relocation-smoke the Windows PG bundle (win-release)
    # Guard: public repo, self-hosted runner. The variable is the switch: with it
    # off (or unset) no job is created, so nothing waits for an offline runner.
    if: ${{ github.actor == 'Hellblazer' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    runs-on: win-release
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      PG_VERSION: "17.5"
      PGVECTOR_VERSION: "v0.8.2"
      PG_BUNDLE_RUNNER: win-release
      NX_TEST_T2_SUBSTRATE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Resolve Python
        uses: ./.github/actions/resolve-windows-python

      - name: Build-script unit tests
        run: |
          # --noconftest: tests/conftest.py imports tests/_engine_substrate.py, which calls
          # os.getuid() at import and so cannot load on Windows yet (measured on qwentescence,
          # 2026-10-05). These tests use no conftest fixture; with it, the first step would be red.
          uv run --python 3.13 --frozen pytest tests/test_pg_bundle_windows.py -o addopts="" -p no:cacheprovider --noconftest -q

      - name: Build the bundle from source (no cache)
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'rehearsal-bundle'
          if (Test-Path $prefix) { Remove-Item -Recurse -Force $prefix }
          & $env:PYTHON scripts\build_pg_bundle_windows.py build --prefix $prefix

      - name: Verify the bundle layout
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py verify --prefix (Join-Path $env:RUNNER_TEMP 'rehearsal-bundle')

      - name: Package .txz
        run: |
          & $env:PYTHON scripts\build_pg_bundle_windows.py package --prefix (Join-Path $env:RUNNER_TEMP 'rehearsal-bundle') --out-dir (Join-Path $env:RUNNER_TEMP 'rehearsal-dist')

      - name: Relocation smoke against the packaged archive
        run: |
          # The smoke refuses to run while the recorded build prefix still exists.
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'rehearsal-bundle')
          & $env:PYTHON scripts\pg_bundle_windows_smoke.py --archive (Join-Path $env:RUNNER_TEMP 'rehearsal-dist\nexus-pg-windows-x64.txz')

      - name: Keep the archive for the engine job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rehearsal-pg-bundle
          path: ${{ runner.temp }}/rehearsal-dist/nexus-pg-windows-x64.txz
          retention-days: 1
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          foreach ($d in 'rehearsal-bundle', 'rehearsal-dist') {
            $p = Join-Path $env:RUNNER_TEMP $d
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }

      - name: Stop stray engine and Postgres processes (always)
        if: always()
        uses: ./.github/actions/windows-job-cleanup

  jooq-codegen:
    name: jOOQ codegen (linux, Docker) for the engine rehearsal
    # Same guard as the Windows jobs, so with the switch off nothing here runs either.
    if: ${{ github.actor == 'Hellblazer' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
      - name: Set up GraalVM 25.0.3
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2  # v1
        with:
          java-version: '25.0.3'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Run testcontainers jOOQ codegen
        working-directory: service
        run: ./mvnw -q generate-sources
      - name: Upload generated jOOQ sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jooq-sources
          path: service/target/generated-sources/jooq
          if-no-files-found: error
          retention-days: 1

  engine:
    name: Build, check, package and smoke the Windows engine (win-release)
    needs: [bundle, jooq-codegen]
    if: ${{ github.actor == 'Hellblazer' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    runs-on: win-release
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      NX_TEST_T2_SUBSTRATE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Engine-script unit tests
        run: |
          # --noconftest for the reason given in the bundle job: conftest.py cannot load on Windows yet.
          uv run --python 3.13 --frozen pytest tests/test_windows_engine_release.py tests/test_engine_windows_smoke.py tests/test_engine_windows_stop_probe.py tests/test_windows_job_cleanup.py -o addopts="" -p no:cacheprovider --noconftest -q

      - name: Download the PG bundle the bundle job built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rehearsal-pg-bundle
          path: rehearsal-pg

      - name: Build, check, package and smoke the engine
        uses: ./.github/actions/windows-engine-leg
        with:
          pg-archive: rehearsal-pg/nexus-pg-windows-x64.txz
          out-dir: rehearsal-engine-dist

      - name: Clean up
        if: always()
        run: |
          foreach ($d in 'rehearsal-pg', 'rehearsal-engine-dist') {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Stop stray engine and Postgres processes (always)
        if: always()
        uses: ./.github/actions/windows-job-cleanup

  conformance:
    name: Supervisor lifecycle conformance suite on Windows (win-release)
    if: ${{ github.actor == 'Hellblazer' && vars.NX_WINDOWS_RELEASE_LEGS == 'on' }}
    runs-on: win-release
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      NX_TEST_T2_SUBSTRATE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Conformance suite
        run: |
          uv run --python 3.13 --frozen pytest tests/daemon/test_rdr149_lifecycle_conformance.py -o addopts="" -p no:cacheprovider -q -rs --junitxml=conformance-junit.xml

      # A suite that skipped itself on Windows would pass having proved nothing.
      # The ceiling counts xfail too (pytest reports it as a skip): the two
      # documented GAP cells plus the two platform skips (nexus-f9bgu.19).
      - name: Non-vacuity floor
        if: ${{ !cancelled() }}
        run: |
          uv run --python 3.13 --frozen python scripts/check_junit_floor.py conformance-junit.xml --min-passed 65 --max-skipped 4
