# RDR-232 runtime-facet -> golden-slug map v1 (nexus-jypmj.3.10).
#
# nx_answer derives runtime facet ids (f1..fN) from the request text; the golden sets label each request with
# stable slugs (required_facets). The two are not the same list: a request can derive fewer facets than it has
# slugs (one clause asking for three things), or more. This file is the join, written by hand from what
# `derive_request_coverage(text)` returns for each golden question (the deterministic first pass), read against
# the slugs. It is a hand LABEL of facet text, not a product of any assessment: it never reads a coverage ledger.
#
# Each entry: `match` is a case-insensitive substring of the runtime facet's text (so the join survives a change
# in facet numbering or order); `slugs` are the golden required_facets that facet carries. One facet may carry
# several slugs (a clause that asks for three things) and one slug may be carried by several facets.
#
# Two rules need no entry (scripts/bench/rdr232_facet_map.py): a request whose runtime facets are exactly one
# (a whole_question fallback or a single clause) carries every required slug of the request; and an entry
# overrides that rule. A runtime facet no entry or rule maps is reported as unmapped, never guessed.
#
# Requests absent below are mapped by the sole-facet rule or are TODO for a human pass (the report counts them):
# H02 (three loosely worded clauses, no clean slug per clause).
golden_set_version: 1
facet_map_version: 1
requests:
  G05-lookup-hybridrag-cap:
    - {match: "which paper reported", slugs: [reporting-paper]}
    - {match: "what split did it recommend", slugs: [recommended-split]}
