# RDR-232 held-out golden set v1 (nexus-jypmj.2.8).
#
# What this is: 29 labelled requests (H01 to H30, H08 removed) in the golden_v1 format, written so that the
# RDR-232 Phase 2 measures can be reported twice: on the in-sample golden set and on this set.
# Same label fields as golden_v1 and the same golden_set_version, so
# scripts/bench/schema.py::load_golden_set loads it strictly. Label rules are the ones in the
# golden_v1.yaml header block (answer_kind by hand from the wording; required_sources as
# RDR-NNN, RDR-NNN@ART for ART's RDRs, or a paper/note title as indexed; unacceptable_plans as
# "<verb>:<strategy>" builtin keys, with grown:hybrid-factual-lookup-473 listed wherever
# lookup:hybrid-factual-lookup is).
#
# Provenance: written BLIND on 2026-10-27 by an agent (the conexus developer agent, dispatched
# for nexus-jypmj.2.8). Blindness rules: the author did not open the request classifier, the
# eligibility gate, the active-project code, the RDR-232 golden fixture, the RDR-232 tests or
# document, the replay or metrics scripts, or any question text of golden_v1.yaml (only its
# header comment was read). The author read scripts/bench/schema.py and the builtin plans'
# descriptions under conexus/plans/builtin/ (to judge which plans are the wrong shape), and
# checked every named RDR id against docs/rdr/ and every paper or note title against the
# knowledge base with the search tool. Labels are the agent's, from the wording only; Sam should
# spot-check them, the four "unknown" requests first.
#
# The figures this set produces are OUT-OF-SAMPLE: nothing in the classifier or the gate was
# tuned on these requests. Do not tune on them either; a relabel or a rewording that changes a
# measure of a recorded observation set bumps golden_set_version, and adding a request changes
# the set's size, so it bumps too.
#
# Kind mix: lookup 5, synthesis 4, discovery 4, comparison 4, audit 4, debug 5, unknown 3.
#
# H08 ("plan matching", unknown) was removed before any measurement: it repeats golden_v1's
# G22 ("Tell me about plan matching."), so it was not held out. The author did not see G22;
# the overlap check against golden_v1 found it. No replacement was written, since anyone who
# has read the classifier would break the blindness rules above. 29 requests.
golden_set_version: 1
queries:
  - qid: H01
    category: factual
    text: "which rdr added the nx console web ui"
    answer_kind: lookup
