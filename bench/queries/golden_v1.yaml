# RDR-232 golden set v1 (nexus-jypmj.1.1).
#
# Extends the RDR-090 labeled query format (spike_5q.yaml) with the labels the RDR-232 measures
# need. Every request carries all of them; scripts/bench/schema.py::load_golden_set rejects a set
# with a missing field, an unknown kind or corpus prefix, or a wrong golden_set_version.
#
#   answer_kind         lookup | synthesis | discovery | comparison | audit | debug | unknown.
#                       Labeled BY HAND from the request's wording, independently of any plan's
#                       own declaration (RDR-232 Phase 2 exit criteria depend on that; the A1
#                       spike used each plan's own kind and that is not acceptable here).
#                       "unknown" is a request whose phrasing does not settle a kind.
#   required_sources    source refs the answer must draw on: RDR-NNN, or RDR-NNN@PROJECT when
#                       several projects hold an RDR with that number; paper titles for
#                       knowledge-base papers.
#   required_facets     stable ids of the facets the request asks for (a treatment constraint is
#                       not a facet).
#   allowed_corpora     collection-family prefixes (knowledge, code, docs, rdr) evidence may come
#                       from. Evidence outside them is scope leakage unless a permitted reason is
#                       recorded.
#   unacceptable_plans  "<verb>:<strategy>" keys of builtin plans that are the wrong shape for the
#                       request, read from each plan's description, not from a declared kind. A
#                       grown plan has no template strategy to name it, so the fixture's grown clone
#                       of plan 473 (nexus-jypmj.1.14) is named "grown:hybrid-factual-lookup-473"; it
#                       is listed wherever "lookup:hybrid-factual-lookup" is, since it has 473's body.
#                       The clone stands for ONE Phase 2 exit clause, "unknown-grown plans cannot
#                       bypass the gate" (it is stored ad-hoc,grown and declares kind unknown:
#                       the fixture stamps it {unknown, grown} like nx_answer's grow site,
#                       replacing the lookup its source template declares since nexus-jypmj.2.1). It does NOT measure the clause "473 is ineligible" (a
#                       builtin-tagged row that declares lookup). Plan 473's builtin origin is inferred
#                       from RDR-232 line 1606 and T2 nexus_rdr/189-research-11; no live read was made.
#
# Real requests: the first three lookups and the post-store-hook and retrieval-layer requests are
# the RDR-090 spike queries (ground_truth kept so the spike's NDCG axis still reads); the ART
# RDR-084 request is the 2026-10-23 incident request, verbatim (the RDR-232 Problem Statement; full
# text from nx_answer_runs run 722, 2026-10-23T22:25:33Z). The rest are requests of the shapes the RDR names, written against this
# repository's own RDRs and code.
#
# A relabel that can change a measure of an already-recorded observation set bumps
# golden_set_version; a key no recorded observation can contain does not. (Adding a request changes
# the set's size, so it bumps too.) nexus-jypmj.1.14 added the one grown key above without a bump:
# every recorded observation set is builtins-only, none can contain a "grown:" key, so every recorded
# measure reads as it did and the report carries the version it loads from bench.schema.
# tests/test_rdr232_grown_clone.py pins that the key appears exactly where
# "lookup:hybrid-factual-lookup" does and that no builtin plan is tagged grown.
golden_set_version: 1
queries:
  # ── lookup ───────────────────────────────────────────────────────────────
  - qid: G01-lookup-tumblers
    category: factual
    text: "Which RDR introduced catalog tumblers as hierarchical document addresses?"
    answer_kind: lookup
    required_sources: ["RDR-049"]
    required_facets: ["introducing-rdr"]
    allowed_corpora: ["rdr"]
    unacceptable_plans:
      - "query:abstract-themes"
      - "research:corpus-coverage-check"
      - "research:find-by-author"
      - "review:default"
      - "debug:default"
    ground_truth:
      "rdr-049-": 3
      "rdr-053-": 1

  - qid: G02-lookup-chash
    category: factual
    text: "Which RDR added the content-hash chunk index for stable chunk identity?"
    answer_kind: lookup
