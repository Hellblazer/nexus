    text: "Which paper reported the context-precision tradeoff for per-source caps in hybrid retrieval, and what split did it recommend?"
    answer_kind: lookup
    required_sources: ["HybridRAG"]
    required_facets: ["reporting-paper", "recommended-split"]
    allowed_corpora: ["knowledge"]
    unacceptable_plans:
      - "query:abstract-themes"
      - "research:corpus-coverage-check"
      - "review:default"
      - "debug:default"

  # ── synthesis ────────────────────────────────────────────────────────────
  # The 2026-10-23 incident request, verbatim (nx_answer_runs run 722, 2026-10-23T22:25:33Z).
  # Over ART RDR-084; the question carries no project token, so an owner/project binding
  # (owner 1.2 or project ART) is what names the source.
  - qid: G06-synthesis-art-rdr084
    category: compositional
    text: "Synthesize RDR-084, LIST PARSE Canonical Consolidation. State the locked architecture and numerical conventions, the evidence and gate history supporting them, the implementation work recorded as complete or pending, and what remains open by design. Distinguish facts at the RDR's 2026-07-30 acceptance from later records, cite source documents, and do not infer current code status beyond the retrieved evidence."
    scope: rdr
    answer_kind: synthesis
    required_sources: ["RDR-084@ART"]
    required_facets:
      - "locked-architecture"
      - "numerical-conventions"
      - "evidence"
      - "gate-history"
      - "implementation-state"
      - "open-by-design"
    allowed_corpora: ["rdr"]
    unacceptable_plans:
      - "lookup:hybrid-factual-lookup"
      - "grown:hybrid-factual-lookup-473"
      - "research:corpus-coverage-check"
      - "research:find-by-author"
      - "research:citation-traversal"
      - "research:document-discovery"

  - qid: G07-synthesis-rdr155
    category: compositional
    text: "Synthesize RDR-155: what the local and cloud storage modes are, what was removed, what the migration path is, and what remains open."
    answer_kind: synthesis
    required_sources: ["RDR-155"]
    required_facets: ["storage-modes", "removed-components", "migration-path", "open-items"]
    allowed_corpora: ["rdr"]
    unacceptable_plans:
