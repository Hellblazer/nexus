      "rdr-067-": 1

  - qid: G04-lookup-min-confidence
    category: factual
    text: "What minimum confidence does plan_match use by default before a plan counts as a hit?"
    answer_kind: lookup
    required_sources: ["RDR-079"]
    required_facets: ["default-min-confidence"]
    allowed_corpora: ["rdr", "code"]
    unacceptable_plans:
