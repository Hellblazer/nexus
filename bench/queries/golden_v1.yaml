    required_sources: []
    required_facets: ["t1-role", "t2-role", "t3-role", "lifetimes"]
    allowed_corpora: ["docs", "rdr"]
    unacceptable_plans:
      - "lookup:hybrid-factual-lookup"
      - "grown:hybrid-factual-lookup-473"
      - "research:corpus-coverage-check"
      - "research:find-by-author"
      - "research:citation-traversal"
      - "research:document-discovery"

  - qid: G09-synthesis-retrieval-evolution
    category: compositional
    text: >-
      Trace the retrieval-layer evolution: how did plan-first dispatch,
      operator extraction, and plan match scope-awareness develop across
      the RDR-078 through RDR-095 sequence?
    answer_kind: synthesis
    required_sources: ["RDR-078", "RDR-080", "RDR-088", "RDR-091", "RDR-092"]
    required_facets: ["plan-first-dispatch", "operator-extraction", "scope-aware-matching"]
    allowed_corpora: ["rdr"]
    unacceptable_plans:
      - "lookup:hybrid-factual-lookup"
      - "grown:hybrid-factual-lookup-473"
      - "research:corpus-coverage-check"
      - "research:find-by-author"
      - "research:document-discovery"
    ground_truth:
      "rdr-078-": 3
      "rdr-080-": 3
      "rdr-088-": 3
      "rdr-091-": 3
      "rdr-092-": 2
      "rdr-079-": 1

