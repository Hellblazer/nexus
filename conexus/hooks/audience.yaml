# The audience manifest (nexus-sby49.3, plan section 5 item 1; reworked in nexus-sby49.4).
#
# Who each hook, rule and injected text is for. Nothing is gated on who the user is: the development process is the plugin's
# product and reaches every user; what a project or a user can change is a setting. The manifest lint fails on a registration
# with no entry, an unknown value, a constant that does not exist, a setting entry in a module that never reads its setting,
# a reader called outside a wrapped body, and an audience import whose fallback widens a permission. The behaviour leg of the
# out-of-repo gate drives the real argv in three fixtures (a plain repository, a project that turns the setting on in its
# tracked .nexus/project.json, a user who turns it on in conexus.json) and checks the output against these entries. A module
# is named by its plugin-relative path (hooks/scripts/x.py) or, for the wheel's hooks, by its dotted name (nexus.hooks.x).
#
#   audience  EVERY-USER       the product; fires always (a data gate only on the user's own content)
#             SETTING:<key>    fires when the project's .nexus/project.json (tighten-only) or the user's conexus.json sets <key>:
#                              subagent_git, telemetry, t1_nudge, advice_block, preflight, ci_wait, credential_helper,
#                              brief_questions
#             REMOVE           never
#   gate      none | setting | data
#   live      false = the rule's end state is not wired yet; the leg's allowlist may name only these rows (it is empty)
#   phase     when the item changes: - (never), 1, 2, 3, after-2, 4
#   decision  the owner decision (D1..D13) the entry rests on
#
# A registration is keyed on event plus argv: 23 registrations, 22 distinct argv (auto-approve is registered for PreToolUse
# and PermissionRequest with one argv). `modules` is the table of every hook module that has text or a reader; each
# module-level string constant of 40 characters or more is declared injected (a constant entry) or not_injected (a reason).
version: 1
audiences:
- EVERY-USER
- SETTING
- REMOVE
phase_shipped: 3
decisions_answered:
- D1
- D2
- D3
- D4
- D5
- D6
- D7
- D8
- D9
- D10
- D11
- D12
- D13
