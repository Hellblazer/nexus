rules:
- id: U1a
  module: hooks/scripts/routing/subagent_git_write_requires_orchestrator.py
  audience: SETTING:subagent_git
  gate: setting
  evidence: 'The strict subagent git guard: a subagent may not write git state in a shared checkout; the seatbelt is the default (D1)'
  target_state: the full guard only where subagent_git is strict in the project or the user settings
  phase: '3'
  decision: D1
- id: U1b
  module: hooks/scripts/routing/_user_git_seatbelt.py
  audience: EVERY-USER
  gate: none
  evidence: Discards and history destruction are accidents any user can have; D1's list
  target_state: as is
  phase: '1'
  decision: D1
- id: U5b
  module: nexus.hooks.subagent_stop_t1_nudge
  audience: SETTING:t1_nudge
  gate: setting
  evidence: 'The SubagentStop reminder to write findings to T1: every agent type, on by default, off with t1_nudge false'
  target_state: as is
  phase: '3'
- id: dispatch-record
  module: nexus.hooks.subagent_stop_t1_nudge
  audience: SETTING:telemetry
  gate: setting
  evidence: 'agent_dispatch_record sends the agent type and put count to the user''s engine: opt-in, off by default'
  target_state: as is
  phase: '3'
- id: routing-telemetry
  module: hooks/scripts/routing/_lib.py
  audience: SETTING:telemetry
  gate: setting
  evidence: 'log_routing_event sends the user''s command fragment to their engine: opt-in, off by default'
  target_state: as is
  phase: '3'
- id: U2b
  module: nexus.hooks.auto_approve
  audience: EVERY-USER
  gate: none
  evidence: memory_delete, answer_plan_delete (and plan_delete), memory_consolidate, nx_tidy, tuple_in and mailbox_send are auto-approved for
    every user; a user who wants a prompt adds an ask rule in their own settings
  target_state: as is
  phase: '3'
  decision: D2
- id: U6b
  module: hooks/scripts/stop_wake_guard.py
  audience: SETTING:ci_wait
  gate: setting
  evidence: The Stop guard names the project's CI-wait command; without the setting the wording is neutral
  target_state: the CI command only from the project's ci_wait
