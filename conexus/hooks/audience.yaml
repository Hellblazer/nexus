# The audience manifest (nexus-sby49.3, plan section 5 item 1).
#
# Who each hook, rule and injected text is for. tests/test_plugin_audience_lint.py fails on a registration with no entry,
# an unknown value, a constant that does not exist, a gated entry in a module that never calls its predicate, a predicate
# called outside a wrapped body, and an audience import whose fallback widens a permission. The behaviour leg
# (tests/e2e/lib/plugin_behaviour.py) drives the real argv and checks the output against these entries.
#
#   audience  EVERY-USER  the product; fires always (a data gate only on the user's own content)
#             NEXUS-REPO  fires when the checkout carries the tracked nexus marker, whoever runs it
#             SAM-WIDE    fires when the account flag exists or the checkout carries the marker
#             REMOVE      never
#   gate      none | maintainer | nexus_repo | account_flag | data
#   live      false = the rule's end state is not wired yet (a Phase 3 row); the leg's allowlist may name only these rows
#   phase     when the item changes: - (never), 1, 2, 3, after-2, 4
#   decision  the owner decision (D1..D13) the entry rests on
#
# A registration is keyed on event plus argv: 23 registrations, 22 distinct argv (auto-approve is registered for PreToolUse
# and PermissionRequest with one argv). `modules` is the table of every hook module that has text or a predicate; each
# module-level string constant of 40 characters or more is declared injected (a constant entry) or not_injected (a reason).
version: 1
audiences:
- EVERY-USER
- NEXUS-REPO
- SAM-WIDE
- REMOVE
