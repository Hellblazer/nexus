# RDR-121 routing-hook registry.
#
# One entry per active routing hook. Hooks may read their own rule
# entry at runtime to determine fail_closed behavior. Initially empty;
# nexus-mzvwa.3 / .4 / .5 will populate this file with their rule
# entries.
#
# Schema (per rule):
#   rule_name:        unique snake_case identifier; matches the hook
#                     script basename minus the .py extension
#   hook_script:      path under conexus/hooks/scripts/routing/ to the .py
#                     entry point
#   matcher:          Claude Code hook matcher pattern (Bash, Edit, etc.)
#   mode:             redirect | block | warn  — semantic only; the hook
#                     enforces with allow/deny envelopes
#   rationale:        one-line user-facing rule statement
#   escape_token:     normally `# routing-allow:`; included for
#                     discoverability
#   fail_closed:      bool; default false. true means hook crashes deny
#                     the call rather than allow it. Reserve for safety-
#                     critical invariants (phase-review close gate).
#
# Example shape (commented; not yet active):
#
# rules:
#   grep_for_symbols_redirects_to_serena:
#     hook_script: grep_for_symbols_redirects_to_serena.py
#     matcher: Bash
#     mode: redirect
#     rationale: "grep on code files for identifier-shaped patterns should use Serena"
#     escape_token: "# routing-allow:"
#     fail_closed: false

rules:
  git_add_all_redirects_to_explicit_paths:
    hook_script: git_add_all_redirects_to_explicit_paths.py
    matcher: Bash
    mode: redirect
    rationale: >-
      TWO consolidated git-hygiene checks, one hook (one subprocess spawn).
      (1) git add wildcard forms (-A, ., --all) pull in unrelated untracked
      drafts; stage by explicit path (feedback_no_git_add_all).
      (2) git push whose EFFECTIVE target is main is denied — PRs only
      (nexus-vduer). Resolves the target from an explicit refspec, else the
      current branch's upstream, because the 2026-07-23 incident was a BARE
      `git push` from a checkout already on main. Tag pushes stay allowed.
      Consolidated rather than split because RDR-121/125 cap routing rules at
      FOUR cross-plugin; a fifth needs consolidation or a successor-RDR budget
      revision, and the cap is on rule COUNT (measured latency was ~147ms
      against the 300ms budget, i.e. not binding — but that is not this
      change's call to make).
    escape_token: "# routing-allow:"
    fail_closed: false
  subagent_git_write_requires_orchestrator:
    hook_script: subagent_git_write_requires_orchestrator.py
    matcher: Bash
    mode: block
    rationale: >-
      subagents never write the index/history OR destroy the working tree in
      the shared tree — hand-back is diffs+paths and the orchestrator commits
      pathspec-limited (RDR-184 Gap-4, nexus-s88vq; verb set widened by
      nexus-ays2l from {commit,add} to also cover checkout/restore/stash/
      clean/reset/rm, which delete uncommitted work outright). Read-only
      spellings (git stash list/show, status, diff, log, show) stay allowed;
      linked-worktree agents are exempt.
    escape_token: "# routing-allow:"
    # Hook-level: a crash in the guard must not brick every agent's Bash.
    # NOTE the split INSIDE the hook (nexus-ays2l item 3, Hal 2026-07-25):
    # an UNDETERMINABLE worktree state fails OPEN for commit/add (hygiene)
    # and CLOSED for the working-tree destroyers (silent data loss).
    fail_closed: false
  phase_review_close_requires_gate:
    hook_script: phase_review_close_requires_gate.py
    matcher: Bash
    mode: block
    rationale: >-
      bd close on a phase-review bead requires a fresh PASSED
      /conexus:phase-review-gate sentinel; the cross-walk catches silent
      scope reduction that test-validator and code-review-expert miss
      by construction (see feedback_phase_closeout_scope_audit).
    escape_token: "# routing-allow:"
    fail_closed: true
