# SPDX-License-Identifier: AGPL-3.0-or-later
# RDR-121 routing-hook registry.
#
# One entry per active routing hook. Hooks may read their own rule
# entry at runtime to determine fail_closed behavior. Initially empty;
# nexus-mzvwa.3 / .4 / .5 will populate this file with their rule
# entries.
#
# Schema (per rule):
#   rule_name:        unique snake_case identifier; matches the hook
#                     script basename minus the .py extension
#   hook_script:      path under hooks/scripts/routing/ in this plugin to the .py
#                     entry point
#   matcher:          Claude Code hook matcher pattern (Bash, Edit, etc.)
#   mode:             redirect | block | warn  — semantic only; the hook
#                     enforces with allow/deny envelopes
#   rationale:        one-line user-facing rule statement
#   escape_token:     normally `# routing-allow:`; included for
#                     discoverability
#   fail_closed:      bool; default false. true means hook crashes deny
#                     the call rather than allow it. Reserve for safety-
#                     critical invariants (no rule uses it today).
#
# Example shape (commented; not yet active):
#
# rules:
#   grep_for_symbols_redirects_to_serena:
#     hook_script: grep_for_symbols_redirects_to_serena.py
#     matcher: Bash
#     mode: redirect
#     rationale: "grep on code files for identifier-shaped patterns should use Serena"
#     escape_token: "# routing-allow:"
#     fail_closed: false

rules:
  subagent_git_write_requires_orchestrator:
    hook_script: subagent_git_write_requires_orchestrator.py
    matcher: Bash
    mode: block
    rationale: >-
      subagents never write the index/history OR destroy the working tree in
      the shared tree — hand-back is diffs+paths and the orchestrator commits
      pathspec-limited (RDR-184 Gap-4, nexus-s88vq; verb set widened by
      nexus-ays2l from {commit,add} to also cover checkout/restore/stash/
      clean/reset/rm; nexus-3c92m round 4 replaced structural parsing with a
      structure-agnostic proximity scan as the deciding rule, after three
      review rounds each found a new bypass in the structural approach — see
      the hook's own module docstring). Read-only git (status/diff/log/show/
      blame/rev-parse/ls-files) stays allowed as long as the command text
      doesn't also contain a write-verb word near `git`; linked-worktree
      agents are exempt when the worktree is positively proven.
    escape_token: "# routing-allow:"
    # Hook-level: a crash in the guard must not brick every agent's Bash.
    # NOTE the split INSIDE the hook (nexus-ays2l item 3, Hal 2026-07-25):
    # an UNDETERMINABLE worktree state fails OPEN for commit/add (hygiene)
    # and CLOSED for the working-tree destroyers (silent data loss).
    fail_closed: false
  credential_print_guard:
    hook_script: credential_print_guard.py
    matcher: Bash
    mode: block
    rationale: >-
      never read a Claude Code credential straight from the keychain, a
      .credentials.json file, or a shell expansion of
      CLAUDE_CODE_OAUTH_TOKEN — use the nexus repo's credentials wrapper (its
      status and run verbs) instead (RDR-219 Gap 2, nexus-wauo1.22). NO ESCAPE TOKEN: this rule
      never honours # routing-allow:, unlike every other rule in this
      registry — the message naming that wrapper is RDR-219's
      only answer to a false positive.
    escape_token: "none (RDR-219: this guard is deliberately un-escapable)"
    # Hook-level: a crash in the guard must not brick every agent's Bash.
    # The marker-scoped fail-closed/fail-open split lives INSIDE the hook
    # itself (see its own module docstring, "FAILURE BEHAVIOUR") — the
    # all-or-nothing run_hook(fail_closed=...) wrapper stays False here,
    # exactly like subagent_git_write_requires_orchestrator's split above.
    fail_closed: false
  destructive_action_advice:
    hook_script: destructive_action_advice.py
    matcher: Bash|Edit|Write|MultiEdit
    mode: warn
    rationale: >-
      ONE table-driven hook for the machine-checkable bright lines of the
      destructive-action guard rules (nexus-qo7ie.36): pattern kills (pkill,
      killall, kill fed by pgrep/ps), bulk or output-hiding git branch
      deletes, git stash while more than one worktree exists, a background
      job piped into tail/head/grep/wc/tee, whole-disk recursive scans, glob
      or mtime deletes under a shared temp root, hand-run hook verbs without a
      scratch HOME and NEXUS_CONFIG_DIR, and an edit of a shell script a live
      shell is executing. ADVISE mode: it never denies, it returns the rule and
      the safe alternative as additionalContext. The mode is the MODE constant
      in the script (one line to flip to deny, with the usual escape); each
      row of its ROWS table names its rule source. Reports each firing to
      routing_events as outcome advise_<row id>.
    escape_token: "# routing-allow: (deny mode only; advise mode has nothing to escape)"
    # Advice only: a crash must never block or even slow a call.
    fail_closed: false
