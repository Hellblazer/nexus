name: default
description: >-
  Compare and synthesize a research area across papers and code. What tradeoffs do the
  papers report? How do different approaches compare? What is the evidence for this
  technique? Which findings support or contradict each other? Gathers prose and code,
  walks reference chains, and synthesizes with citations.
dimensions:
  verb: analyze
  scope: global
  strategy: default
required_bindings:
- area
- criterion
optional_bindings:
- limit
default_bindings:
  limit: 12
tags: builtin-template,rdr-078,analyze
plan_json:
  steps:
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    # nexus-opraf: no `topic` here. `search`'s `topic` restricts to an
    # already-discovered taxonomy label (`nx taxonomy discover`), never
    # a caller's free-text binding -- `topic: $area` matched no real
    # label on any live install, so `search_cross_corpus`'s topic
    # pre-filter returned [] before `corpus: all` was ever consulted.
    scope:
      taxonomy_domain: prose
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    # nexus-opraf: see the step-1 comment above -- same reason.
    scope:
      taxonomy_domain: code
  - tool: traverse
    args:
      seeds:
      - $step1.tumblers
      - $step2.tumblers
      purpose: reference-chain
      depth: 2
      direction: both
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step2.ids
      collections:
      - $step1.collections
      - $step2.collections
  - tool: rank
    args:
      criterion: $criterion
      inputs: $step4.contents
  - tool: summarize
    args:
      inputs: $step4.contents
