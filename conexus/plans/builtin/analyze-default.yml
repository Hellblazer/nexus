name: default
description: >-
  Compare and synthesize a research area across papers and code. What tradeoffs do the
  papers report? How do different approaches compare? What is the evidence for this
  technique? Which findings support or contradict each other? Gathers prose and code,
  walks reference chains, and synthesizes with citations.
dimensions:
  verb: analyze
  scope: global
  strategy: default
required_bindings:
- area
- criterion
optional_bindings:
- limit
default_bindings:
  limit: 12
tags: builtin-template,rdr-078,analyze
plan_json:
  steps:
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: prose
      topic: $area
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: code
      topic: $area
  - tool: traverse
    args:
      seeds:
      - $step1.tumblers
      - $step2.tumblers
      purpose: reference-chain
      depth: 2
      direction: both
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step2.ids
      collections:
      - $step1.collections
      - $step2.collections
  - tool: rank
    args:
      criterion: $criterion
      inputs: $step4.contents
  - tool: summarize
    args:
      inputs: $step4.contents
