name: citation-traversal
# Rationale (restored per critique — was description prose pre-mmfag): resolves
# the seed by title, then walks the reference graph both inward (what cites
# this) and outward (what this cites); the seed resolution is why the plan
# requires a document title binding rather than free text.
description: >-
  What does this paper cite? What cites this document? Trace the citation chain around a
  source. Which works build on this one? What is the reference neighborhood of a
  document? Walks the citation graph inward and outward from a seed document.
dimensions:
  verb: research
  scope: global
  strategy: citation-traversal
required_bindings:
  - document
optional_bindings:
  - depth
  - limit
default_bindings:
  depth: 2
  limit: 10
tags: builtin-template,rdr-092,catalog,citation
plan_json:
  steps:
    - tool: query
      args:
        question: $document
        limit: $limit
        corpus: all
    - tool: traverse
      args:
        seeds: $step1.tumblers
        purpose: reference-chain
        depth: $depth
        direction: both
    - tool: store_get_many
      args:
        ids:
          - $step1.ids
          - $step2.ids
        collections:
          - $step1.collections
          - $step2.collections
    - tool: summarize
      args:
        inputs: $step3.contents
