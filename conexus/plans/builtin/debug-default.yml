# nexus-7y4v0: this plan used to require `failing_path` and pass it as
# `subtree: $failing_path`. `subtree` takes a catalog tumbler prefix, and
# nx_answer has no file path to supply — it aliases unbound free-text
# bindings from the question, so the filter received prose and matched
# nothing. The plan ran and returned an empty answer that read like a real
# one. Path scoping was never this plan's purpose (surfacing the design
# context around a failure is), so it is gone rather than defaulted: the
# symptom text is what a debug question actually carries.
name: default
# Rationale (restored per critique — was description prose pre-mmfag):
# intentionally FLAT — dev work starts from a concrete failure, and the primary
# link walk is from the failing code file to its tests/docs, not a deep
# citation traversal.
description: >-
  Why is this failing? What causes this error or crash? Debug a failing test or code
  path. Why does the process hang or spin? Where does this exception come from? What
  changed to break this behavior? Starts from a concrete failure and walks the
  implicated code.
dimensions:
  verb: debug
  scope: global
  strategy: default
required_bindings:
- symptom
optional_bindings: []
default_bindings: {}
tags: builtin-template,rdr-078,debug
plan_json:
  steps:
  - tool: query
    args:
      question: $symptom
      author: nexus
      corpus: all
  - tool: store_get_many
    args:
      ids: $step1.ids
      collections: $step1.collections
  - tool: summarize
    args:
      inputs: $step2.contents
