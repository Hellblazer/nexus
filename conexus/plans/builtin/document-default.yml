name: default
description: >-
  Write or audit documentation for an area. What documentation exists for this feature?
  Is the documentation up to date with the code? What should the docs say about this
  module? Gathers the prose and code that touch an area and checks documentation-for
  links.
dimensions:
  verb: document
  scope: global
  strategy: default
required_bindings:
- area
optional_bindings:
- limit
default_bindings:
  limit: 10
tags: builtin-template,rdr-078,document
plan_json:
  steps:
  - tool: query
    args:
      question: $area
      follow_links: cites
      limit: $limit
      corpus: all
    # nexus-opraf: no `topic` here. `search`/`query`'s `topic` restricts
    # to an already-discovered taxonomy label (`nx taxonomy discover`),
    # never a caller's free-text binding -- `topic: $area` matched no
    # real label on any live install, so `search_cross_corpus`'s topic
    # pre-filter returned [] before `corpus: all` was ever consulted.
    scope:
      taxonomy_domain: prose
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    # nexus-opraf: see the step-1 comment above -- same reason.
    scope:
      taxonomy_domain: code
  - tool: traverse
    args:
      seeds: $step2.tumblers
      purpose: documentation-for
      depth: 1
      direction: in
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step2.ids
      collections:
      - $step1.collections
      - $step2.collections
  - tool: compare
    args:
      focus: doc-coverage
      inputs: $step4.contents
