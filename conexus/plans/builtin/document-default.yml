name: default
description: >-
  Write or audit documentation for an area. What documentation exists for this feature?
  Is the documentation up to date with the code? What should the docs say about this
  module? Gathers the prose and code that touch an area and checks documentation-for
  links.
dimensions:
  verb: document
  scope: global
  strategy: default
required_bindings:
- area
optional_bindings:
- limit
default_bindings:
  limit: 10
tags: builtin-template,rdr-078,document
plan_json:
  steps:
  - tool: query
    args:
      question: $area
      follow_links: cites
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: prose
      topic: $area
  - tool: search
    args:
      query: $area
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: code
      topic: $area
  - tool: traverse
    args:
      seeds: $step2.tumblers
      purpose: documentation-for
      depth: 1
      direction: in
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step2.ids
      collections:
      - $step1.collections
      - $step2.collections
  - tool: compare
    args:
      focus: doc-coverage
      inputs: $step4.contents
