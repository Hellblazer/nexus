# nexus-h33x8.6 a1 — single-query fast path.
#
# _nx_answer_classify_plan (src/nexus/mcp/core.py) reroutes a matched
# plan straight to query() (mean 2.1s, no claude -p) ONLY when the plan
# has exactly one step whose tool is `query`. Prior to this template,
# every plan in the builtin library ended in an operator, so that
# documented fast path was structurally unreachable — an nx_answer call
# for a document-discovery question paid the full ~80s claude -p
# synthesis floor for a question that never needed synthesis at all.
#
# This template covers the DISCOVERY shape: "which documents/papers/RDRs
# exist on X" — the caller wants the documents, not a synthesized answer
# over their content. See corpus-coverage-check.yml for the adjacent
# "does the corpus have anything on X" phrasing.
#
# Description text follows the abstract-themes.yml precedent (RDR-098):
# lead with a dense bag of short natural question-form phrasings, since
# the RDR-079 T1 cache embeds this text with the bundled MiniLM and a
# small model's cosine score tracks lexical/phrasal overlap closely — a
# long explanatory paragraph dilutes the vector away from the question
# shapes this plan actually needs to catch. Document-level guidance
# ("use research-default for synthesis instead") belongs in a comment,
# not the embedded description, for the same reason.
#
# Not a synthesized cross-document answer: returns the matching
# documents themselves (title, snippet, source metadata). For a
# synthesized answer that reads across multiple documents' content, use
# research-default / analyze-default instead.

name: document-discovery
description: >-
  Which documents discuss this topic? Which papers discuss this subject? Find the papers
  about a subject. List the documents that mention a term. Which notes or RDRs mention
  this? Do we have any docs covering this area? Finds the specific documents about a
  topic.
dimensions:
  verb: research
  scope: global
  strategy: document-discovery
required_bindings:
  - question
optional_bindings:
  - corpus
  - limit
default_bindings:
  # nexus-rl59s (RDR-200 Phase 1b): was "knowledge" -- a NON-EMPTY string,
  # so it pre-empted BOTH the fast-path `or _PLAN_STEP_DEFAULT_CORPUS`
  # fallback (core.py) and the general runner's `_apply_default_corpus_to_args`
  # (its guard is presence-based: "corpus" in args), since this default
  # resolves into `args` before either check runs. This template IS q19's
  # plan 471 reproduction (T2 analysis-rdr200-phase1b-retrieval-reach-2026-09-01:
  # "single-step guard rerouted to query(corpus=knowledge)") -- the runner-level
  # fix alone could never widen this because the plan itself declared "knowledge"
  # as an explicit default, which both fall-throughs correctly treat as a
  # deliberate plan-level pin. Widened to the same four-prefix default so a
  # caller who doesn't override `corpus` gets rdr__/knowledge__ coverage
  # instead of the narrow single-prefix default this bead exists to fix.
  corpus: knowledge,code,docs,rdr
  limit: 10
tags: builtin-template,nexus-h33x8,single-step,fast-path
plan_json:
  steps:
    - tool: query
      args:
        question: $question
        corpus: $corpus
        limit: $limit
