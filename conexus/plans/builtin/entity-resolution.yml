# RDR-147 Step 4 branch (c) (nexus-irndi) — the routing fix for entity-listing questions.
#
# "Find the names of companies that were affected by issues in X" is a
# discovery/listing request that needs the coverage boundary: the answer is
# the set of entities the evidence links to the issue, not a list of
# documents. Before this template the request-kind call decided its fate:
# read as `lookup` (13 runs in 14 on the 2026-11-06 MVV, T2 nexus_rdr
# 147-research-15) it reached hybrid-factual-lookup, a plan with a
# coverage boundary; read once as `discovery/listing` the answer-kind gate
# left only the single-query listing templates, document-discovery
# answered with no coverage boundary, and the run lost a question.
#
# This template declares discovery/listing and carries the step body of
# hybrid-factual-lookup.yml (search, traverse, fetch both streams, rank,
# generate), so either reading of the request reaches a plan with a
# coverage boundary. The steps are a copy, kept identical on purpose: see
# hybrid-factual-lookup.yml for the per-stream budget and threshold
# rationale. tests/test_plan_match_entity_resolution_route.py pins the
# match text, the request kinds and the golden discovery requests.
#
# Match text follows the abstract-themes.yml precedent (RDR-098): a dense
# bag of short question-form phrasings, because the RDR-079 cache embeds
# it with the bundled MiniLM and the cosine tracks phrasal overlap. The
# phrasings are entity-listing requests (the names of the companies or
# customers tied to an issue), which document-discovery's phrasings
# ("which documents discuss", "list the papers") do not cover. The text
# deliberately avoids a leading "Find ..." phrasing: an earlier draft that
# opened with "Find the names of companies" pulled "Find the retry helper in
# just the code files" away from type-scoped-search in the category route
# (tests/test_plan_match_category_route_probes.py, the mmfag guard).
# Document-level guidance (use document-discovery to list documents
# instead) belongs here, not in the embedded description.

name: entity-resolution
description: >-
  Which customers were affected by these bugs? Which companies were impacted by this
  defect? Names of the companies affected by the issues. The customers and organizations
  affected.
dimensions:
  verb: research
  scope: global
  strategy: entity-resolution
required_bindings:
  - question
optional_bindings:
  - corpus
  - limit
  - depth
  - vector_budget_chunks
  - graph_budget_chunks
default_bindings:
  corpus: all
  limit: 40
  depth: 2
  vector_budget_chunks: 6
  graph_budget_chunks: 4
# RDR-232 Phase 2: the answer kind this template serves, declared (not inferred from the verb).
answer_kind: discovery/listing
tags: builtin-template,rdr-147,nexus-irndi,entity-resolution,discovery-listing
plan_json:
  steps:
    - tool: search
      args:
        query: $question
        limit: $limit
        corpus: $corpus
        # Disable per-corpus distance filter during over-fetch — the
        # rank step downstream handles relevance. RF-9; tracked
        # systemically as nexus-h3e2.
        threshold: 2.0
    - tool: traverse
      args:
        seeds: $step1.tumblers
        purpose: factual-evidence
        depth: $depth
        direction: both
    - tool: store_get_many
      args:
        ids: $step1.ids
        collections: $step1.collections
        limit_per_source: $vector_budget_chunks
    - tool: store_get_many
      args:
        ids: $step2.ids
        collections: $step2.collections
        limit_per_source: $graph_budget_chunks
    - tool: rank
      args:
        criterion: >-
          Relevance to the question the candidates were retrieved for.
          Prefer factual evidence — concrete claims, named entities,
          numeric values, dates — over topical mentions. The candidates
          are fused from vector recall and citation/relation-graph
          traversal; value direct evidence over loose association.
        inputs:
          - $step3.contents
          - $step4.contents
    - tool: generate
      args:
        template: factual-answer
        cited: true
        inputs: $step5.ranked
