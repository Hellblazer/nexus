name: find-by-author
description: >-
  Find documents written by a specific author. What has this author written? Show
  everything by this person in the collection. Which papers are attributed to this
  researcher? An author-scoped lookup joined with a topical query.
dimensions:
  verb: research
  scope: global
  strategy: find-by-author
required_bindings:
  - author
optional_bindings:
  - limit
default_bindings:
  limit: 10
tags: builtin-template,rdr-092,rdr-156,catalog,author,combined-query
plan_json:
  steps:
    # RDR-156 P4 (nexus-zo0zt): combined metadata-scoped query replaces the
    # query()-tool catalog dance + store_get_many hydration. The structured
    # output carries contents inline, so summarize reads $step1.contents
    # directly (no chash-keyed store_get_many — these ids are document
    # tumblers). Service-mode (pgvector) only.
    - tool: search_metadata_scoped
      args:
        query: $author
        author: $author
        limit: $limit
        corpus: all
    - tool: summarize
      args:
        inputs: $step1.contents
