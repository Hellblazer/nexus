name: default
description: >-
  How does this part of the system work? What is the architecture behind a feature? How
  does a concept travel from design into the code that implements it? Which modules
  implement this idea? By what mechanism does the system choose among competing
  candidates? What internally determines the result that gets produced? Where is this
  design decision recorded? Walks from a concept through the RDRs and docs into the
  implementing code, with cited context.
dimensions:
  verb: research
  scope: global
  strategy: default
required_bindings:
- concept
optional_bindings:
- limit
default_bindings:
  limit: 10
tags: builtin-template,rdr-078,research
plan_json:
  steps:
  - tool: search
    args:
      query: $concept
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: prose
      topic: $concept
  - tool: traverse
    args:
      seeds: $step1.tumblers
      purpose: find-implementations
      depth: 2
      direction: out
  - tool: search
    args:
      query: $concept
      limit: $limit
      corpus: all
    scope:
      taxonomy_domain: code
      topic: $concept
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step3.ids
      collections:
      - $step1.collections
      - $step3.collections
  - tool: summarize
    args:
      inputs: $step4.contents
