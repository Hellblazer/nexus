# nexus-7y4v0: this plan used to require `changed_paths` and pass it as
# `subtree: $changed_paths`, a catalog tumbler prefix. nx_answer never has
# a path list, so it aliased the question prose into the filter and the
# retrieval step matched nothing — an empty answer presented as an answer,
# and it was reachable on the plain cosine path (0.512 for "review the
# changes on this branch", above the 0.40 floor), so this was live.
# Renamed to `change_set` and used as free text: the binding is what the
# reviewer is asking about, and the catalog resolves it the way
# citation-traversal resolves its seed.
name: default
description: >-
  Review or critique a change set. What are the risks in this change? Does this diff
  align with prior decisions? What history bears on these files? Audits changed files
  against the decisions and documents that shaped them.
dimensions:
  verb: review
  scope: global
  strategy: default
required_bindings:
- change_set
optional_bindings:
- depth
default_bindings:
  depth: 1
tags: builtin-template,rdr-078,review
plan_json:
  steps:
  - tool: query
    args:
      question: $change_set
      corpus: all
  - tool: traverse
    args:
      seeds: $step1.tumblers
      purpose: decision-evolution
      depth: $depth
      direction: in
  - tool: store_get_many
    args:
      ids:
      - $step1.ids
      - $step2.ids
      collections:
      - $step1.collections
      - $step2.collections
  - tool: extract
    args:
      inputs: $step3.contents
      fields: decision,rationale,rdr
  - tool: compare
    args:
      focus: decision-drift
      inputs: $step3.contents
