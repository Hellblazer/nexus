name: type-scoped-search
description: >-
  Search only one content type: just the code, just the paper collection, or just the
  RDRs. Find code files about a subject. Search the RDRs alone for a topic. Restrict the
  search to a single content type.
dimensions:
  verb: research
  scope: global
  strategy: type-scoped
required_bindings:
  - question
  - content_type
optional_bindings:
  - limit
default_bindings:
  limit: 10
tags: builtin-template,rdr-092,rdr-156,catalog,type-scoped,combined-query
plan_json:
  steps:
    # RDR-156 P4 (nexus-zo0zt): combined metadata-scoped query replaces the
    # query()-tool catalog dance + store_get_many hydration; summarize reads
    # $step1.contents inline. Service-mode (pgvector) only.
    - tool: search_metadata_scoped
      args:
        query: $question
        content_type: $content_type
        limit: $limit
        corpus: all
    - tool: summarize
      args:
        inputs: $step1.contents
