# --------------------------------------------------------------------
# main_dispatch (hand-enumerated, 15 cells): mode (4 values) partitions
# the group into 4 disjoint sub-shapes -- bare's own check_floor/
# ancestry/tracker chain, paired_explicit's and paired_auto's shorter
# check_floor/ancestry chain (no tracker leg pre-deploy), and
# ledger_only's standalone ledger dispatch (bypasses check_floor/
# ancestry/tracker entirely). Each row pins mode plus every dim its own
# branch actually examines and omits the rest, mirroring
