[dimensions."main_dispatch.check_floor"]
domain = ["blocks", "passes"]
[dimensions."main_dispatch.ancestry"]
domain = ["blocks", "passes"]
[dimensions."main_dispatch.tracker"]
domain = ["resolved", "opt_out", "refusal"]
[dimensions."main_dispatch.ledger"]
