# RDR-201 Phase 2.3 (nexus-j9z30.13): the release-choreography decision
# table -- a mechanical transcription of the 89 reachable decision cells
# tests/scripts/fixtures/release_cells.json enumerates (RDR-201 P2.1,
# nexus-j9z30.11) over scripts/check_engine_release_floor.py and
# scripts/check_client_release_precondition.py.
#
# Repo-only (docs/tables/, not src/nexus/tables/): both consumers live
# under scripts/, which never ships in the wheel -- see
# nexus-j9z30.13's DESCRIPTION and docs/tables/README.md.
#
# SHAPE. match = { function = "<one of 12 names>" }: one match GROUP per
# cell-producing function the enumerator names (six exhaustively-modeled
# GuardChain functions, six hand-enumerated orchestrator functions --
# exactly the union of erc._all_chains() + erc._all_orchestrator_results()
# in scripts/enumerate_release_cells.py). Every group's guard dimensions
# are FUNCTION-PREFIXED ("<function>.<name>") to avoid collision -- two
# different functions legitimately reuse a bare name like "ledger" or
# "probe" for structurally unrelated axes.
#
# GROUP SHAPE, MEASURED (code review, T2 nexus/code-review-nexus-j9z30-13
# -2026-09-01 [24062], which flagged two reviewers disagreeing on this):
# recomputed directly from the loaded table via nexus.tables.check's own
# groups_of/dimensions_of/full_product -- 7 of the 12 match groups prove a
# declared guard-dimension product STRICTLY LARGER than their row count
# (check_composite 11 rows/20-product, check_floor_auto_paired 9/24,
# check_floor_bare 5/8, check_floor_paired 7/12, check_paired_preconditions
# 13/864, check_source_ancestry 6/12, main_dispatch 15/192) -- these are
# genuine short-circuit-collapse trees, where an earlier row's omitted
# guard key legitimately absorbs a larger unreached sub-product than a
# bare per-leaf row count alone would suggest. The other 5 groups
# (check_client_lag_ledger, check_pin_currency, check_wire_contract_ledger,
# precond_main_dispatch, record_deploy_from_gate_report_leg) are
# single-dimension, product == row count exactly -- there is only one
# guard dimension to omit, so no collapse is possible and every leaf gets
# its own row 1:1. This settles the disagreement: it is not "11 unique-key
# trees, only check_composite a real cross-product" -- 7 of 12 groups are.
#
# GuardChain functions (check_pin_currency, check_source_ancestry,
# check_client_lag_ledger, check_wire_contract_ledger,
# check_paired_preconditions, record_deploy_from_gate_report_leg) are
# transcribed by the SAME short-circuit discipline their real GuardStep
# chain uses (see enumerate_release_cells.py's own chain builders): a row
# pins every dimension a STRICTLY EARLIER step examined to that step's
# sole "continue" value(s), pins the TERMINAL dimension to the leaf's own
# value(s), and OMITS every dimension no earlier step reached -- an
# omitted guard key implicitly accepts its ENTIRE domain (nexus.tables
# .check.accepted_assignments), so the omission collapses exactly the
# unreached sub-product a short-circuit return already discards. This is
# provably equivalent to resolve_leaf's own exhaustive partition of the
# full cartesian product: coverage is total and rows are pairwise
# disjoint BY CONSTRUCTION, not by hand-checked arithmetic.
#
# The six hand-enumerated orchestrator functions (check_floor_bare,
# check_floor_paired, check_floor_auto_paired, main_dispatch,
# check_composite, precond_main_dispatch) have no formally declared
# dimensions in the fixture (erc.make_result's own docstring: they are
# hand-traced from source, not a cartesian-product enumeration) -- their
# guard dimensions and domains here are derived directly from the actual
# input keys/values erc's own Cell objects carry for that function,
# using the IDENTICAL short-circuit-by-omission discipline. The
# enumerator's own "n/a" placeholder (a cell input value meaning "this
# axis is not examined on this branch", e.g. check_floor_bare's
# pin_currency=blocks cell carries probe="n/a") is dropped from the
# domain entirely rather than declared as a real value -- the omission
# technique already expresses "not examined" without it, and a "n/a"
# domain member would create a phantom, permanently-uncovered
# combination (real probe values never co-occur with pin_currency=
# blocks) that check_table would wrongly flag as a coverage-gap.
#
# NO EVENT COLUMN -- BY RULING, NOT OVERSIGHT (nexus-j9z30.26, Sam,
# 2026-09-02). RDR-201 Finding 2 classified the 7.1.0/v0.1.62 incident as
# an un-encoded event dimension (pre-tag / tag-push / deploy /
# post-deploy-verify), and P2.3 authored this table with table-wide
# "event" and "mode" dimensions no row ever guarded on. The ruling: the
# fix for that incident (commit 79fff05a9) changed a remedy STRING and
# prose, no decision logic. The event-sensitivity is real but lives in
# the release / engine-release SKILL choreography -- which moment a human
# runs which gate -- which scripts/enumerate_release_cells.py's
# event_mode_matrix() records as skill citations. A table over the two
# scripts' own inputs is event-invariant by construction, so the columns
# came out at P2.6 (nexus-j9z30.16). Do not re-derive the question from
# the incident write-up and re-add them: a declared dimension no row reads
# is exactly what the checker's unused-dimension advisory exists to flag.
#
# O2 ORDER-ASYMMETRY (nexus-j9z30.17): {cloud >= floor, ledger dirty}
# exits 1 under --paired-deploy (battery-before-probe: the
# check_floor_paired::paired_battery_blocks row below) and 0 under
# --paired-deploy-auto (probe-first, ledger never read: the
# check_floor_auto_paired::auto_current / auto_current_pin_blocks rows
# below). Both are already separate, faithfully-encoded rows below (two
# different functions -> two different match groups) -- nothing here
# reconciles them; do not merge without Sam's ruling (nexus-j9z30.17).
#
# EXCLUDED (T2 nexus_rdr/201-research-4; scripts/enumerate_release_cells
# .py's own header docstring): gate-report directory contents (collapsed
# to record_deploy_from_gate_report_leg's 8 CLASSIFIED outcomes),
# --no-record-deploy's free-text reason (modeled as present/absent
# only), and argparse's own parser.error() flag-combination refusals
# (CLI-shape refusals, not release decisions -- see
# CLI_VALIDATION_REFUSAL_SITES in enumerate_release_cells.py).
#
# NO ESCAPE ROWS anywhere in this table (bead constraint): every group
# below is closed by explicit, disjoint rows proven total by the
# short-circuit-by-omission construction above, never by a catch-all
# that would turn a coverage gap into a silent pass.
#
# Row ids reuse the fixture's own cell_id format verbatim
# (f"{function}::{message_key}", erc.cell_id) so the parity harness
# (tests/scripts/test_release_table_parity.py) and the message catalog
# (scripts/release_messages.py) key on the SAME string as this table.

[table]
id = "release-choreography"
kind = "decision-table"
version = 1

[dimensions.function]
domain = [
  "check_pin_currency",
  "check_source_ancestry",
  "check_client_lag_ledger",
  "check_wire_contract_ledger",
  "check_paired_preconditions",
  "record_deploy_from_gate_report_leg",
  "check_floor_bare",
  "check_floor_paired",
  "check_floor_auto_paired",
  "main_dispatch",
  "check_composite",
  "precond_main_dispatch",
]

# --------------------------------------------------------------------
# check_pin_currency (GuardChain, 1 dim, 5 leaves -- 1:1 with its domain)
# --------------------------------------------------------------------

[dimensions."check_pin_currency.newest"]
domain = ["unavailable", "none", "above_floor", "at_floor", "below_floor"]

[[row]]
id = "check_pin_currency::pin_currency_tags_unavailable"
match = { function = "check_pin_currency" }
guard = { "check_pin_currency.newest" = "unavailable" }
emit = { exit_code = "2", message_key = "pin_currency_tags_unavailable" }

[[row]]
id = "check_pin_currency::pin_currency_zero_tags"
match = { function = "check_pin_currency" }
guard = { "check_pin_currency.newest" = "none" }
emit = { exit_code = "2", message_key = "pin_currency_zero_tags" }

[[row]]
id = "check_pin_currency::pin_currency_stale_pin"
match = { function = "check_pin_currency" }
guard = { "check_pin_currency.newest" = "above_floor" }
emit = { exit_code = "1", message_key = "pin_currency_stale_pin" }

[[row]]
id = "check_pin_currency::pin_currency_current_at_floor"
match = { function = "check_pin_currency" }
guard = { "check_pin_currency.newest" = "at_floor" }
emit = { exit_code = "0", message_key = "pin_currency_current_at_floor" }

[[row]]
id = "check_pin_currency::pin_currency_current_below_floor"
match = { function = "check_pin_currency" }
guard = { "check_pin_currency.newest" = "below_floor" }
emit = { exit_code = "0", message_key = "pin_currency_current_below_floor" }

