[project]
name = "conexus-mcpb"
version = "7.42.0"
description = "Conexus packaged as Claude Desktop .mcpb (Desktop Extension)"
requires-python = ">=3.12"
dependencies = [
    # #1068: the [local] extra (fastembed) MUST be present so the Desktop
    # extension's venv resolves the Tier-1 bge-768 local embedder. Without it,
    # LocalEmbeddingFunction silently falls back to the 384-dim ONNX MiniLM
    # while collections are indexed at 768/1024-dim, so every T3 search hits a
    # dimension mismatch and returns zero results. The .mcpb cannot run the
    # interactive `nx init` embedder choice, so it must pin [local] explicitly.
    "conexus[local]>=7.42.0",
]

[tool.uv]
package = false
# nexus-heykz: same `av` exclusion as the root pyproject.toml and
# src/nexus/_install/overrides.txt (the bundle env is built by `uv sync` here,
# which reads THIS table). Pinned to parity by tests/test_install_source_wiring_pins.py.
override-dependencies = [
    "av; sys_platform == 'never'",
    # nexus-gqrg0 (GH #1533): same pdftext<0.7 bound as the root
    # pyproject.toml and src/nexus/_install/overrides.txt -- pdftext 0.7.x
    # broke mineru's span_pre_proc.py (see root pyproject.toml for detail).
    "pdftext>=0.6.3,<0.7",
]
