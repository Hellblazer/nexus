# The stack's lab entry conditions for checks that otherwise run only in CI (nexus-clfse.5).
#
# A lane that stacks onto the RDR-229 stack (T2 nexus/rdr229-phase3-cut-checklist, item 14c) runs, besides the
# suites the checklist names, the lab twin of every check below that its diff reaches. Before this list each of
# these was the post-push CI run's job, and four defects reached develop that way (2026-11-24: Service CI's
# integration-ran assert on 9c8bc0d04b, the pipefail lint on 05c2704080 over service/native-smoke.sh).
#
# tests/scripts/test_lab_entry_conditions.py parses ci.yml, service-ci.yml and .github/actions/* and fails when this
# file and CI disagree: a listed step gone from CI or its invocation (arguments included) changed, a CI step that
# runs a repo script or test file that is neither a check nor an exclusion, an exclusion pointing at a step that does
# not run the script, a path-gate claim the real paths-filter globs contradict, or a command that breaks the
# lab-host rules.
#
# SWEEP LIMITS. The sweep is keyed on repo scripts and test files. A CI step that runs none (uvx ruff, an inline
# pytest, a count floor) is covered only where [[script_less]] below names it; a new one can appear unlisted. Only
# ci.yml, service-ci.yml and the composite actions are swept: the release, engine-release, nightly and Windows
# workflows are gates of their own.
#
# Where commands run (AGENTS.md rules 12-13, checklist 0-2):
#   * mvnw-leased.sh, build-gate-jar.sh, upgrade_boot_writes.py, docker and the assert_* scripts run ON the pool
#     host (chas-test or qwent-test, over ssh), in the lane's own clone checked out at the stack tip, from its root.
#     Engine builds never go through lab-remote.
#   * lab-remote lines run from the lane's worktree on the laptop (leave --host off) and `--fetch` their status file.
#     Status files are root-level `*status*.json` names (git-ignored; output/ does not exist in a lab-remote copy
#     and watched_pytest does not create it).
#   * Prerequisites run first, in file order; a check lists the ones it needs in `after`.
#   * The CI assert scripts read service/target/surefire-reports and assume a clean target/ (CI checks out fresh);
#     engine-main-suite clears the reports first so a stale report cannot satisfy one.
#
# Fields: workflow/job/step/run_contains pin the CI step and the exact invocation (normalised; comments and line
# continuations ignored). lab_runs_ci_line: that invocation is one of the lab command's lines. ci_flags: Maven flags
# in both CI's step and the lab command. gated_by/gate_job/lane_paths_hit/lane_paths_miss: the paths-filter that gates
# the CI step, checked against its real globs. full_suite: the entry may use lab-l.
#
# twin = "exact"       the same check CI runs, on the lane's tip
#        "partial"     a weaker substitute; `gap` says what the lab cannot see
#        "conditional" exact once a host prerequisite holds; `gap` names it

version = 1

# ---------------------------------------------------------------- prerequisites

[[prerequisite]]
id = "old-engine-tag"
host = "chas-test or qwent-test"
note = "service-ci.yml 'Fetch the one old engine tag the upgrade rehearsal reads': without the tag the rehearsal Assumptions-skips and assert_rehearsal_ran.py fails."
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Fetch the one old engine tag the upgrade rehearsal reads"
run_contains = 'git fetch --no-tags --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"'
command = [
  '''tag=$(sed -n 's/.*String OLD_TAG = "\(engine-service-v[0-9.]*\)";.*/\1/p' service/src/test/java/dev/nexus/service/SchemaUpgradeRehearsalIntegrationTest.java) && git fetch --no-tags --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"''',
]

[[prerequisite]]
id = "engine-main-suite"
host = "chas-test or qwent-test"
note = "Checklist item 1 (the whole engine suite). Runs the upgrade rehearsal and the model gates, and leaves the jars in ~/.m2 that native_jar_listing.py reads."
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Run Java test suite"
run_contains = "./mvnw -q test -Dnexus.ddl.suite=main"
ci_flags = ["-Dnexus.ddl.suite=main"]
command = [
  "rm -rf service/target/surefire-reports",
  "scripts/mvnw-leased.sh --lab-run lab-m -B test -Dnexus.ddl.suite=main",
]

[[prerequisite]]
id = "engine-integration-group"
host = "chas-test or qwent-test"
note = "Checklist item 2 (CI's flags); its count must be non-zero."
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Run Java integration group (SQL-vs-stitch parity fixtures)"
run_contains = "-Dtest.excluded.groups= -Dgroups=integration"
ci_flags = ["-Dnexus.ddl.suite=integration", "-Dtest.excluded.groups=", "-Dgroups=integration"]
command = [
  "scripts/mvnw-leased.sh --lab-run lab-m -B test -Dnexus.ddl.suite=integration -Dtest.excluded.groups= -Dgroups=integration",
]

[[prerequisite]]
id = "ca3-bundle-build"
host = "chas-test or qwent-test (needs docker)"
note = "CI's from-source bundle build in the manylinux_2_28 image. CI caches the bundle by the hash of scripts/build_pg_bundle.sh; a lane may reuse ./bundle from an earlier lane's clone while that script is unchanged. About 10 minutes cold."
workflow = "ci.yml"
job = "ca3-pgvector-bundle"
step = "Build complete PG + pgvector from source (Strategy B, glibc 2.28)"
run_contains = "scripts/build_pg_bundle.sh"
script = "scripts/build_pg_bundle.sh"
ci_env = { PG_VERSION = "17.5", PGVECTOR_VERSION = "v0.8.7", MANYLINUX_IMAGE = "quay.io/pypa/manylinux_2_28_x86_64" }
command = [
  'export PG_VERSION=17.5 PGVECTOR_VERSION=v0.8.7 MANYLINUX_IMAGE=quay.io/pypa/manylinux_2_28_x86_64 BUNDLE_PREFIX="$PWD/bundle"',
  'mkdir -p "$BUNDLE_PREFIX"',
  'lab-run -c lab-m -- docker run --rm -e PG_VERSION -e PGVECTOR_VERSION -e BUNDLE_PREFIX -v "$PWD:$PWD" "$MANYLINUX_IMAGE" /bin/bash -c "set -eux; bash $PWD/scripts/build_pg_bundle.sh"',
]

# ---------------------------------------------------------------- checks CI runs

[[check]]
id = "integration-group-ran"
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Assert every integration-tagged class actually executed"
run_contains = "python3 scripts/assert_integration_group_ran.py service"
lab_runs_ci_line = true
script = "scripts/assert_integration_group_ran.py"
after = ["engine-main-suite", "engine-integration-group"]
twin = "exact"
host = "chas-test or qwent-test"
note = "Run over the integration surefire reports the group just wrote. It derives the expected classes from the @Tag(\"integration\") source, so it reads the lane's own tree; red on 9c8bc0d04b over an abstract tagged fixture base that never writes a report."
command = [
  "python3 scripts/assert_integration_group_ran.py service",
]

[[check]]
id = "upgrade-rehearsal-ran"
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Assert upgrade rehearsal actually ran (not skipped)"
run_contains = "python3 scripts/assert_rehearsal_ran.py service/target/surefire-reports/TEST-dev.nexus.service.SchemaUpgradeRehearsalIntegrationTest.xml"
lab_runs_ci_line = true
script = "scripts/assert_rehearsal_ran.py"
after = ["old-engine-tag", "engine-main-suite"]
twin = "exact"
host = "chas-test or qwent-test"
note = "Needs the old engine tag fetched before the suite (old-engine-tag), or the rehearsal skips."
command = [
  "python3 scripts/assert_rehearsal_ran.py service/target/surefire-reports/TEST-dev.nexus.service.SchemaUpgradeRehearsalIntegrationTest.xml",
]

[[check]]
id = "rerank-inference-ran"
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Assert cross-encoder real-inference gate actually ran (not skipped)"
run_contains = "python3 scripts/assert_rerank_inference_ran.py service/target/surefire-reports/TEST-dev.nexus.service.vectors.CrossEncoderRerankerInferenceTest.xml service/target/surefire-reports/TEST-dev.nexus.service.RerankStageIntegrationTest.xml"
lab_runs_ci_line = true
script = "scripts/assert_rerank_inference_ran.py"
after = ["engine-main-suite", "engine-integration-group"]
twin = "conditional"
host = "chas-test or qwent-test"
gap = "The two classes Assumptions-skip unless the ms-marco cross-encoder ONNX is primed (.github/actions/prime-crossencoder-onnx). Whether the lab hosts hold it is not recorded here; on a host without it the assert fails, and that red is the finding (the gate did not run), not a pass to wave through."
command = [
  "python3 scripts/assert_rerank_inference_ran.py service/target/surefire-reports/TEST-dev.nexus.service.vectors.CrossEncoderRerankerInferenceTest.xml service/target/surefire-reports/TEST-dev.nexus.service.RerankStageIntegrationTest.xml",
]

[[check]]
id = "bge-gates-ran"
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Assert bge-768 model-dependent gates actually ran (not skipped)"
run_contains = "python3 scripts/assert_bge_gates_ran.py service/target/surefire-reports/TEST-dev.nexus.service.Bge768ParityTest.xml service/target/surefire-reports/TEST-dev.nexus.service.vectors.Bge768BatchCompositionTest.xml"
lab_runs_ci_line = true
script = "scripts/assert_bge_gates_ran.py"
after = ["engine-main-suite"]
twin = "conditional"
host = "chas-test or qwent-test"
gap = "Bge768ParityTest and Bge768BatchCompositionTest Assumptions-skip unless the fp32 bge ONNX is primed (.github/actions/prime-bge-onnx). Same reading as rerank-inference-ran: a red here says the gate did not run on this host."
command = [
  "python3 scripts/assert_bge_gates_ran.py service/target/surefire-reports/TEST-dev.nexus.service.Bge768ParityTest.xml service/target/surefire-reports/TEST-dev.nexus.service.vectors.Bge768BatchCompositionTest.xml",
]

[[check]]
id = "native-jar-listing"
workflow = "service-ci.yml"
job = "java-test-and-drift-guard"
step = "Native jar listing matches the resolved jars"
run_contains = "python3 scripts/native_jar_listing.py --check"
lab_runs_ci_line = true
script = "scripts/native_jar_listing.py"
after = ["engine-main-suite"]
twin = "exact"
host = "chas-test or qwent-test"
note = "Reads the onnxruntime and DJL tokenizer jars in the host's ~/.m2, which the engine suite resolves; fails loudly when they are absent."
command = [
  "python3 scripts/native_jar_listing.py --check",
]

[[check]]
id = "native-embedded-resources"
workflow = "ci.yml"
job = "engine-service-build"
step = "Check the embedded native resources (nexus-vwfc0)"
run_contains = "python3 scripts/check_native_embedded_resources.py"
script = "scripts/check_native_embedded_resources.py"
after = ["engine-main-suite"]
twin = "partial"
host = "chas-test or qwent-test (first command), laptop worktree (second)"
gap = "chas has no GraalVM, so no native image is built and no embedded-resources.json exists to check. The twin is the JVM-side census of the resource config (ResourceConfigCensusTest, also part of the engine main suite) plus the checker's own unit tests; it does not read a real binary's report or the build-order lines. A lane that changes service/pom.xml's -H:IncludeResources patterns, the native-image resource config or the checker's inputs takes the PR trip-wire 'engine-service native build (PR trip-wire)' (or the engine-release Step 3f dispatch run) as the verdict on a real binary, after the push."
command = [
  "scripts/mvnw-leased.sh --lab-run lab-m -B test -Dtest=ResourceConfigCensusTest",
  "lab-remote -c lab-m --fetch native-resources-status.json -- env NX_TEST_T2_SUBSTRATE=none python3 scripts/watched_pytest.py --stall 180 --status native-resources-status.json -- uv run pytest tests/scripts/test_check_native_embedded_resources.py",
]

[[check]]
id = "pipefail-lint"
workflow = "ci.yml"
job = "test-lint"
step = "Run lint-marked tests"
run_contains = "pytest -m lint"
after = []
twin = "partial"
host = "laptop worktree"
gap = "CI runs the whole lint bucket (about 2,100 tests in two hosted groups); this runs the one test file. Another lint-marked test a lane's diff reaches (a census, a frontmatter or hook lint) is not run here: checklist 0a's `scripts/meta_tests.py run --base <tip>` selects those by diff reach, and develop CI runs the rest."
note = "The default addopts deselect `lint` everywhere else, so nothing in an ordinary hand run reaches this test. It scans every shell script with pipefail (it went red on service/native-smoke.sh), so run it on any lane that touches a .sh file. It is substrate-free, so no gate jar is needed."
command = [
  "lab-remote -c lab-m --fetch pipefail-lint-status.json -- env NX_TEST_T2_SUBSTRATE=none python3 scripts/watched_pytest.py --stall 180 --status pipefail-lint-status.json -- uv run pytest -m lint tests/test_pipefail_early_exit_consumer_lint.py",
]

[[check]]
id = "ca3-live-test"
workflow = "ci.yml"
job = "ca3-pgvector-bundle"
step = "Run CA-3 live test (asserts it actually ran, not skipped)"
run_contains = "scripts/assert_ca3_ran.py ca3.xml"
script = "scripts/assert_ca3_ran.py"
after = ["ca3-bundle-build"]
twin = "conditional"
host = "chas-test or qwent-test (needs docker)"
gated_by = "ca3_core"
gate_job = "ca3-pgvector-bundle"
lane_paths_hit = ["service/src/main/resources/db/changelog/db.changelog-master.xml"]
gap = "Transcribed from CI's steps and not yet run on a lab host: the first live run comes with the next changeset lane. It needs docker and the manylinux image, and the from-source bundle build (ca3-bundle-build) first."
note = "ca3_core includes the Liquibase changelog tree, so every changeset lane triggers this job on the develop push."
command = [
  "uv sync -q --group dev",
  'lab-run -c lab-m -- env NEXUS_CA3_BUNDLE="$PWD/bundle" python3 scripts/watched_pytest.py --stall 180 --status ca3-live-status.json -- uv run pytest tests/db/test_pg_provision_ca3_bundle.py -o addopts= -m integration -rs --junit-xml=ca3.xml',
  "uv run python scripts/assert_ca3_ran.py ca3.xml",
]
also_covers = ["tests/db/test_pg_provision_ca3_bundle.py"]

[[check]]
id = "ca3-liquibase-bundle-smoke"
workflow = "ci.yml"
job = "ca3-pgvector-bundle"
step = "Liquibase-against-bundle smoke (nexus-ywts8, linux-amd64 only)"
run_contains = "bash scripts/liquibase_bundle_smoke.sh"
script = "scripts/liquibase_bundle_smoke.sh"
after = ["ca3-bundle-build"]
twin = "conditional"
host = "chas-test or qwent-test (needs docker and the liquibase/liquibase:4.31 image)"
gated_by = "ca3_core"
gate_job = "ca3-pgvector-bundle"
lane_paths_hit = ["service/src/main/resources/db/changelog/db.changelog-master.xml", "service/src/main/resources/db/changelog/vectors-081.xml"]
gap = "Transcribed from CI's step and not yet run on a lab host: the first live run comes with the next changeset lane. It applies the full changelog to the lean from-source bundle PG (ICU-less, --no-locale, no zlib/readline/openssl), which the engine suite's Testcontainers PG is not, so a green engine suite does not cover it."
note = "ca3_core includes service/src/main/resources/db/changelog/**, so every changeset lane triggers it on the develop push."
command = [
  "uv sync -q --group dev",
  'lab-run -c lab-m -- env NEXUS_CA3_BUNDLE="$PWD/bundle" bash scripts/liquibase_bundle_smoke.sh',
]

# ---------------------------------------------------------------- gates no CI workflow runs

[[check]]
id = "upgrade-boot-writes-leg-a"
twin = "exact"
host = "chas-test or qwent-test, on the Linux host by name (the harness reads /proc; hellmini cannot run it)"
note = "Not a CI step: .claude/skills/engine-release Step 3h runs it at the cut. A lane runs leg A on its stack tip so an upgrade that rewrites user data at boot shows before the cut. NX_GATE_JAR_CACHE=off (the switch scripts/build-gate-jar.sh reads) forces the gate jar to be built at this tip: a cache hit reuses an earlier build_ref, and --new-jar-commit must name the commit the jar carries. PREV is the newest released conexus client (v8.5.6 on 2026-11-25, `git tag -l 'v8.5*'`): re-check it at each use. Legs B and C stay with the cut."
command = [
  "PREV=8.5.6",
  "uv sync -q",
  "NX_GATE_JAR_CACHE=off NX_BUILD_LEASE_WAIT=28800 scripts/build-gate-jar.sh --lab-run lab-m",
  "mkdir -p output/gate",
  "lab-run -c lab-m -- uv run python scripts/upgrade_boot_writes.py --prev-client $PREV --new-jar-commit $(git rev-parse HEAD) --ceiling-boot 67108864 --ceiling-reboot 67108864 --json output/gate/A.json",
]

# ---------------------------------------------------------------- script-less CI steps

# CI steps that run no repo script, so the sweep cannot see a new one; these are named on purpose.

[[script_less]]
workflow = "ci.yml"
job = "lint"
step = "Lint src/ with ruff"
run_contains = "uvx ruff@0.15.18 check src/"
reason = "Hand-runnable and cheap as written: `uvx ruff@0.15.18 check src/`; the pre-push-review skill runs ruff on touched files."

[[script_less]]
workflow = "ci.yml"
job = "test-mode-census"
step = "Run the mode-declarations census against the FULL unsharded corpus"
run_contains = "NX_CENSUS_ONLY_JOB=1 uv run pytest tests/ -q"
reason = "Hand path in tests/AGENTS.md: `NX_CENSUS_ONLY_JOB=1 NX_TEST_T2_SUBSTRATE=none uv run pytest tests/ -q`. Checklist 3-6b leaves it to develop CI unless 2f selects it."

[[script_less]]
workflow = "ci.yml"
job = "test-integration-affected"
step = "Verify the jar passes the fixtures' own stamp check"
run_contains = "unstamped_jar_skip_reason"
reason = "CI's Python integration shards only; a lane's gate jar comes from scripts/build-gate-jar.sh, which stamps it."

[[script_less]]
workflow = "ci.yml"
job = "test-lint"
step = "Enforce lint-leg non-vacuity floor"
run_contains = "-ge 200"
reason = "A passed-count floor over CI's own lint run; the pipefail twin reads its own pytest summary."

[[script_less]]
workflow = "ci.yml"
job = "test"
step = "Executed-count floor (nexus-lemv5 — a shard that skipped its corpus must not report green)"
run_contains = "-ge 1500"
reason = "A per-shard passed-count floor over CI's own shard output; a hand run reads its own summary."

