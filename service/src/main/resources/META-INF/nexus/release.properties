# RDR-002 release_version contract (conexus PR #78).
#
# release_version is the engine-service RELEASE identity, distinct from the
# Maven app_version (which stays 1.0-SNAPSHOT — the dev coordinate). It is
# STAMPED at native-build time by the engine-service-release workflow from the
# engine-service-vX.Y.Z tag (tag minus the 'engine-service-v' prefix).
#
# Left BLANK in source / on dev + workflow_dispatch builds: VersionHandler then
# reports release_version=null on /version, and an RDR-002 version-pin consumer
# (nx guided-upgrade ez5.4) fail-closes — an engine with no stamped release is
# by definition not a release >= the required floor.
release_version=

# nexus-308ph: a per-run artifact-identity discriminator, distinct from
# release_version. release_version is IDENTICAL between a pinned release
# binary and a freshly-stamped dev jar built against the same floor — it
# cannot tell them apart. build_ref is stamped fresh on every
# scripts/build-gate-jar.sh / local-service-gate.sh invocation as
# <git short sha>+<per-run nonce>, so only the artifact built by THIS gate
# run can ever match a value THIS run expects. Left BLANK in source and on
# every native-release build (never stamped by the engine-service-release
# workflow): VersionHandler omits the field entirely (never null/empty) when
# blank, so pinned releases built before this change stay shape-identical on
# /version.
build_ref=
