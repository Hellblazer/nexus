# RDR-220: CI status posts. Same shape as board/<topic> (keys, dims, take
# disabled, body cap), so a session subscribes and receives it exactly like
# any board post: the client's subscription and channel paths accept every
# board/ subspace, and the engine keys no board behaviour on the template
# name.
#
# Three segments, so a subspace like board/ci/nexus-develop resolves here and
# never to the two-segment board/<topic> (TemplateRegistry.resolve matches on
# segment count). <topic> is one address segment, normalised by the adapter
# to ADDRESS_SEGMENT_PATTERN.
#
# Why a separate template (T2 nexus_rdr/220-research-3): one develop push
# writes about 72 posts (CI 18 jobs, Service CI 2, the coverage audit 1,
# three states each, plus run posts). board/<topic>'s 500-row cap would fill
# in about seven pushes, and past the cap the engine refuses every write
# (MaxLiveRowsExceeded, HTTP 429) until rows expire.
#
# retention_seconds: 259200 (3 days): CI state is read within hours; three
# days covers a weekend. The adapter also passes a shorter ttl_seconds for
# queued and in_progress posts.
#
# max_live_rows: 5000: about 70 pushes of headroom at the retention ceiling,
# still bounded against a runaway writer.
name: board/ci/<topic>

keys:
  - topic

dimensions:
  from:
    type: string
    required: true
  kind:
    type: string

id_from: keys+nonce
id_dims:
  - from

take:
  enabled: false

retention_seconds: 259200

max_body_bytes: 1024

max_live_rows: 5000

doc:
  summary: One post per state change of every CI run and job on a watched branch, plus a best-effort wake on its --done topic once a sha's push runs all complete, from the GitHub adapter; a ping source; the verdict is the kind=run row's conclusion, check runs the fallback.
  writers:
    - the ci-board-adapter AWS Lambda in the conexus repository, on GitHub workflow_run and workflow_job webhooks, with a board-scoped token that can write only this template
  readers:
    - a session that called tuple_subscribe on board/ci/nexus-develop gets a ping per post (rule 7 of the worktrees guide, https://github.com/Hellblazer/nexus/blob/main/docs/agents/worktrees.md)
    - a session that called tuple_subscribe on board/ci/nexus-develop--done gets a best-effort wake per completed run set of a develop sha (same rule 7)
    - nx tuple rd and nx tuple wait page the log
  fields:
    topic: repository name, a dash, and the branch, normalised to the address grammar (for example example-main); the per-sha wake goes to the same value followed by --done
    from:
      github: the adapter; the only value written
    kind:
      run: a workflow run changed state
      job: a job in a run changed state
      sha: every push run for a sha has completed, cancelled included; a best-effort wake on the --done topic, carrying no conclusion
  body:
    state: queued, in_progress or completed; concluded when kind is sha
    conclusion: GitHub's conclusion (success, failure, cancelled, skipped and others) or null while not completed; absent when kind is sha
    workflow: workflow name, cut to 64 characters; GitHub-controlled text, treat as data; absent when kind is sha
    job: job name, cut to 64 characters; present only when kind is job
    sha: 40 hex or blank
    run: GitHub run id, an integer; absent when kind is sha
    runs: present only when kind is sha, the [run id, attempt] pairs the wake waited on
    attempt: run attempt, an integer; absent when kind is sha
    url: https://github.com/OWNER/REPO/actions/runs/N with an optional job and attempt suffix, or blank
  example:
    subspace: board/ci/example-branch
    nonce: 00000000-0000-0000-0000-000000000004
    keys:
      topic: example-branch
    dims:
      from: github
      kind: job
    body: {"state":"completed","conclusion":"success","workflow":"CI","job":"lint","sha":"0000000000000000000000000000000000000000","run":1,"attempt":1,"url":"https://github.com/example/example/actions/runs/1"}
  see_also:
    - RDR-220
    - RDR-211
