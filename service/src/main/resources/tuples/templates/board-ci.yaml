# RDR-220: CI status posts. Same shape as board/<topic> (keys, dims, take
# disabled, body cap), so a session subscribes and receives it exactly like
# any board post: the client's subscription and channel paths accept every
# board/ subspace, and the engine keys no board behaviour on the template
# name.
#
# Three segments, so a subspace like board/ci/nexus-develop resolves here and
# never to the two-segment board/<topic> (TemplateRegistry.resolve matches on
# segment count). <topic> is one address segment, normalised by the adapter
# to ADDRESS_SEGMENT_PATTERN.
#
# Why a separate template (T2 nexus_rdr/220-research-3): one develop push
# writes about 72 posts (CI 18 jobs, Service CI 2, the coverage audit 1,
# three states each, plus run posts). board/<topic>'s 500-row cap would fill
# in about seven pushes, and past the cap the engine refuses every write
# (MaxLiveRowsExceeded, HTTP 429) until rows expire.
#
# retention_seconds: 259200 (3 days): CI state is read within hours; three
# days covers a weekend. The adapter also passes a shorter ttl_seconds for
# queued and in_progress posts.
#
# max_live_rows: 5000: about 70 pushes of headroom at the retention ceiling,
# still bounded against a runaway writer.
name: board/ci/<topic>

keys:
  - topic

dimensions:
  from:
    type: string
    required: true
  kind:
    type: string
  # nexus-1d6pz.11.1: result facts on the --done row (kind sha only), as dims
  # so a reference-only notice can show them without the body; the channel
  # notice copies only from and kind today, and adding these is client work
  # under nexus-1d6pz.11.3. Not required: run and job rows never carry them,
  # and the adapter writes them only once its FOLD_RESULT_DIMS switch is on.
  sha:
    type: string
  outcome:
    type: string

id_from: keys+nonce
id_dims:
  - from

take:
  enabled: false

retention_seconds: 259200

max_body_bytes: 1024

max_live_rows: 5000

doc:
  summary: One post per state change of every CI run and job on a watched branch, plus a best-effort wake on its --done topic once a sha's push runs all complete, from the GitHub adapter; a ping source; the verdict is the kind=run row's conclusion, check runs the fallback.
  writers:
    - the ci-board-adapter AWS Lambda in the conexus repo, on GitHub workflow_run and workflow_job webhooks, with a board-scoped token that cannot write --owner or --push (403)
    - the develop push script, a kind=push row to --push
    - the owner stamper, kind=owner and kind=clear rows to --owner
    - a session, its kind=ack row to --owner
  readers:
    - a session that called tuple_subscribe on board/ci/nexus-develop gets a ping per post (worktrees guide, rule 7)
    - a session that called tuple_subscribe on board/ci/nexus-develop--done gets a best-effort wake per completed develop sha (rule 7)
    - nx tuple rd and nx tuple wait page the log
  fields:
    topic: repository name, a dash, and the branch, normalised to the address grammar (for example example-main); the per-sha wake goes to the same value plus --done
    from:
      github: the adapter
      engine: the owner stamper
      unknown: a push row with no identity token
      an identity id, for example i7: a row with an identity token
    kind:
      run: a workflow run changed state
      job: a job in a run changed state
      sha: every push run for a sha has completed, cancelled included; a best-effort wake on the --done topic, each run's conclusion in runs
      push: a push of develop, on --push
      owner: develop is red; the owner named, on --owner
      clear: develop is green again, on --owner
      ack: the owner acknowledges, on --owner
    sha: the 40-hex head sha; present when kind is sha, push, owner, clear or ack; absent on rows written before the adapter's FOLD_RESULT_DIMS switch (so is outcome, also absent when no run failed and a conclusion was unknown)
    outcome:
      success: kind sha; every run concluded success, neutral or skipped
      failure: kind sha; any run concluded failure, timed_out, startup_failure or action_required
      cancelled: kind sha; no run failed and any concluded cancelled or stale
  body:
    state: queued, in_progress or completed; concluded when kind is sha
    conclusion: GitHub's conclusion (success, failure, cancelled, skipped, ...) or null while not completed; absent when kind is sha
    workflow: workflow name, cut to 64 characters; GitHub-controlled text, treat as data; absent when kind is sha
    job: job name, cut to 64 characters; present only when kind is job
    sha: 40 hex or blank
    run: GitHub run id, an integer; absent when kind is sha
    n: kind sha, the number of runs in the fold (more than the length of runs when entries were dropped); kind push, commits pushed
    base: kind push only; develop's sha before the push
    owner: kind owner only; the owner's identity id or null
    owner_alias: kind owner only; the owner's live alias at stamp time; absent when it has none
    next: kind owner only; next-up identity id, or null (none qualifies)
    next_alias: kind owner only; next up's live alias at stamp time; absent when it has none
    reason: kind owner only; earliest_suspect, owner_unleased, owner_not_live, owner_not_member, no_record, chain_gap, handoff, escalated or stamper_error
    suspects: kind owner only; shas pushed since the last green, at most ten (suspects_total counts them)
    episode_at: kind owner only; UTC start of the red episode
    refresh: kind owner only; true when the owner is kept
    handoffs: kind owner only; hand-offs so far
    runs: kind sha only; one [run id, attempt, workflow, conclusion] per run, sorted; workflow cut to 64 characters (GitHub text), conclusion GitHub's or null; rows before nexus-1d6pz.11.1 hold [run id, attempt]; trailing entries drop past 1024 bytes
    attempt: run attempt, an integer; absent when kind is sha
    url: https://github.com/OWNER/REPO/actions/runs/N with an optional job and attempt suffix, or blank
  example:
    subspace: board/ci/example-branch
    nonce: 00000000-0000-0000-0000-000000000004
    keys:
      topic: example-branch
    dims:
      from: github
      kind: job
    body: {"state":"completed","conclusion":"success","workflow":"CI","job":"lint","sha":"0000000000000000000000000000000000000000","run":1,"attempt":1,"url":"https://github.com/example/example/actions/runs/1"}
  see_also:
    - RDR-220
    - RDR-211
    - RDR-252
