# RDR-205 v1 template: agent/instance/session mailbox messages.
#
# The nonce in id_from is a sender-minted message id; "from" also enters
# the id (id_dims) and so must be declared required.
#
# address_kind (RDR-208 Phase 1 Step 2, bead nexus-galkv.2): agent (a
# named subagent), instance (a Claude Code instance name), or session (a
# session-id mailbox, RDR-208's own addressing scheme). instance is
# retired after RDR-208 Phase 3 -- kept in the values list through the
# migration window, removed once every sender addresses by session.
name: mailbox/<address>

keys:
  - to

dimensions:
  from:
    type: string
    required: true
  kind:
    type: string
  correlation_id:
    type: string
  address_kind:
    type: string
    values: [agent, instance, session]

id_from: keys+nonce
id_dims:
  - from

take:
  enabled: true
  max_attempts: 3
  max_lease_seconds: 900

retention_seconds: 604800
