# RDR-253 Phase 1 Step 1 template (bead nexus-hczdo.1.1): background work and resources an identity owns.
#
# A label, not a fenced family (RDR-253: a lab run on another host has no token file). One row per
# (identity, kind, ref); the writer updates state by writing a new row with a new nonce, and the older row
# ages out. Retention of an identity deletes its work rows at once.
name: work/<id>

keys:
  - id

dimensions:
  kind:
    type: string
    required: true
    values: [watcher, wait, labrun, worktree, tmux]
  ref:
    type: string
    required: true
  state:
    type: string
    required: true
    values: [running, done]

id_from: keys+nonce
id_dims:
  - kind
  - ref

take:
  enabled: false

retention_seconds: 2592000

max_body_bytes: 0

doc:
  summary: A background watcher, wait, lab run, worktree or tmux server that an identity owns, so a checkpoint can list it after a /clear.
  writers:
    - Unverified: the identity's own session, once RDR-253 Step 6 registers what a session owns; until then no client writes it
  readers:
    - Unverified: the checkpoint, worktree removal, the sandbox and tmux cleanup helpers and the restart readiness check, once RDR-253 Step 6 moves them onto it
  fields:
    id: the identity id, i followed by a number; the same as the subspace's last segment
    kind:
      watcher: a background watcher process
      wait: a wait on a peer or a build
      labrun: a run on a lab pool host
      worktree: a git worktree the identity created
      tmux: a tmux server the identity started
    ref: a path, a server name or a run id, whatever names the work
    state:
      running: the work is still going
      done: the work finished
  example:
    subspace: work/example-seat
    nonce: example-run-1
    keys:
      id: example-seat
    dims:
      kind: worktree
      ref: example/worktree-path
      state: running
  see_also:
    - RDR-253
