# The SQL the per-leaf FK tests (nexus-p2m1x.21) send that has no typed jOOQ form: locks, SET, DDL of roles and databases, ADD and VALIDATE CONSTRAINT.
# Kept here and not as Java literals (SqlStringLiteralGateTest counts those); read by P33cSql#stmt, filled with String.format. The production
# on_complete texts these tests run come from the registry, never from this file.
lock.table=LOCK TABLE %s IN %s MODE
set.local=SET LOCAL %s = %s
set.role=SET ROLE %s
sleep=SELECT pg_sleep(%s)
validate.constraint=ALTER TABLE %s VALIDATE CONSTRAINT %s
add.fk.not.valid=ALTER TABLE %s ADD CONSTRAINT %s %s NOT VALID
add.fk=ALTER TABLE %s ADD CONSTRAINT %s FOREIGN KEY %s REFERENCES nexus.catalog_collections %s %s
add.parent=ALTER TABLE nexus.chunks ADD CONSTRAINT %s
drop.constraint=ALTER TABLE %s DROP CONSTRAINT %s
drop.index=DROP INDEX IF EXISTS %s
create.dl.table=CREATE TABLE IF NOT EXISTS nexus.%s (x int)
drop.dl.tables=DROP TABLE IF EXISTS nexus.p33c_dl_a, nexus.p33c_dl_b
create.database=CREATE DATABASE %s
drop.database.force=DROP DATABASE IF EXISTS %s WITH (FORCE)
create.role=CREATE ROLE %s LOGIN PASSWORD '%s'
drop.role=DROP ROLE IF EXISTS %s
grant.schema.usage=GRANT USAGE ON SCHEMA nexus TO %s
grant.select.references=GRANT SELECT, REFERENCES ON nexus.catalog_collections TO %s
revoke.registry=REVOKE ALL ON nexus.catalog_collections FROM %s
revoke.schema=REVOKE ALL ON SCHEMA nexus FROM %s
create.scratch=CREATE TABLE nexus.%s AS SELECT r.tenant_id, r.collection_id, r.embedding_model FROM nexus.catalog_collections r CROSS JOIN generate_series(1, 20) g
alter.owner=ALTER TABLE nexus.%s OWNER TO %s
drop.table=DROP TABLE IF EXISTS nexus.%s
