# java.util.logging config for the surefire/failsafe test forks ONLY (service/pom.xml,
# maven-surefire-plugin argLine; nexus-km7ma). Liquibase logs through JUL, one INFO line
# per step of every migration walk, and every test class migrates its own database: a
# main-suite run printed 32 MB of it to the console and again into the surefire XML.
# WARNING and above still print. The production engine never reads this file: it is a
# test resource and nothing but the test-fork argLine points at it.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
liquibase.level=WARNING
