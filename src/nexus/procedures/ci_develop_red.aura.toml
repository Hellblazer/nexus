aura = "ci_develop_red"
summary = "A red CI sha on a branch the group serves and who owns it, posted to this session's threads entry; wakes the owner; next up is shown it and woken by ci_develop_nudge."
procedure = "ci_red_notice"

[trigger]
subspace = "board/ci/{serves}--owner"
match = { kind = "owner", from = "engine" }

[args]
sha = "dims.sha"
branch = "self.branch"
owner = "body.owner"
owner_alias = "body.owner_alias"
next = "body.next"
next_alias = "body.next_alias"
refresh = "body.refresh"
reason = "body.reason"
stalled = "body.stalled"
stalled_owner = "body.stalled_owner"
stalled_since = "body.stalled_since"
stalled_sign = "body.stalled_sign"
open_minutes = "body.open_minutes"
previous_owner = "body.previous_owner"
me = "self.identity"

[when]
field = "show"

[clear]
match = { kind = "clear", from = "engine" }

[display]
channel = "wake"
threads = "{branch} CI red ({base})"
