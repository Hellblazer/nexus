aura = "ci_develop_red"
summary = "A red develop sha and who owns it, posted to this session's threads entry; wakes the owner; next up is shown it and woken by ci_develop_nudge."
procedure = "ci_red_notice"

[load]
group = "push-train"

[trigger]
subspace = "board/ci/nexus-develop--owner"
match = { kind = "owner", from = "engine" }

[args]
sha = "dims.sha"
owner = "body.owner"
owner_alias = "body.owner_alias"
next = "body.next"
next_alias = "body.next_alias"
refresh = "body.refresh"
reason = "body.reason"
stalled = "body.stalled"
stalled_owner = "body.stalled_owner"
stalled_since = "body.stalled_since"
red_since = "body.red_since"
me = "self.identity"

[when]
field = "show"

[clear]
match = { kind = "clear", from = "engine" }

[display]
channel = "wake"
threads = "develop CI red"
