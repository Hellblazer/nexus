# RDR-238 Phase 1 Step 1 (nexus-qo7ie.6): the AUDIT_TAGS table. One set of tags
# that mark a T2 row as an audit record (a gate, a critique, a research finding,
# a fix check, a commit review). Ships inside the package (src/nexus/tables/)
# like review-rounds.toml; load it through nexus.tables.audit_tags.
#
# WHO READS IT. The engine refuses a `replaces` put whose target carries any of
# these tags, or whose title matches a pattern in [audit] below
# (MemoryRepository.replaceMemory). The Java mirror is
# service/.../db/AuditTags.java, generated by scripts/gen_audit_tags_java.py.
# `nx memory curate --t2` (Phase 3) lists replacement candidates and skips rows
# carrying them, from the same set. Nothing else holds a copy.
#
# NORMALISATION (nexus-qo7ie.3 residual K4; Python and Java apply it alike).
# A row's tags are one string. A tag is whole when it is one comma-separated
# element of that string. The rule: split on ',', trim each element (remove
# leading and trailing characters at or below U+0020, space and the ASCII
# controls, exactly Java's String.trim(); a non-breaking space is not trimmed),
# drop empty elements, and compare each element for exact, case-sensitive
# equality with a tag below. Matching is by whole tag, never by substring:
# "gates", "research-notes" and "kind:gate-x" are not audit tags. Case is exact:
# "Gate" is not "gate". A space is not a separator: "kind:gate bead:x" is one
# element, and it is not an audit tag. Only the tags string is read; a row whose
# body mentions kind:gate with clean tags is not an audit record.
#
# TITLE BACKSTOP (nexus-qo7ie.3 residual K4, Sam chose option a). Older audit
# rows carry no tag (RDR-209 records about 23 percent of older gate records
# untagged), so the engine ALSO refuses a replaces whose target's TITLE matches
# any pattern in [audit] title_patterns below, even with clean tags. The
# matching rule, stated here and in the Java javadoc: each entry is one regular
# expression, matched anywhere in the title (a search, not a full match),
# case-insensitively and ASCII-only (Java CASE_INSENSITIVE | UNIX_LINES;
# Python re.I|re.A; UNIX_LINES makes Java's $ match only before a final \n,
# as Python's does). A token pattern is a whole word bounded by the start or
# end of the title or by one of '-', '_', '.', ':' or a space on each side, so
# "review" matches "code-review-x", "x_review", "nexus-1si7z-code-review.md",
# "gate:x" and "review of x" but not "reviewer-notes" or "preview". The -research-N
# pattern ends the title or is followed by
# '.', ':' or a space (232-research-24.md, "232-research-3: method"). No entry may put a quantifier (star, plus,
# brace) after a group: Java's regex engine recurses per character on such a
# group and overflows the stack. The (^|[-_.: ]) prefix is a group with no
# quantifier, which is safe. A false refusal is the safe
# direction: the writer falls back to a plain put, so a pattern may catch an
# ordinary note (gate-jar-howto) and cost one extra step, never data.
#
# The list is deliberately tokens, not a full audit vocabulary. Measured on the
# 7,853 titles of projects nexus and nexus_rdr (2026-11-01, read-only): the
# first seven entries caught 1,939 of 2,266 audit-tagged rows and 2,494 of
# 5,587 untagged rows. confirm and audit were then added for confirm-* and
# plan-audit/audit-* titles. *-fix-round-* titles are left replaceable on
# purpose: they are the implementer-note chains the feature exists for.
#
# KIND. A total lookup, tag -> row, with no guard dimension: "state-machine",
# the checker's kind without the guard obligation (see chunk-metadata-keys.toml).
# One row per line on purpose: the Java pin (AuditTagsTest) reads this file with
# a line parser, not a TOML library.

[table]
id = "audit-tags"
kind = "state-machine"
version = 1

[dimensions.tag]
domain = ["kind:gate", "gate", "critique", "research", "fix-check", "commit-review"]

[[row]]
id = "kind-gate"
match = { tag = "kind:gate" }
emit = { series = "gate records, matched as RDR-209 Phase 3 Step 0 matches kind:gate" }

[[row]]
id = "gate"
match = { tag = "gate" }
emit = { series = "gate records written without the kind: prefix" }

[[row]]
id = "critique"
match = { tag = "critique" }
emit = { series = "gate and substantive-critic critiques" }

[[row]]
id = "research"
match = { tag = "research" }
emit = { series = "RDR research findings" }

[[row]]
id = "fix-check"
match = { tag = "fix-check" }
emit = { series = "RDR fix-check records" }

[[row]]
id = "commit-review"
match = { tag = "commit-review" }
emit = { series = "per-commit review records (inferred from titles, RDR-238 research 3)" }

[audit]
# Title patterns, one per line: the Java pin (AuditTagsTest) reads this array
# with a line parser, so keep one quoted string per line and no comments inside.
title_patterns = [
  "(^|[-_.: ])review([-_.: ]|$)",
  "(^|[-_.: ])code-review([-_.: ]|$)",
  "(^|[-_.: ])commit-review([-_.: ]|$)",
  "(^|[-_.: ])critique([-_.: ]|$)",
  "(^|[-_.: ])gate([-_.: ]|$)",
  "(^|[-_.: ])fix-check([-_.: ]|$)",
  "-research-[0-9]+([.: ]|$)",
  "(^|[-_.: ])confirm([-_.: ]|$)",
  "(^|[-_.: ])audit([-_.: ]|$)",
  "(^|[-_.: ])critic([-_.: ]|$)",
  "(^|[-_.: ])confirmation([-_.: ]|$)",
  "(^|[-_.: ])rereview([-_.: ]|$)",
  "(^|[-_.: ])codereview([-_.: ]|$)",
  "(^|[-_.: ])fixcheck([-_.: ]|$)",
]
