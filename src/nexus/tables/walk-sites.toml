# RDR-241 Phase 1 Step 1 (nexus-uwggq.1.1): the walk-site table, the checked form of the
# RDR's section "The ratchet". Ships inside the package (src/nexus/tables/) like
# chunk-metadata-keys.toml; load it through nexus.tables.walk_sites.
#
# One row per function in src/nexus that calls all_documents, keyed
# "<path under src/nexus>::<qualified function>" (no line number: it moves on every edit).
# This is a RATCHET and its direction is down: tests/test_walk_site_ratchet.py parses
# src/nexus with ast and holds the source and this table to an exact match. A call in a
# function not listed here is a finding, a row whose function has no call is a finding, and a
# `calls` value that differs from the scan, up or down, is a finding. So a walk is added by
# editing this table where a reviewer sees it, and the commit that switches a walk to a route
# lowers or deletes its row. Never add a row to make the lint pass: read the rows from a route.
#
# emit fields
#   class   why the call exists (closed set, see nexus.tables.walk_sites.CLASSES):
#             AGGREGATE  the caller wants a derived answer; a route should give it.
#             BULK JOB   the caller must visit every document; stays a walk.
#             BOUNDED    one bounded page, or only a bounded mode of the call.
#   calls   how many all_documents calls the function holds (the scan counts ast.Call nodes
#           whose callee is an attribute or a name `all_documents`; enumerate_all_documents is
#           another name and is not counted).
#   reason  one sentence: what the function does with the rows. The four wrappers
#           (enumerate_all_documents, _all_entries, _entries_of_type, reference_only_candidates)
#           are ordinary rows and name their callers here, because a new caller of a wrapper
#           escapes the scan.
#   next    optional: the bead that removes or lowers the row.
#
# Frozen on 2e09b8cfc: 25 sites, 28 calls, 19 files. Forecast (RDR-241): 21 calls after
# Phase 1, 18 after Phase 2.
#
# KIND. A total lookup, site -> row, with no guard dimension: "state-machine" is the checker's
# kind without the guard obligation (the same choice chunk-metadata-keys.toml makes). What the
# checker proves is match totality (every listed site is named by a row) and no overlap.

[table]
id = "walk-sites"
kind = "state-machine"
version = 1

[dimensions.site]
domain = [
  "catalog/link_generator.py::_all_entries",
  "catalog/link_generator.py::_entries_of_type",
  "catalog/meta_backfill.py::backfill_meta",
  "catalog/recovery_bundle.py::enumerate_all_documents",
  "catalog/sensitivity_doctor.py::_walk_sensitive",
  "commands/catalog.py::list_cmd",
  "commands/catalog.py::reconcile_cmd",
  "commands/catalog_cmds/backfill.py::backfill_source_uri_cmd",
  "commands/catalog_cmds/backfill.py::backfill_etags_cmd",
  "commands/catalog_cmds/doctor.py::_run_store_put_integrity",
  "commands/catalog_cmds/integrity.py::_audit_membership_all",
  "commands/catalog_cmds/integrity.py::_verify_full",
  "commands/catalog_cmds/maintenance.py::gc_cmd",
  "commands/catalog_cmds/reconcile_fences.py::reconcile_fences",
  "commands/catalog_cmds/reconcile_stale.py::_classify",
  "commands/catalog_cmds/remediation.py::prune_stale_cmd",
  "commands/catalog_cmds/remediation.py::remediate_paths_cmd",
  "commands/catalog_cmds/sensitivity.py::_targets",
  "commands/enrich.py::_aspect_bearing_collections",
  "doctor_references.py::reference_only_candidates",
  "mcp/catalog.py::catalog_list",
  "mcp/catalog.py::catalog_search",
  "operators/sensitive_paths.py::file_tool_restriction",
  "upgrade_ladder/rungs/manifest_section_labels.py::ManifestSectionLabelsRung._scan",
  "upgrade_ladder/rungs/manifest_span_fill.py::ManifestSpanFillRung._scan",
]

