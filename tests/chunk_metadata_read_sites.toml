# RDR-236 Phase 0 (nexus-qyx35): the chunk-row metadata reads of a non-CHUNK key that exist today.
#
# Read by tests/test_chunk_metadata_read_lint.py. One table per `file::function` (the function
# is the dotted class/def chain, no line numbers), one `key = count` per key read there. This
# is a RATCHET and its direction is down: a read not listed is a finding, and a count above
# what the scan finds is a finding too, so the commit that moves a reader to the catalog (or
# the manifest) deletes or lowers its line. Never add a line to make the lint pass: read the
# value from the key's home instead (src/nexus/tables/chunk-metadata-keys.toml, the `home`
# column). The note TTL fallback in src/nexus/catalog/note_ttl.py is exempt from this list, but
# bounded: see [exempt] below.
#
# Some entries are not readers of a shared row at all (the extractor and chunker dicts that
# become a row's metadata, `metadata_schema` itself, the injected T3Database facade). They are
# listed because the scan cannot tell them apart; the epic's Phase 2 and 4 sweep removes them.

# Bare receivers that ARE a chunk row's metadata at the Phase 2 reader sites, so the lint reads
# them too (RDR-236 critique S2). `path` opts a name in for the whole file, `path::qualname` for
# one function and what it nests. Each was read in place: the receiver is a T3 row's metadata,
# not a catalog entry's meta. An entry that matches no read is stale; delete it.
[receivers]
"src/nexus/commands/enrich.py" = ["meta"]
"src/nexus/catalog/orphan_backfill.py" = ["meta"]
"src/nexus/health.py" = ["meta"]
"src/nexus/mcp/core.py::store_get" = ["entry"]
"src/nexus/mcp/core.py::store_get_many" = ["entry"]
"src/nexus/mcp/core.py::store_list" = ["e"]
"src/nexus/exporter.py" = ["meta"]
"src/nexus/catalog/manifest_backfill.py" = ["meta"]
"src/nexus/commands/catalog.py" = ["meta", "m"]
# nexus-6pfgb.10: the backfill verb reads chunk rows by design; every name below is a chunk row's metadata.
"src/nexus/catalog/meta_backfill.py" = ["chosen", "r", "row"]

# src/nexus/catalog/note_ttl.py is the legacy-fallback module (RF-8): exempt from [sites], but it
# may read only catalog_doc_id and title and these counts may only fall.
[exempt]
[exempt."src/nexus/catalog/note_ttl.py::row_may_give_tags"]
catalog_doc_id = 1
title = 1

[exempt."src/nexus/catalog/note_ttl.py::row_names_note"]
