# What one test run may write, in bytes and in DDL statements (nexus-sz651, epic nexus-aca0q).
#
# THE PRIMARY GATED SIGNAL IS DDL PER TEST: an exact count, identical on macOS and Linux for the same tests
# (31881 on both), and the lever that explains the writes. The metrics named `*wal_bytes*` are WAL bytes the
# test clusters generated between the probe's marks (tests/_ddl_counter.py, DdlCounts.java). WAL is a CHURN
# PROXY, not a disk meter: the clusters sit on tmpfs on Linux with headroom, so that WAL lands in memory and
# does NOT reach the NVMe. It is also relative and a lower bound (fsync and full_page_writes are off, the
# Python substrate runs wal_level=minimal), host-dependent (the same tests wrote about 1.8x more on Linux
# than on the laptop) and not comparable between Python and Java. NOT MEASURED: the job workspace/checkout,
# target/, .venv, jar builds, journald, anything before pytest starts, and the docker-run and e2e shell
# clusters. The labrun NVMe sampler is the source of truth
# for bytes written to disk, with the device delta (`cgroup_io` wbytes, which `ddl_ratchet.py fan-in` sums and
# prints; informational, never gated). The `*ddl*` metrics are the DDL
# statement counts that explain the WAL. scripts/ddl_ratchet.py fails a run above a ceiling; ceilings are
# reduce-only: lower one in the commit that lowers the number, raising one needs a reviewed reason in that
# commit's message. A ceiling is only as good as its measurement: see "HOW THE PYTHON NUMBERS WERE
# MEASURED" below for which of them are measurements and which are estimates.
#
# Every metric is INTENSIVE, so it does not move with how the work is split across shards or forks:
#   python_unit    the gate (once armed, see below) is `ddl_ratchet.py fan-in`, which sums every shard's report and judges the whole
#                  run: bytes and DDL per test over all tests, and the migration's bytes and DDL per booted
#                  xdist worker (each worker boots and migrates its own cluster). None of the four moves with
#                  the shard split, with -n, or with a worker that never booted a substrate. One shard's
#                  `check` compares the same four against these same numbers and is ADVISORY (a shard's mix
#                  is not the run's), so it never fails a job.
#   java_*         one mvn run of one suite: the migration's bytes and DDL per fork (each fork migrates
#                  one template), and the rest (clones, dedicated containers, the tests' own work) as totals
#
# Tolerance bands: a bytes metric passes up to ceiling * (1 + bytes_tolerance), a DDL metric up to
# ceiling * (1 + ddl_tolerance), and `<metric>_tolerance` overrides either for one metric.
#
# THE PYTHON GATE IS ADVISORY UNTIL IT IS ARMED. `[python_unit] measured_on` is the marker: while it is
# absent, the CI fan-in runs `--advisory` (prints the whole comparison, exits 0), because the ceilings below
# were not measured on the platform that enforces them. A false red there lands after the whole shard
# matrix, on develop and on the release PR, and cannot be re-run green. tests/scripts/test_ddl_ratchet_wiring.py
# keeps the flag on exactly while the marker is absent. To ARM it, in ONE commit:
#   1. paste the first Linux fan-in line (CI run on develop, pytest-gate log) into nexus-ekp7w;
#   2. set the four python ceilings from that line (DDL and migration are exact; WAL gets its band);
#   3. add `measured_on = "<ci run url or sha>"` under [python_unit];
#   4. drop `--advisory` and the three `continue-on-error` lines from the fan-in steps in
#      .github/workflows/ci.yml, and the `continue-on-error` line on each of the two per-shard steps in
#      the `test` job (the advisory check and the report upload).
# Once armed, a commit that adds a Liquibase changeset bumps migration_ddl_per_worker (tolerance 0) in the
# same commit (tests/AGENTS.md says how; the failure message repeats it).
#
# HOW THE PYTHON NUMBERS WERE OBTAINED (armed 2026-10-20, nexus-ekp7w): three Linux CI fan-ins on develop
# (pool lab-6c18g, 6 shards x 4 workers, pytest-gate log), runs 39344928950 (e615ca68e), 39350826510
# (51e9a4ae3) and 39361935431 (07ca0baf1):
#   wal_bytes_per_test               232037 / 231805 / 232330   ceiling 232400 (max, rounded up; band 0.10)
#   ddl_per_test                     18.7539 / 18.7533 / 18.7416 ceiling 18.76  (band 0.05: the test set moves)
#   migration_wal_bytes_per_worker   11037918 / 11037914 / 11037916 ceiling 11038000. RAISED from 11010048:
#                                    that was a chas hand run, not CI; the enforcing platform measures 0.25% more.
#   migration_ddl_per_worker         2101 on all three, tolerance 0 (the changelog's own count)
# tests 30635-30655, workers_booted 24, total_ddl 624949 on all three. The pre-arming estimates (240000 and
# 19.02 from macOS and chas) are superseded.
#
# "measure" means no measurement exists yet. The check then prints the numbers it just measured and exits
# 11 (not 0), and a ceiling nobody set must not pass a run. The Java sections are still "measure": their
# CI steps are --advisory until the Java DDL cut (nexus-0ty8z) lands, because a ceiling set before it
# would be set at the number that cut removes. Set all four of a Java section together, from one run,
# and drop --advisory from its step in service-ci.yml in the same commit (a lint checks they agree).

[python_unit]
measured_on = "CI 39344928950 (e615ca68e), 39350826510 (51e9a4ae3), 39361935431 (07ca0baf1)"
bytes_tolerance = 0.10
ddl_tolerance = 0.05
wal_bytes_per_test = 232400
ddl_per_test = 18.76
migration_wal_bytes_per_worker = 11038000
migration_ddl_per_worker = 2101
migration_ddl_per_worker_tolerance = 0.0

[java_main]
bytes_tolerance = 0.05
ddl_tolerance = 0.0
migration_wal_bytes_per_fork = "measure"
migration_ddl_per_fork = "measure"
other_wal_bytes = "measure"
other_ddl = "measure"

[java_integration]
bytes_tolerance = 0.05
ddl_tolerance = 0.0
migration_wal_bytes_per_fork = "measure"
migration_ddl_per_fork = "measure"
other_wal_bytes = "measure"
other_ddl = "measure"
