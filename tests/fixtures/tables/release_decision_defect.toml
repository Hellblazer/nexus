# Fixture: release-floor decision table, DEFECT variant. Plants one overlap
# (overlap-x-bare-or-paired vs overlap-y-paired-or-auto, both scoped to
# cloud_vs_floor=equal, both fire wherever mode=paired, and neither
# subsumes the other) and one coverage-gap (the below/paired-auto/
# non-additive-ledger row is missing, leaving 2 of 36 cells uncovered).
# Converted from the enumcheck prototype's models/release_decision_defect.toml.

[table]
id = "release-floor-decision-fixture"
kind = "decision-table"

[dimensions.decision]
domain = ["decide"]

[dimensions.cloud_vs_floor]
domain = ["below", "equal", "above", "unreachable"]

[dimensions.mode]
domain = ["bare", "paired", "paired-auto"]

[dimensions.ledger]
domain = ["all-additive", "non-additive", "none"]

[[row]]
id = "overlap-x-bare-or-paired"
match = { decision = "decide" }
guard = { cloud_vs_floor = "equal", mode = ["bare", "paired"] }
emit = { verdict = "n/a" }

[[row]]
id = "overlap-y-paired-or-auto"
match = { decision = "decide" }
guard = { cloud_vs_floor = "equal", mode = ["paired", "paired-auto"] }
emit = { verdict = "n/a" }

# cloud already at or above the floor: pass regardless of mode/ledger (18 cells)
[[row]]
id = "at-or-above-floor"
match = { decision = "decide" }
guard = { cloud_vs_floor = ["equal", "above"] }
emit = { verdict = "pass" }

# cloud verification unreachable: block regardless (9 cells)
[[row]]
id = "unreachable"
match = { decision = "decide" }
guard = { cloud_vs_floor = "unreachable" }
emit = { verdict = "block" }

# below floor, bare mode: no pairing story, always block (3 cells)
[[row]]
id = "below-bare"
match = { decision = "decide" }
guard = { cloud_vs_floor = "below", mode = "bare" }
emit = { verdict = "block" }

# below floor, paired mode: human confirmed the exact tag, accept regardless of ledger (3 cells)
[[row]]
id = "below-paired"
match = { decision = "decide" }
guard = { cloud_vs_floor = "below", mode = "paired" }
emit = { verdict = "pass" }

# below floor, paired-auto, all-additive ledger: safe to deploy engine-first (1 cell)
[[row]]
id = "below-paired-auto-additive"
match = { decision = "decide" }
guard = { cloud_vs_floor = "below", mode = "paired-auto", ledger = "all-additive" }
emit = { verdict = "pass" }

# below-paired-auto-non-additive is DELETED here -- plants the coverage gap.
