# The flake quarantine (RDR-258 Phase 5, nexus-2jomg.6). One file, one list.
#
# A pytest test named here gets the `quarantine` marker at collection (tests/_quarantine.py), so no test file is
# edited to quarantine a test. Being listed changes nothing about whether the test runs in the default suite or
# in CI; the nightly job (.github/workflows/quarantine-nightly.yml) runs the listed tests several times a night.
# Taking quarantined tests out of the merge gate is Sam's decision and is not made here.
#
# Each entry, written by `scripts/quarantine_report.py add` (never by hand, so `source` is a real hash):
#   nodeid   pytest: the exact id, e.g. tests/test_x.py::TestY::test_z[param]; java: Class::method
#   kind     "pytest" or "java" (a java entry runs through surefire, -Dtest=Class#method)
#   since    the date it was quarantined (TOML date; today or yesterday, UTC)
#   deadline since + 14 days, checked whenever the registry is read (Sam, 2026-11-27)
#   bead     the bead that owns the fix
#   reason   one line: what flakes, and where; a test taken from the `unattributed` class carries the 2-week
#            review's reference here (`add --review`)
#   source   sha256 of the candidates file (`red_run_report.py candidates` output) the nodeid came from
#   path_source  (pytest entries, optional) how the report found the test's file path: "summary" or "traceback"
#
# A malformed registry fails every pytest run. The nightly passes each pytest nodeid to pytest, which exits 4 on a
# nodeid no test has, so a quarantine of a deleted or renamed test cannot rot there; an ordinary run never aborts
# on a stale entry.
# The code checks the format and that deadline = since + 14 days. It does not check `since` or the `--review`
# reference, which are policy: a hand edit of `since` resets the clock.
# A passing quarantined test is not released automatically: delete its entry by hand.
# Past its deadline a test is fixed or deleted, and `scripts/quarantine_report.py` exits 1 until then.
#
# [[quarantine]]
# nodeid = "tests/test_example.py::test_flaky"
# kind = "pytest"
# since = 2026-11-27
# deadline = 2026-12-11
# bead = "nexus-xxxxx"
# reason = "times out under pool load"
# source = "<64 hex digits>"
