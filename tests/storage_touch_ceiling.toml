# How many tests of a whole run may mint a tenant (nexus-zv8i7, epic nexus-aca0q).
#
# Since the opt-in flip (nexus-j23ni) a test mints a tenant only when it asks for one. Marks only
# get added and nothing flags a mark that is no longer needed, so the saving erodes one module mark
# at a time. The fan-in (tests/_storage_touch_fan_in.py, stdlib only) sums `provisioned` over the
# nx-storage-touch-report.json of every shard of one run and fails when the total is above
# `provisioned_tests` + `tolerance_tests`:
#
#   python -m tests._storage_touch_fan_in <dir holding the reports> --suite python_unit --shards 6
#
# The metric is a COUNT, summed across shards. A per-shard share against a worst-shard ceiling
# (the first design) flaps when a file crosses a chunk boundary and lets every lighter shard regress
# freely (nexus-2rhif recorded the same refutation for the DDL ratchet); the total does not depend
# on how the run was split. Each shard's own share stays in the fan-in output as advice.
#
# `tolerance_tests` is an absolute number of tests, an integer from 0 to 50. The count is
# deterministic for a given selection; the slack only covers tests that count here and skip on
# another host. Ceilings are reduce-only: the fan-in prints when one can be lowered, lower it in
# the commit that lowers the count; raising one needs a reviewed reason in that commit's message.
#
# "measure" means no full-run measurement exists yet. The fan-in then fails and prints the number
# to commit (a ceiling nobody set must not pass a run). The follow-up commit after the next full
# chas run (every report from ONE run, NX_STORAGE_TOUCH_SWEEP=1) replaces each "measure" with that
# total. No CI leg runs the fan-in yet. A shard (about 5600 tests) now asks the whole-run checks by
# itself above the collected-count floor in tests/_storage_touch_guard.py (SWEEP_AUTO_FLOOR), so its report
# already counts as a whole-run one for the fan-in; the docs-readers leg (1561) is below the floor and still needs
# the sweep switch exported on that leg (a CI change, left to nexus-0ite2's follow-up).
# Earlier per-shard measurements, chas lab-m, 55c082c63, for orientation only (2 of 6 shards):
#   shard1 409 of 5692, shard4 868 of 5615, docs-readers 581 of 1561.

[python_unit]
provisioned_tests = "measure"
tolerance_tests = 0

# The docs-readers CI leg runs a different selection (lint-marked docs files under the default
# substrate), so it has its own ceiling: pass `--suite docs_readers --shards 1` for it.
[docs_readers]
provisioned_tests = "measure"
tolerance_tests = 0
